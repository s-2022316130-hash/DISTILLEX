<!doctype html>
<!--
  Crude Unit — a working atmospheric distillation simulator in one file.

  Open it by double-clicking. No build step, no server, no dependencies, no
  network request of any kind: the fonts are the system stack and the WebGL
  shaders are inline strings.

  Extracted from DISTILLEX (MIT). The layer you would replace to simulate
  something else is the one marked `engine` in the script below; the scene,
  the flow sheet and the interface read whatever it returns.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crude Unit — atmospheric distillation simulator</title>
<meta name="description" content="A working atmospheric crude distillation simulator: pseudocomponent feed, Rachford–Rice flash, Wang–Henke stage cascade, in one self-contained HTML file.">
<meta name="color-scheme" content="dark light">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   CRUDE UNIT — design system

   An instrument, not a dashboard. Three ideas run through the whole file:

     1  DATA IS THE ONLY SATURATION.  The chrome is neutral from end to end.
        The only strongly coloured things on screen are the eleven process
        streams and the thermal ramp, because those colours carry meaning.
        The interface accent is indigo — deliberately outside the process
        ramp, which runs teal through crimson — so a control can never be
        mistaken for a stream.

     2  HIERARCHY BY SIZE, NOT BY DECORATION.  No coloured left borders, no
        badges, no gradients standing in for importance. A number that
        matters is set large and given room; one that does not is set small
        and grey. The ratio between the hero figures and the labels beneath
        them is about 3×.

     3  ONE PALETTE, TWO LIGHTS.  Dark and light are the same room with the
        lights changed, not two designs. Hue is held constant across the
        themes everywhere — surfaces, streams, thermal ramp — and only
        lightness and chroma move, so nothing changes identity when you
        flip the switch. Every value is generated in theme.js and every
        pairing is checked for contrast by the test suite.

   Type: the system stack, worked hard. No webfont is loaded — the page
   makes no network request of any kind — so the typographic character has
   to come from scale, tracking and rhythm rather than from a face. Numerals
   are tabular everywhere a figure can change.

   Grid: 4px. Every padding, gap and radius below is a multiple of it.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── tokens ─────────────────────────────────────────────────────────────
   Written by hand here to match theme.js exactly; the `theme` suite in
   tools/test.js asserts that the two never drift apart. */
:root {
  /* type scale — a minor third, snapped to whole pixels */
  --t-9:  9px;   --t-10: 10px;  --t-11: 11px;  --t-12: 12px;
  --t-13: 13px;  --t-15: 15px;  --t-18: 18px;  --t-22: 22px;  --t-30: 30px;

  /* the 4px grid */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;

  /* instruments have small radii — nothing here is blobby */
  --r-1: 4px; --r-2: 6px; --r-3: 10px; --r-4: 14px; --r-pill: 999px;

  --fast: 120ms; --base: 200ms; --slow: 340ms; --theme-x: 260ms;
  --ease:   cubic-bezier(.32,.72,.28,1);
  --spring: cubic-bezier(.34,1.42,.44,1);

  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI Variable Text',
          'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', sans-serif;
  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia,
           'Times New Roman', serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono',
          'Roboto Mono', Menlo, Consolas, monospace;
}

/* ── dark: the default ─────────────────────────────────────────────────── */
:root, [data-theme="dark"] {
  --floor:#090c13; --rail:#10141c; --panel:#171b24; --ctrl:#212630; --ctrl2:#2a2f3a;
  --line:#303540; --line2:#474d59;
  --ink:#f1f3f8; --ink2:#b0b6c2; --ink3:#9098a9;
  --accent:#7d95ff; --on-accent:#090f1c;
  --ok:#58da98; --warn:#f2b036; --err:#ffa09c; --busy:#3ecfff; --viol:#c9acff;

  --gas:#3ae3d3; --naphtha:#f1cd2e; --kerosene:#f8ae00; --diesel:#fa8927;
  --gasoil:#f16b40; --residue:#e84d64;
  --crude:#9e886e; --hot:#ff763b; --vapour:#39d4e4; --reflux:#49adec; --steam:#acd8e6;

  --sheet-ground:#0a0e17; --sheet-bg2:#0e1420; --sheet-shell:#121826;
  --sheet-block:#151c2b; --sheet-block-h:#1b2436; --sheet-block-on:#1d2940;
  --sheet-tray:#5d6f92; --sheet-label:#a7b6d2; --sheet-quiet:#8892a6;
  --sheet-num:#f0f5ff; --sheet-num-halo:rgba(5,9,18,.85);

  /* Elevation on a dark ground is carried by lightness and a lit top edge —
     a drop shadow on near-black is invisible. */
  --lift-1: inset 0 1px 0 rgba(255,255,255,.045);
  --lift-2: inset 0 1px 0 rgba(255,255,255,.06), 0 12px 28px rgba(0,0,0,.45);
  --lift-3: inset 0 1px 0 rgba(255,255,255,.07), 0 24px 60px rgba(0,0,0,.6);
  --glass: rgba(9,12,19,.78);
  --scrim: radial-gradient(130% 100% at 50% 0%, #0d1526 0%, #05070d 72%);
  --focus: 0 0 0 2px var(--floor), 0 0 0 4px var(--accent);
  --key-glow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent),
              0 8px 24px color-mix(in srgb, var(--accent) 22%, transparent);
  --hair-bright: rgba(255,255,255,.07);
}

/* ── light: the same room with the lights on ───────────────────────────── */
[data-theme="light"] {
  --floor:#f0f3f8; --rail:#fbfcff; --panel:#ffffff; --ctrl:#f8fafe; --ctrl2:#edf0f6;
  --line:#d6d9e0; --line2:#c0c4cd;
  --ink:#191e29; --ink2:#4f5767; --ink3:#5c6578;
  --accent:#4454df; --on-accent:#ffffff;
  --ok:#007d4d; --warn:#8b6000; --err:#b63039; --busy:#007494; --viol:#7a4aba;

  --gas:#009185; --naphtha:#9e8400; --kerosene:#ab7600; --diesel:#aa5600;
  --gasoil:#b33600; --residue:#ba003a;
  --crude:#7d684d; --hot:#c64900; --vapour:#00848f; --reflux:#006ca0; --steam:#568999;

  --sheet-ground:#eef1f7; --sheet-bg2:#e6ebf3; --sheet-shell:#ffffff;
  --sheet-block:#ffffff; --sheet-block-h:#f2f5fb; --sheet-block-on:#eaf0fe;
  --sheet-tray:#aab3c6; --sheet-label:#5c6578; --sheet-quiet:#6d7688;
  --sheet-num:#141a26; --sheet-num-halo:rgba(255,255,255,.9);

  /* In daylight elevation is a shadow — tinted with the accent's hue, never
     neutral black, so the shadows belong to the same colour world. */
  --lift-1: 0 1px 2px rgba(31,41,72,.05);
  --lift-2: 0 1px 2px rgba(31,41,72,.06), 0 10px 24px rgba(31,41,72,.07);
  --lift-3: 0 2px 4px rgba(31,41,72,.06), 0 22px 52px rgba(31,41,72,.12);
  --glass: rgba(255,255,255,.82);
  --scrim: radial-gradient(130% 100% at 50% 0%, #e9eef7 0%, #dbe2ee 74%);
  --focus: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent);
  --key-glow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),
              0 8px 22px color-mix(in srgb, var(--accent) 18%, transparent);
  --hair-bright: rgba(255,255,255,.9);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
  }
}

/* ── reset and page ─────────────────────────────────────────────────────── */
* { box-sizing: border-box }
html, body { height: 100% }
body {
  margin: 0; background: var(--floor); color: var(--ink);
  font-family: var(--sans); font-size: var(--t-13); line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow: hidden; text-wrap: pretty;
  transition: background var(--theme-x) var(--ease), color var(--theme-x) var(--ease);
}
button, input, select { font: inherit; color: inherit; font-variant-numeric: inherit }
button { -webkit-tap-highlight-color: transparent }
:focus { outline: none }
:focus-visible { box-shadow: var(--focus); border-radius: var(--r-2) }
::selection { background: color-mix(in srgb, var(--accent) 34%, transparent) }

.app { display: flex; flex-direction: column; height: 100% }

/* small-caps label, used everywhere a field is named */
.cap { font-size: var(--t-10); letter-spacing: .15em; text-transform: uppercase;
       font-weight: 600; color: var(--ink3); line-height: 1.3 }

/* ── the header ─────────────────────────────────────────────────────────── */
.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: var(--s-4);
  padding: 0 var(--s-4); min-height: 56px;
  border-bottom: 1px solid var(--line);
  background: var(--rail);
  transition: background var(--theme-x) var(--ease), border-color var(--theme-x) var(--ease);
}
/* identity lockup: a drawn mark, not an emoji, and not a coloured square */
.mark { display: flex; align-items: center; gap: var(--s-3); min-width: 0 }
.mark svg { width: 26px; height: 26px; flex: 0 0 auto; display: block }
.mark .wm { display: flex; flex-direction: column; min-width: 0; line-height: 1 }
.mark b { font-size: var(--t-13); font-weight: 680; letter-spacing: .19em;
          text-transform: uppercase; white-space: nowrap }
.mark span { font-size: var(--t-9); letter-spacing: .13em; text-transform: uppercase;
             color: var(--ink3); white-space: nowrap; margin-top: 3px }
.topbar .sp { margin-left: auto }
/* The control row can never push the page wider than the viewport: it
   scrolls sideways instead, at every width, so there is no band of sizes
   where the header overflows. */
.tools { display: flex; align-items: center; gap: var(--s-2);
         min-width: 0; flex: 0 1 auto; overflow-x: auto; overflow-y: hidden;
         scrollbar-width: none; -webkit-overflow-scrolling: touch;
         padding-bottom: 1px }
.tools::-webkit-scrollbar { display: none }
.tools > * { flex: 0 0 auto }
.rule { width: 1px; height: 22px; background: var(--line); flex: 0 0 auto }

/* segmented switch */
.segs { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-3);
        border: 1px solid var(--line); background: var(--ctrl);
        transition: background var(--theme-x) var(--ease), border-color var(--theme-x) var(--ease) }
.seg { appearance: none; border: 0; background: transparent; color: var(--ink3);
       font-size: var(--t-11); font-weight: 560; letter-spacing: .03em; cursor: pointer;
       padding: 0 var(--s-3); height: 28px; border-radius: var(--r-2); white-space: nowrap;
       transition: color var(--fast) var(--ease), background var(--fast) var(--ease) }
.seg:hover { color: var(--ink) }
.seg.on { color: var(--on-accent); background: var(--accent); font-weight: 620;
          box-shadow: 0 1px 2px rgba(0,0,0,.18) }

.ghost { display: inline-flex; align-items: center; gap: var(--s-2); height: 32px;
         padding: 0 var(--s-3); border: 1px solid var(--line); border-radius: var(--r-2);
         background: transparent; color: var(--ink2); font-size: var(--t-12);
         cursor: pointer; white-space: nowrap;
         transition: color var(--fast), border-color var(--fast), background var(--fast) }
.ghost:hover { color: var(--ink); border-color: var(--line2); background: var(--ctrl) }
.ghost.on { color: var(--accent); border-color: color-mix(in srgb,var(--accent) 42%,transparent);
            background: color-mix(in srgb,var(--accent) 10%,transparent) }
.ghost svg { width: 15px; height: 15px; flex: 0 0 auto }
.icon-btn { width: 32px; padding: 0; justify-content: center }

/* status readout — an instrument, so it is a fixed-width field, not a badge */
.pill { display: inline-flex; align-items: center; gap: var(--s-2); height: 30px;
        padding: 0 var(--s-3) 0 10px; border-radius: var(--r-2);
        font-size: var(--t-10); letter-spacing: .15em; font-weight: 680;
        border: 1px solid var(--line); background: var(--ctrl);
        white-space: nowrap; min-width: 132px;
        transition: color var(--base), border-color var(--base), background var(--base) }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor;
          box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
          flex: 0 0 auto }
.pill.idle { color: var(--ink3) }
.pill.busy { color: var(--busy); border-color: color-mix(in srgb,var(--busy) 42%,transparent);
             background: color-mix(in srgb,var(--busy) 9%, var(--ctrl)) }
.pill.busy i { animation: pulse 1.1s var(--ease) infinite }
.pill.ok   { color: var(--ok);   border-color: color-mix(in srgb,var(--ok) 36%,transparent);
             background: color-mix(in srgb,var(--ok) 8%, var(--ctrl)) }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb,var(--warn) 40%,transparent);
             background: color-mix(in srgb,var(--warn) 9%, var(--ctrl)) }
.pill.err  { color: var(--err);  border-color: color-mix(in srgb,var(--err) 44%,transparent);
             background: color-mix(in srgb,var(--err) 10%, var(--ctrl)) }
@keyframes pulse { 0%,100% { opacity:.3 } 50% { opacity:1 } }

/* ── three columns ──────────────────────────────────────────────────────── */
.cols { flex: 1 1 auto; min-height: 0; display: grid;
        grid-template-columns: 328px minmax(0,1fr) 364px }
.rail { min-height: 0; overflow: auto; overscroll-behavior: contain;
        background: var(--rail); display: flex; flex-direction: column;
        scrollbar-width: thin; scrollbar-color: var(--line2) transparent;
        transition: background var(--theme-x) var(--ease) }
.rail.l { border-right: 1px solid var(--line) }
.rail.r { border-left: 1px solid var(--line) }
.rail::-webkit-scrollbar { width: 10px }
.rail::-webkit-scrollbar-thumb { background: var(--line2); border-radius: var(--r-pill);
                                 border: 3px solid transparent; background-clip: content-box }
.rail::-webkit-scrollbar-thumb:hover { background: var(--ink3); background-clip: content-box }

/* ── the stage ──────────────────────────────────────────────────────────── */
.stage { position: relative; min-width: 0; min-height: 0; display: grid;
         background: var(--scrim);
         transition: background var(--theme-x) var(--ease) }
.stage.v-split { grid-template-rows: 1fr 1fr }
@media (min-width: 1800px) { .stage.v-split { grid-template-rows: none; grid-template-columns: 1fr 1fr } }
.vp { position: relative; min-width: 0; min-height: 0; overflow: hidden }
.vp[hidden] { display: none }
.vp + .vp { border-top: 1px solid var(--line) }
@media (min-width: 1800px) { .stage.v-split .vp + .vp { border-top: 0; border-left: 1px solid var(--line) } }
/* a vignette turns the viewport into a window rather than a rectangle of pixels */
.vp::after { content: ''; position: absolute; inset: 0; pointer-events: none;
             box-shadow: inset 0 0 120px 24px color-mix(in srgb, var(--floor) 55%, transparent) }
#gl { display: block; width: 100%; height: 100%; touch-action: none; outline: none }
#gl:focus-visible { box-shadow: inset 0 0 0 2px var(--accent) }
.ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2 }
.ov > * { pointer-events: auto }

/* instrument tags */
.tag { position: absolute; top: 0; left: 0; will-change: transform; opacity: 0;
       transform: translate3d(-999px,-999px,0); transition: opacity 180ms linear;
       display: flex; align-items: baseline; gap: var(--s-2); padding: 3px var(--s-2);
       font-size: var(--t-10); border-radius: var(--r-1);
       background: var(--glass); border: 1px solid var(--line2); color: var(--ink);
       backdrop-filter: blur(10px) saturate(1.3); -webkit-backdrop-filter: blur(10px) saturate(1.3);
       white-space: nowrap; pointer-events: none; box-shadow: var(--lift-1) }
.tag b { font-weight: 640; color: var(--accent); letter-spacing: .1em; font-size: var(--t-9) }
.tag .v { font-weight: 620 }
.tag u { text-decoration: none; color: var(--ink3); font-size: var(--t-9) }

#hover { position: absolute; top: 0; left: 0; will-change: transform; pointer-events: none;
         padding: 5px 10px; font-size: var(--t-12); border-radius: var(--r-2); white-space: nowrap;
         background: var(--glass); border: 1px solid var(--line2); box-shadow: var(--lift-2);
         backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px) }

#cams { position: absolute; left: 0; right: 0; bottom: var(--s-3); display: flex; gap: var(--s-1);
        padding: 0 var(--s-4) 2px; overflow-x: auto; scrollbar-width: none }
#cams::-webkit-scrollbar { display: none }
.cam { flex: 0 0 auto; appearance: none; border: 1px solid var(--line); border-radius: var(--r-pill);
       background: var(--glass); color: var(--ink3);
       font-size: var(--t-10); letter-spacing: .09em; text-transform: uppercase; font-weight: 600;
       padding: 0 12px; height: 28px; cursor: pointer;
       backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
       transition: color var(--fast), border-color var(--fast), background var(--fast) }
.cam:hover { color: var(--ink); border-color: var(--line2) }
.cam.on { color: var(--on-accent); background: var(--accent); border-color: transparent }

.hud { position: absolute; right: var(--s-4); bottom: 52px; display: flex; flex-direction: column;
       align-items: flex-end; gap: var(--s-2); max-width: 36%; text-align: right;
       font-size: var(--t-9); letter-spacing: .1em; color: var(--ink3); text-transform: uppercase }
.hud .r { display: flex; gap: var(--s-2); align-items: center }
.hud button { appearance: none; border: 1px solid var(--line); border-radius: var(--r-2);
              background: var(--glass); color: var(--ink3); font-size: var(--t-9);
              letter-spacing: .09em; text-transform: uppercase; padding: 0 10px;
              height: 26px; cursor: pointer; backdrop-filter: blur(10px) }
.hud button:hover { color: var(--ink) }
#fps { font-variant-numeric: tabular-nums; min-width: 46px }

/* the component card */
#info { position: absolute; left: var(--s-4); top: var(--s-4); width: min(336px, calc(100% - 32px));
        max-height: calc(100% - 32px); overflow: auto; overscroll-behavior: contain;
        border-radius: var(--r-4); border: 1px solid var(--line2);
        background: var(--glass); backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        box-shadow: var(--lift-3);
        padding: var(--s-4) var(--s-4) var(--s-3); display: flex; flex-direction: column; gap: var(--s-3);
        animation: card 280ms var(--spring) both }
#info[hidden] { display: none }
@keyframes card { from { opacity:0; transform:translateY(-10px) scale(.97) } to { opacity:1; transform:none } }
#info h3 { margin: 0; font-size: var(--t-18); font-weight: 640; letter-spacing: -.008em; line-height: 1.2 }
#info dl { margin: 0; display: grid; gap: var(--s-3) }
#info dt { font-size: var(--t-9); letter-spacing: .15em; text-transform: uppercase;
           font-weight: 600; color: var(--ink3) }
#info dd { margin: 3px 0 0; font-size: var(--t-12); line-height: 1.6; color: var(--ink2) }
#info .reads { display: flex; flex-wrap: wrap; gap: var(--s-1);
               border-top: 1px solid var(--line); padding-top: var(--s-3) }
#info .reads span { font-size: var(--t-11); padding: 4px var(--s-2); border-radius: var(--r-1);
                    background: var(--ctrl); border: 1px solid var(--line); color: var(--ink3) }
#info .reads b { color: var(--ink); font-weight: 640 }
#info .x { position: absolute; right: 10px; top: 10px; width: 26px; height: 26px;
           border-radius: var(--r-2); appearance: none; border: 1px solid transparent;
           background: transparent; color: var(--ink3); cursor: pointer; font-size: 15px; line-height: 1 }
#info .x:hover { color: var(--ink); border-color: var(--line); background: var(--ctrl) }

#tour { position: absolute; left: 50%; transform: translateX(-50%); bottom: 56px;
        width: min(580px, calc(100% - 32px)); border-radius: var(--r-4);
        border: 1px solid color-mix(in srgb, var(--viol) 40%, var(--line));
        background: var(--glass); backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: var(--lift-3);
        padding: var(--s-3) var(--s-4); display: flex; gap: var(--s-4); align-items: flex-start;
        animation: card 320ms var(--spring) both }
#tour[hidden] { display: none }
#tour .n { font-size: var(--t-10); letter-spacing: .15em; font-weight: 640; color: var(--viol);
           white-space: nowrap; padding-top: 3px }
#tour h4 { margin: 0 0 3px; font-size: var(--t-15); font-weight: 640; letter-spacing: -.005em }
#tour p { margin: 0; font-size: var(--t-12); line-height: 1.6; color: var(--ink2) }

#glfail { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--s-8);
          text-align: center; font-size: var(--t-13); color: var(--ink2); line-height: 1.7;
          max-width: 46ch; margin: 0 auto }
#glfail[hidden] { display: none }

/* ── the operator panel ─────────────────────────────────────────────────── */
.sec { border-bottom: 1px solid var(--line) }
.sec > button { width: 100%; appearance: none; border: 0; background: transparent; cursor: pointer;
                display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4);
                text-align: left; color: var(--ink); min-height: 48px;
                transition: background var(--fast) }
.sec > button:hover { background: var(--ctrl) }
.sec .t { font-size: var(--t-11); letter-spacing: .14em; text-transform: uppercase; font-weight: 640 }
.sec .c { margin-left: auto; color: var(--ink3); width: 16px; height: 16px; flex: 0 0 auto;
          transition: transform var(--base) var(--ease) }
.sec .c.open { transform: rotate(45deg) }
.sec .secbody { padding: 0 var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-4) }
.hint { font-size: var(--t-11); line-height: 1.55; color: var(--ink3); margin: -6px 0 0 }

.fld { display: flex; flex-direction: column; gap: 6px }
.fld .top { display: flex; align-items: baseline; gap: var(--s-2) }
.fld label { font-size: var(--t-12); color: var(--ink2); line-height: 1.35 }
.fld .v { margin-left: auto; font-size: var(--t-15); font-weight: 660; letter-spacing: -.01em;
          white-space: nowrap; color: var(--ink) }
.fld .u { font-size: var(--t-10); color: var(--ink3); white-space: nowrap }
.fld .help { font-size: var(--t-10); line-height: 1.5; color: var(--ink3) }
.fld input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px;
                         background: transparent; cursor: pointer; margin: 0; display: block }
.fld input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent) var(--p,0%), var(--line) var(--p,0%)) }
.fld input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line) }
.fld input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent) }
.fld input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; margin-top: -5px; background: var(--panel);
  border: 3px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform var(--fast) var(--ease), box-shadow var(--fast) }
.fld input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%;
  background: var(--panel); border: 3px solid var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.3) }
.fld input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15) }
.fld input[type=range]:active::-webkit-slider-thumb { transform: scale(1.05); box-shadow: var(--key-glow) }
.fld input[type=range]:focus-visible { box-shadow: none }
.fld input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: var(--key-glow) }

.assays { display: flex; flex-direction: column; gap: var(--s-1) }
.assay { appearance: none; text-align: left; cursor: pointer; display: flex; align-items: center;
         gap: var(--s-3); padding: 11px var(--s-3); min-height: 46px; border-radius: var(--r-2);
         border: 1px solid var(--line); background: var(--ctrl); color: var(--ink);
         transition: border-color var(--fast), background var(--fast), transform var(--fast) }
.assay:hover { border-color: var(--line2); background: var(--ctrl2) }
.assay.on { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 11%, var(--ctrl));
            box-shadow: inset 2px 0 0 var(--accent) }
.assay .nm { font-size: var(--t-13); font-weight: 580 }
.assay .api { margin-left: auto; font-size: var(--t-11); color: var(--ink3); white-space: nowrap;
              font-weight: 560 }
.assay.on .api { color: var(--accent) }

.runblock { position: sticky; bottom: 0; margin-top: auto; padding: var(--s-3) var(--s-4) var(--s-4);
            border-top: 1px solid var(--line);
            background: linear-gradient(180deg, color-mix(in srgb,var(--rail) 55%,transparent), var(--rail) 36%);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; flex-direction: column; gap: var(--s-2); z-index: 3 }
.go { appearance: none; border: 0; cursor: pointer; width: 100%; min-height: 46px;
      border-radius: var(--r-3); font-size: var(--t-12); font-weight: 680; letter-spacing: .12em;
      text-transform: uppercase; color: var(--on-accent); background: var(--accent);
      box-shadow: var(--key-glow);
      transition: transform var(--fast), box-shadow var(--fast), filter var(--fast),
                  background var(--base) }
.go:hover { filter: brightness(1.08); transform: translateY(-1px) }
.go:active { transform: translateY(0); filter: brightness(.96) }
.go.dirty { background: var(--warn); color: var(--floor);
            box-shadow: 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent),
                        0 8px 22px color-mix(in srgb,var(--warn) 22%,transparent) }
.go[disabled] { opacity: .6; cursor: progress; transform: none }
.mini { display: flex; gap: var(--s-1) }
.mini button { flex: 1; appearance: none; cursor: pointer; min-height: 34px; border-radius: var(--r-2);
               border: 1px solid var(--line); background: transparent; color: var(--ink3);
               font-size: var(--t-11); letter-spacing: .02em;
               transition: color var(--fast), border-color var(--fast), background var(--fast) }
.mini button:hover { color: var(--ink); border-color: var(--line2); background: var(--ctrl) }

/* ── results ────────────────────────────────────────────────────────────── */
.blk { padding: var(--s-4); border-bottom: 1px solid var(--line);
       display: flex; flex-direction: column; gap: var(--s-3) }

/* The headline figures. No coloured rule, no badge: the numeral itself
   carries the colour, because in this interface colour means something. */
.figs { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px;
        background: var(--line); border: 1px solid var(--line); border-radius: var(--r-3);
        overflow: hidden }
.fig { padding: var(--s-3); background: var(--panel); display: flex; flex-direction: column;
       gap: 2px; min-width: 0; transition: background var(--fast) }
.fig .n { font-size: var(--t-22); font-weight: 680; line-height: 1.1; letter-spacing: -.02em;
          font-variant-numeric: tabular-nums }
.fig .u { font-size: var(--t-9); color: var(--ink3); letter-spacing: .06em }
.fig .k { font-size: var(--t-9); letter-spacing: .13em; text-transform: uppercase;
          font-weight: 600; color: var(--ink3); line-height: 1.3; margin-top: 3px }

.row { display: flex; align-items: baseline; gap: var(--s-3); font-size: var(--t-12);
       padding: 7px 0; border-bottom: 1px solid var(--line) }
.row:last-child { border-bottom: 0 }
.row .k { color: var(--ink2); min-width: 0 }
.row .v { margin-left: auto; font-weight: 620; white-space: nowrap; color: var(--ink) }
.row .p { color: var(--ink3); font-size: var(--t-11); white-space: nowrap; min-width: 52px;
          text-align: right }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; align-self: center }

.note { font-size: var(--t-11); line-height: 1.6; color: var(--ink3) }
.msg { display: flex; gap: var(--s-2); font-size: var(--t-11); line-height: 1.6;
       padding: 11px var(--s-3); border-radius: var(--r-2); border: 1px solid;
       background: var(--ctrl) }
.msg b { flex: 0 0 auto; font-size: var(--t-13); line-height: 1.4; font-weight: 700 }
.msg.ok   { border-color: color-mix(in srgb,var(--ok) 32%,transparent);
            background: color-mix(in srgb,var(--ok) 7%, var(--ctrl)); color: var(--ok) }
.msg.warn { border-color: color-mix(in srgb,var(--warn) 36%,transparent);
            background: color-mix(in srgb,var(--warn) 8%, var(--ctrl)); color: var(--warn) }
.msg.err  { border-color: color-mix(in srgb,var(--err) 40%,transparent);
            background: color-mix(in srgb,var(--err) 9%, var(--ctrl)); color: var(--err) }
.msg span { color: var(--ink2) }
.msg.ok span, .msg.warn span, .msg.err span { color: color-mix(in srgb, currentColor 62%, var(--ink)) }

.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: 3px var(--s-3); align-items: baseline;
        width: 100%; text-align: left; cursor: pointer; appearance: none; border: 0;
        border-radius: var(--r-2); padding: var(--s-2) 10px; background: transparent; color: var(--ink);
        font-size: var(--t-11); transition: background var(--fast) }
.hrow:hover { background: var(--ctrl) }
.hrow.now { background: var(--ctrl); box-shadow: inset 2px 0 0 var(--accent) }
.hrow .at { color: var(--ink3) }
.hrow .y { font-weight: 660; font-size: var(--t-12) }
.hrow .m { grid-column: 1 / -1; color: var(--ink3); font-size: var(--t-10) }

.stgs { display: flex; flex-direction: column; gap: 1px; max-height: 260px; overflow: auto;
        scrollbar-width: thin; scrollbar-color: var(--line2) transparent }
.stg { display: grid; grid-template-columns: 10px 1fr auto auto; gap: var(--s-2); align-items: baseline;
       padding: 6px var(--s-2); font-size: var(--t-11); border-radius: var(--r-1);
       width: 100%; text-align: left; appearance: none; border: 0; background: transparent;
       color: var(--ink); cursor: pointer; min-height: 30px; transition: background var(--fast) }
.stg:hover { background: var(--ctrl) }
.stg.on { background: var(--ctrl); box-shadow: inset 2px 0 0 var(--accent) }
.stg:has(.x) { grid-template-columns: 10px 1fr auto auto auto auto }
.stg i { width: 8px; height: 8px; border-radius: 50%; align-self: center }
.stg .l { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.stg .t { font-weight: 640; color: var(--ink) }
.stg .p { color: var(--ink3); font-size: var(--t-10) }
.stg .x { color: var(--ink3); font-size: var(--t-10) }
.stg.k-draw .l { color: var(--warn) }
.stg.k-cond .l, .stg.k-sump .l { color: var(--accent) }

.det { border-top: 1px solid var(--line) }
.det summary { cursor: pointer; padding: var(--s-3) var(--s-4); font-size: var(--t-10);
               letter-spacing: .15em; text-transform: uppercase; font-weight: 600;
               color: var(--ink3); list-style: none; min-height: 44px;
               display: flex; align-items: center; gap: var(--s-2) }
.det summary::-webkit-details-marker { display: none }
.det summary::after { content: ''; margin-left: auto; width: 9px; height: 9px;
                      border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
                      transform: rotate(45deg) translate(-2px,-2px);
                      transition: transform var(--base) var(--ease) }
.det[open] summary::after { transform: rotate(225deg) translate(-2px,-2px) }
.det summary:hover { color: var(--ink) }
.det .dbody { padding: 0 var(--s-4) var(--s-4) }
.det ul { margin: 0; padding-left: var(--s-4) }
.det li { font-size: var(--t-11); line-height: 1.65; color: var(--ink3); margin-bottom: var(--s-2) }

/* ── the yield ribbon + product strip ───────────────────────────────────── */
/* The ribbon is the material balance drawn as one bar: the whole charge,
   segmented by where it left the unit. It is the strip's header and a chart
   at the same time. */
.ribbon { flex: 0 0 auto; display: flex; height: 6px; background: var(--line);
          border-top: 1px solid var(--line) }
.ribbon i { display: block; height: 100%; transition: width var(--slow) var(--ease),
            opacity var(--base), filter var(--fast) }
.ribbon i.dim { opacity: .28 }
.products { flex: 0 0 auto; display: grid; gap: 1px; background: var(--line);
            grid-template-columns: repeat(6, minmax(0,1fr)) }
.prod { appearance: none; border: 0; cursor: pointer; text-align: left; background: var(--rail);
        color: var(--ink); padding: 11px var(--s-3) var(--s-3); min-width: 0; display: flex;
        flex-direction: column; gap: 1px; position: relative;
        transition: background var(--fast) }
.prod:hover { background: var(--ctrl) }
.prod.on { background: var(--ctrl) }
.prod.on::after { content: ''; position: absolute; inset: auto 0 0 0; height: 2px;
                  background: var(--pc) }
.prod .nm { font-size: var(--t-9); letter-spacing: .13em; text-transform: uppercase;
            font-weight: 600; color: var(--ink3); white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis }
.prod .n { font-size: var(--t-30); font-weight: 660; line-height: 1.02; letter-spacing: -.028em;
           color: var(--pc); margin-top: 2px }
.prod .n small { font-size: var(--t-11); font-weight: 600; letter-spacing: .04em;
                 color: var(--ink3); margin-left: 5px }
.prod .d { font-size: var(--t-10); color: var(--ink3); margin-top: 3px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

/* ── the flow sheet ─────────────────────────────────────────────────────── */
.d2 { position: relative; width: 100%; height: 100%; display: grid; place-items: center;
      background: radial-gradient(110% 95% at 50% 0%, var(--sheet-bg2), var(--sheet-ground) 74%);
      overflow: hidden; transition: background var(--theme-x) var(--ease) }
.d2 svg { width: 100%; height: 100%; max-height: 100% }
.d2-blk { fill: var(--sheet-block); stroke: var(--line2); stroke-width: 1.2; cursor: pointer;
          transition: fill var(--base) var(--ease), stroke var(--base) }
.d2-blk:hover { fill: var(--sheet-block-h); stroke: var(--accent) }
.d2-blk.on { fill: var(--sheet-block-on); stroke: var(--accent);
             filter: drop-shadow(0 0 7px color-mix(in srgb,var(--accent) 45%,transparent)) }
.d2-shell { fill: none !important; stroke: var(--line2); stroke-width: 1.4; cursor: pointer }
.d2-shell:hover { stroke: var(--accent) }
.d2-shell.on { stroke: var(--accent); stroke-width: 1.8;
               filter: drop-shadow(0 0 8px color-mix(in srgb,var(--accent) 50%,transparent)) }
.d2-lbl { fill: var(--sheet-label); font-size: 8.5px; letter-spacing: .14em; pointer-events: none;
          font-weight: 600 }
.d2-sub { fill: var(--accent); font-size: 9.5px; font-weight: 680; pointer-events: none }
.d2-tag { letter-spacing: .16em; pointer-events: none; font-weight: 600 }
.d2-tray { stroke: var(--sheet-tray); stroke-width: 1 }
.d2-pipe { fill: none; stroke-linecap: round; stroke-linejoin: round; cursor: pointer }
.d2-halo { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .18;
           filter: blur(3px); pointer-events: none }
.d2-trace { fill: none; stroke-linecap: round; stroke: var(--sheet-num);
            stroke-dasharray: 3 26; pointer-events: none }
.d2-out { cursor: pointer }
.d2-out .nm { font-size: 9px; letter-spacing: .11em; text-transform: uppercase; font-weight: 640 }
.d2-out .r { fill: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: -.01em }
.d2-out .sm { fill: var(--sheet-quiet); font-size: 9px }
.d2-out:hover .r { fill: var(--accent) }
.d2-tick { stroke-width: 1.4; opacity: .85 }
.d2-tin { fill: var(--sheet-num); font-size: 10px; font-weight: 680; pointer-events: none;
          paint-order: stroke; stroke: var(--sheet-num-halo); stroke-width: 3px;
          stroke-linejoin: round }
@keyframes d2Flow { from { stroke-dashoffset: 58 } to { stroke-dashoffset: 0 } }

/* ── charts ─────────────────────────────────────────────────────────────── */
.chart { width: 100%; height: auto; display: block; overflow: visible }
.chart .ax { stroke: var(--line2); stroke-width: 1 }
.chart .lbl { fill: var(--ink3); font-size: 8.5px }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: round;
             stroke-linecap: round }
.chart .tr { fill: none; stroke: var(--viol); stroke-width: 1.5; stroke-linejoin: round }

/* ── signature and toast ────────────────────────────────────────────────── */
.sig { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
       padding: 9px 0 10px; border-top: 1px solid var(--line); line-height: 1.2;
       background: var(--rail) }
.sig::before, .sig::after { content: ''; width: 28px; height: 1px; flex: 0 0 auto;
                            background: var(--line) }
.sig::before { margin-right: 14px } .sig::after { margin-left: 14px }
.sig b { font-family: var(--serif); font-style: italic; font-weight: 400;
         font-size: var(--t-12); letter-spacing: .05em; color: var(--ink3) }

#toast { position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%);
         padding: 11px var(--s-5); border-radius: var(--r-3); font-size: var(--t-12);
         background: var(--panel); border: 1px solid var(--line2); z-index: 40;
         box-shadow: var(--lift-3); animation: card 240ms var(--spring) both }
#toast[hidden] { display: none }

/* ── responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 1280px) {
  .cols { grid-template-columns: 296px minmax(0,1fr) 320px }
  .products { grid-template-columns: repeat(3, minmax(0,1fr)) }

}

  body { overflow: auto }
  .app { height: auto; min-height: 100% }

  .rail.l, .rail.r { border: 0; border-top: 1px solid var(--line); overflow: visible }
  .runblock { position: sticky; bottom: 0 }
  .products { grid-template-columns: repeat(2, minmax(0,1fr)) }
  #info { width: min(300px, calc(100% - 24px)) }
}

  .topbar { flex-wrap: wrap; padding: var(--s-2) var(--s-3); gap: var(--s-2) var(--s-3);
            min-height: 0 }

  .tools { order: 9; flex: 1 0 100% }

}
@media (max-width: 620px) {
  #cams { bottom: var(--s-2); padding: 0 var(--s-3) 2px }
  .cam { padding: 0 10px; font-size: var(--t-9); height: 26px }
  .hud { bottom: 46px; right: var(--s-3); max-width: 140px }
  .hud #degrade { display: none }
  #tour { bottom: 50px; padding: var(--s-3); gap: var(--s-3) }
  .tag { font-size: var(--t-9); padding: 2px 6px }
  #info { left: var(--s-3); top: var(--s-3); padding: var(--s-3) }

}

  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important;
                           transition-duration: 1ms !important }

}

<body>
<div class="app">

  <header class="topbar">
    <div class="mark">
      <!-- A drawn mark: a tower in section, with its draw trays. Nothing here
           is an emoji or a coloured rectangle standing in for a logo. -->
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M8 3.5h8v17H8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M8 7.5h8M8 11h8M8 14.5h8M8 18h8" stroke="currentColor" stroke-width="1" opacity=".5"/>
        <path d="M16 9.2h3.4M16 12.7h3.4M16 16.2h3.4M4.6 5.6H8" stroke="var(--accent)"
              stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="1.8" r="1.1" fill="var(--accent)"/>
      </svg>
      <span class="wm">
        <b>Crude&nbsp;Unit</b>
        <span>Atmospheric distillation</span>
      </span>
    </div>

    <span class="sp"></span>
    <span class="pill idle" id="pill" role="status" aria-live="polite"><i></i>READY</span>

    <div class="tools" id="tools"></div>
  </header>

  <div class="cols">

    <!-- ── operator control rail ──────────────────────────────────────── -->
    <div class="rail l">
      <div id="panel"></div>
      <div class="runblock">
        <button class="go" id="run">Run simulation</button>
        <div class="mini">
          <button id="reset">Reset</button>
          <button id="save">Save case</button>
          <button id="loadbtn">Load case</button>
        </div>
        <input type="file" id="loadfile" accept="application/json" style="display:none">
      </div>
    </div>

    <!-- ── the stage: the scene and the flow sheet, one state ─────────── -->
    <div class="stage v-3d" id="stage">
      <div class="vp" id="vp3d">
        <canvas id="gl" tabindex="0" role="img"
                aria-label="Three-dimensional model of an atmospheric crude distillation unit. Drag to orbit, scroll to zoom, click a component to inspect it. The results panel lists every stage and product as text."></canvas>
        <div class="ov">
          <div id="tags"></div>
          <div id="hover" hidden></div>
          <div id="info" hidden></div>
          <div id="tour" hidden></div>
          <div id="cams"></div>
          <div class="hud">
            <span id="degrade" hidden></span>
            <div class="r">
              <button id="flowbtn">Pause flow</button>
              <span id="fps">&mdash;</span>
            </div>
          </div>
        </div>
        <div id="glfail" hidden></div>
      </div>
      <div class="vp" id="vp2d" hidden>
        <div class="d2" id="d2"></div>
      </div>
    </div>

    <!-- ── results rail ───────────────────────────────────────────────── -->
    <div class="rail r" id="results"></div>
  </div>

  <!-- the charge, drawn as one bar: the material balance and the strip's
       header at the same time -->
  <div class="ribbon" id="ribbon" role="img" aria-label="Product yield, as a share of the charge"></div>
  <div class="products" id="products"></div>
  <div class="sig"><b>Shafin Ahamed Neon</b></div>
</div>
<div id="toast" hidden></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   The simulator, in eight layers. Nothing below computes a process
   quantity except engine.js — everything else reads what it produced.

     theme      the design system, as data: two themes, one palette
     glmath     vectors, matrices, the camera spring
     geometry   parametric meshes, built in unit frames
     plant      the unit itself: geometry, streams, instruments
     renderer   the WebGL scene: instancing, id-buffer picking, tracers
     engine     the simulation
     info       what each component is; camera presets; the guided tour
     view2d     the process flow sheet, from the same result
     ui         the interface
   ══════════════════════════════════════════════════════════════════════ */
/* rig/theme.js — inlined by tools/build.py */
/* ════════════════════════════════════════════════════════════════════════
   theme.js — the design system, as data.

   One file holds every colour the simulator uses, in two themes, and every
   other layer reads from here: the WebGL scene, the flow sheet, the charts
   and the interface. Nothing downstream owns a colour of its own.

   ── How the palette was built ──────────────────────────────────────────
   Everything was designed in OKLCH and converted, so lightness means the
   same thing across hues and the two themes are the same palette under
   different light rather than two unrelated sets.

   HUE IS HELD CONSTANT between themes. Only lightness and chroma move. A
   stream therefore keeps its identity when the lights come on: diesel is
   the same orange, darker.

   Two stream families, so a product is never mistaken for a utility:

     PRODUCTS  a sequential ramp, cold to hot — which is also the order of
               boiling point, and roughly how a jar of each cut actually
               looks: wet gas a colourless vapour, naphtha pale straw,
               kerosene amber, diesel orange-brown, gas oil dark amber,
               residue nearly black-red.
     UTILITIES cool or neutral. Crude is deliberately the dullest line on
               the plot because it is the one stream that has not been
               separated into anything yet.

   Lightness RAMPS DOWN as the cut gets heavier. A flat lightness across the
   warm half of the gamut cannot hold chroma — diesel, gas oil and residue
   collapse into one washed salmon — and the ramp is physically truthful.

   The interface accent is indigo, deliberately outside the process ramp
   (teal through crimson), so the chrome can never be mistaken for a stream.

    for (var cc = 0; cc < 4; cc++)

          D.furX + (cc < 2 ? -1 : 1) * D.furW*0.5, fy + 0.6, D.furZ + (cc % 2 ? -1 : 1) * D.furD*0.5,
          0.45, D.furH, 0.45), 'furnace');
    // convection section: a narrower box on top carrying the tube bank
    var cvH = 4.2, cvY = D.furH + 1.1 + cvH/2;
    add('box', MAT.furnace, M.trs(M.m4(), D.furX + D.furW*0.16, cvY, D.furZ,
        D.furW*0.56, cvH, D.furD*0.82), 'furnace');
    for (var tb = 0; tb < 6; tb++)
      add('cyl', MAT.shell, M.alignY(M.m4(),
          [D.furX + D.furW*0.16 - D.furW*0.24, D.furH + 1.6 + tb*0.62, D.furZ - D.furD*0.38],
          [0, 0, D.furD*0.76], 0.16), 'furnace');
    // radiant-section tubes, hung down the inside of both long walls and
    // visible past the casing: the part of a heater that actually does the work
    // Casing stiffeners: the vertical ribs that carry a firebox wall. Spaced
    // like structure rather than like siding, and in the casing's own colour.
    for (var rt = 0; rt < 7; rt++) {
      var rtx = D.furX - D.furW*0.40 + rt * (D.furW*0.80 / 6);
      add('box', MAT.stack, M.trs(M.m4(), rtx, D.furH/2 + 0.6, D.furZ + D.furD*0.505,
          0.34, D.furH - 0.6, 0.30), 'furnace');
      add('box', MAT.stack, M.trs(M.m4(), rtx, D.furH/2 + 0.6, D.furZ - D.furD*0.505,
          0.34, D.furH - 0.6, 0.30), 'furnace');
    }
    // the burner deck: a platform along the fired face, with a handrail
    var bdY = 3.4, bdZ = D.furZ + D.furD*0.5 + 1.5;
    add('box', MAT.grate, M.trs(M.m4(), D.furX, bdY, bdZ, D.furW*1.06, 0.16, 2.9), 'furnace');
    for (var bp = 0; bp < 9; bp++) {
      var bpx = D.furX - D.furW*0.5 + bp * (D.furW / 8);
      add('cyl', MAT.rail, M.trs(M.m4(), bpx, bdY, bdZ + 1.4, 0.05, 1.1, 0.05), 'furnace');
      cylBetween([bpx, 0, bdZ + 1.2], [bpx, bdY, bdZ + 1.2], 0.07, MAT.struct, 'furnace');
    }
    cylBetween([D.furX - D.furW*0.53, bdY + 1.05, bdZ + 1.4],
               [D.furX + D.furW*0.53, bdY + 1.05, bdZ + 1.4], 0.05, MAT.rail, 'furnace');
    cylBetween([D.furX - D.furW*0.53, bdY + 0.55, bdZ + 1.4],
               [D.furX + D.furW*0.53, bdY + 0.55, bdZ + 1.4], 0.05, MAT.rail, 'furnace');
    // the crossover header that ties them together at the top
    add('cyl', MAT.coil, M.alignY(M.m4(), [D.furX - D.furW*0.46, D.furH + 0.4, D.furZ + D.furD*0.51],
        [D.furW*0.92, 0, 0], 0.26), 'furnace');
    // stack: a transition cone off the convection section, then the barrel
    var stkX = D.furX + D.furW*0.34, stkY = cvY + cvH/2;
    add('cone', MAT.stack, M.trs(M.m4(), stkX, stkY - 1.8, D.furZ, 2.4, 1.9, 2.4), 'furnace');
    add('cylCap', MAT.stack, M.trs(M.m4(), stkX, stkY, D.furZ, 1.5, D.stackH, 1.5), 'furnace');
    add('cone', MAT.stack, M.trs(M.m4(), stkX, stkY + D.stackH, D.furZ, 1.5, 1.2, 1.5), 'furnace');
    add('ringThin', MAT.struct, M.trs(M.m4(), stkX, stkY + D.stackH*0.34, D.furZ, 1.72, 1, 1.72), 'furnace');
    // a ladder up the barrel and the platform it lands on. Painted steel, not
    // safety yellow: on a stack that height only the handrail is picked out.
    var plY = stkY + D.stackH * 0.66;
    add('annulus', MAT.grate, M.trs(M.m4(), stkX, plY, D.furZ, 2.6, 1, 2.6), 'furnace');
    cylBetween([stkX - 1.65, stkY, D.furZ - 0.34], [stkX - 1.65, plY, D.furZ - 0.34], 0.055, MAT.struct, 'furnace');
    cylBetween([stkX - 1.65, stkY, D.furZ + 0.34], [stkX - 1.65, plY, D.furZ + 0.34], 0.055, MAT.struct, 'furnace');
    for (var sl = 0; sl * 0.45 < plY - stkY; sl++)
      add('cyl', MAT.struct, M.alignY(M.m4(), [stkX - 1.65, stkY + sl * 0.45, D.furZ - 0.34],
          [0, 0, 0.68], 0.042), 'furnace');
    for (var sq = 0; sq < 16; sq++) {
      var sa = sq / 16 * Math.PI * 2;
      add('cyl', MAT.rail, M.trs(M.m4(), stkX + Math.cos(sa)*2.6, plY, D.furZ + Math.sin(sa)*2.6,
          0.045, 1.1, 0.045), 'furnace');
    }
    add('ringThin', MAT.rail, M.trs(M.m4(), stkX, plY + 1.05, D.furZ, 2.6, 1, 2.6), 'furnace');
    add('ringThin', MAT.rail, M.trs(M.m4(), stkX, plY + 0.55, D.furZ, 2.6, 1, 2.6), 'furnace');
    // burner row along the base and an access door
    for (var bq = 0; bq < 5; bq++) {
      var bx = D.furX - D.furW*0.34 + bq * D.furW*0.17;
      add('cylCap', MAT.struct, M.alignY(M.m4(), [bx, 2.0, D.furZ + D.furD*0.5],
          [0, 0, 0.7], 0.34), 'furnace');
      add('ringThin', MAT.struct, M.alignY(M.m4(), [bx, 2.0, D.furZ + D.furD*0.5 + 0.7],
          [0, 0, 0.12], 0.52), 'furnace');
    }
    add('box', MAT.struct, M.trs(M.m4(), D.furX - D.furW*0.26, 3.2, D.furZ + D.furD*0.51,
        1.6, 3.0, 0.14), 'furnace');
    // the stair up the side
    var stA = [D.furX - D.furW*0.54 - 1.0, 0.2, D.furZ - D.furD*0.3 - 0.42];
    var stB = [D.furX - D.furW*0.54 - 1.0, 1.4 + 12*0.78, D.furZ - D.furD*0.3 + 12*0.42];
    for (var sp3 = 0; sp3 < 12; sp3++)
      add('box', MAT.grate, M.trs(M.m4(), D.furX - D.furW*0.54 - 1.0, 1.4 + sp3*0.78,
          D.furZ - D.furD*0.3 + sp3*0.42, 1.5, 0.09, 0.5), 'furnace');
    for (var sg2 = 0; sg2 < 2; sg2++) {
      var sgx = D.furX - D.furW*0.54 - 1.0 + (sg2 ? 0.78 : -0.78);
      cylBetween([sgx, stA[1], stA[2]], [sgx, stB[1] - 0.3, stB[2]], 0.09, MAT.struct, 'furnace');
      cylBetween([sgx, stA[1] + 1.05, stA[2]], [sgx, stB[1] + 0.75, stB[2]], 0.05, MAT.rail, 'furnace');
    }
    anchors.furnace = [D.furX, D.furH + 8, D.furZ];
    anchors.firebox = [D.furX, D.furH * 0.42, D.furZ + D.furD * 0.5];

    /* ── side strippers ───────────────────────────────────────────────── */
    var sideKeys = ['kerosene', 'diesel', 'gasoil'];
    var sideY = [skirtTop + 30, skirtTop + 21, skirtTop + 13];
    anchors.side = {};
    for (var sI = 0; sI < 3; sI++) {
      var sx = D.stripX, sz = -5 + sI * 5;
      var sy = sideY[sI] - D.stripH - 2;
      add('cyl', MAT.insul, M.trs(M.m4(), sx, sy, sz, D.stripR, D.stripH, D.stripR), 'sidedraw');
      add('dish', MAT.head, M.trs(M.m4(), sx, sy + D.stripH, sz, D.stripR, D.stripR, D.stripR), 'sidedraw');
      add('dish', MAT.head, M.trs(M.m4(), sx, sy, sz, D.stripR, -D.stripR, D.stripR), 'sidedraw');
      add('cone', MAT.struct, M.trs(M.m4(), sx, 0, sz, D.stripR*0.9, sy, D.stripR*0.55), 'sidedraw');
      for (var sb = 1; sb < 4; sb++)
        add('ringThin', MAT.struct, M.trs(M.m4(), sx, sy + D.stripH * sb / 4, sz,
            D.stripR * 1.05, 1, D.stripR * 1.05), 'sidedraw');
      // a small platform at the top of each stripper, reached off the tower
      add('annulus', MAT.grate, M.trs(M.m4(), sx, sy + D.stripH - 1.4, sz,
          D.stripR + 1.1, 1, D.stripR + 1.1), 'sidedraw');
      for (var sr = 0; sr < 12; sr++) {
        var sra = sr / 12 * Math.PI * 2;
        add('cyl', MAT.rail, M.trs(M.m4(), sx + Math.cos(sra) * (D.stripR + 1.1),
            sy + D.stripH - 1.4, sz + Math.sin(sra) * (D.stripR + 1.1), 0.045, 1.1, 0.045), 'sidedraw');
      }
      add('ringThin', MAT.rail, M.trs(M.m4(), sx, sy + D.stripH - 0.35, sz,
          D.stripR + 1.1, 1, D.stripR + 1.1), 'sidedraw');
      anchors.side[sideKeys[sI]] = [sx, sy + D.stripH + 1, sz];
      // draw line from the tower to the stripper, and the product away
      var noz = nozzle(sideY[sI], Math.atan2(sz, sx), 1.3, 0.22, 'sidedraw', STREAM[sideKeys[sI]]);
      pipeRun([noz, [sx, sideY[sI], sz], [sx, sy + D.stripH + 0.8, sz]],
              0.22, STREAM[sideKeys[sI]], 'sidedraw');
      pipeRun([[sx, sy + 0.4, sz], [sx, 3.4 + sI * 1.1, sz],
               [D.rackX + 1.1 + sI * 1.4, 3.4 + sI * 1.1, sz],
               [D.rackX + 1.1 + sI * 1.4, D.rackY + 0.6, sz],
               [D.rackX + 1.1 + sI * 1.4, D.rackY + 0.6, -19]],
              0.24, STREAM[sideKeys[sI]], 'product-' + sideKeys[sI], sideKeys[sI]);
      // the stripping-steam line into the base of each stripper
      pipeRun([[sx + 4.5, 1.6, sz], [sx, 1.6, sz], [sx, sy + 0.2, sz]],
              0.1, STREAM.steam, 'sidedraw');
    }

    /* ── crude in, through the heater, to the flash zone ───────────────── */
    var feedY = skirtTop + D.towerH * 0.20;
    var crudeIn = [[-52, 2.2, D.furZ], [D.furX - D.furW*0.5 - 2, 2.2, D.furZ],
                   [D.furX - D.furW*0.5 - 2, 4.5, D.furZ], [D.furX - D.furW*0.4, 4.5, D.furZ]];
    pipeRun(crudeIn, 0.34, STREAM.crude, 'crude', 'crude');
    anchors.crude = [-46, 3.6, D.furZ];
    var transfer = [[D.furX + D.furW*0.42, D.furH*0.62, D.furZ],
                    [D.furX + D.furW*0.42 + 6, D.furH*0.62, D.furZ],
                    [-7.5, D.furH*0.62, 0], [-7.5, feedY, 0],
                    [-D.towerR - 1.2, feedY, 0]];
    pipeRun(transfer, 0.4, STREAM.hot, 'feed', 'feed');
    nozzle(feedY, Math.PI, 1.2, 0.4, 'feed', STREAM.hot);
    anchors.feed = [-6, feedY + 2, 0];

    /* ── overhead, condenser, reflux drum ─────────────────────────────── */
    // up off the head, along at high level, then down onto the bank
    var ovStart = [0, shellTop + D.towerR * 0.5, 0];
    var ovHigh = shellTop + 3.4, ovDrop = D.towerR + 4.2;
    var overhead = [ovStart, [0, ovHigh, 0], [ovDrop, ovHigh, 0],
                    [ovDrop, D.condY + 6.5, D.condZ],
                    [D.condX - D.condW*0.5 - 2, D.condY + 6.5, D.condZ],
                    [D.condX - D.condW*0.5 - 2, D.condY + 1.4, D.condZ]];
    pipeRun(overhead, 0.42, STREAM.vapour, 'overhead', 'overhead');
    anchors.overhead = [0, D.condY + 7.5, 0];

    // air-cooled condenser: a bank of finned tubes on a structure, with fans
    add('box', MAT.struct, M.trs(M.m4(), D.condX, D.condY, D.condZ, D.condW, 0.5, D.condD), 'condenser');
    for (var ft = 0; ft < 9; ft++) {
      var fz = D.condZ - D.condD*0.42 + ft * D.condD*0.105;
      add('cyl', MAT.shell, M.alignY(M.m4(), [D.condX - D.condW*0.46, D.condY + 0.75, fz],
          [D.condW*0.92, 0, 0], 0.2), 'condenser');
    }
    add('box', MAT.struct, M.trs(M.m4(), D.condX, D.condY + 1.35, D.condZ, D.condW, 0.4, D.condD), 'condenser');
    for (var fn = 0; fn < 2; fn++) {
      var fx2 = D.condX - D.condW*0.24 + fn * D.condW*0.48;
      add('cyl', MAT.struct, M.trs(M.m4(), fx2, D.condY - 2.6, D.condZ, 2.3, 0.3, 2.3), 'condenser');
      for (var bl = 0; bl < 4; bl++)
        add('box', MAT.grate, M.yawTRS(M.m4(), fx2, D.condY - 2.4, D.condZ,
            bl * Math.PI / 4, 4.2, 0.08, 0.5), 'condenser');
    }
    // The structure under the bank. A braced four-post tower with ties at
    // three levels and an X in every bay on all four faces: the previous
    // version's random knee braces read as scaffolding rather than steel.
    var cLegX = D.condW * 0.44, cLegZ = D.condD * 0.40, cTop = D.condY - 0.4;
    var cLev = [D.rackY, D.rackY + (cTop - D.rackY) * 0.5, cTop];
    for (var lg = 0; lg < 4; lg++) {
      var lx = D.condX + (lg < 2 ? -1 : 1) * cLegX, lz = D.condZ + (lg % 2 ? -1 : 1) * cLegZ;
      add('box', MAT.struct, M.trs(M.m4(), lx, cTop / 2, lz, 0.52, cTop, 0.52), 'condenser');
      pad(lx, lz, 1.6, 1.6);
    }
    for (var lv = 0; lv < cLev.length; lv++) {
      var hy = cLev[lv];
      add('box', MAT.struct, M.trs(M.m4(), D.condX, hy, D.condZ - cLegZ, cLegX * 2, 0.34, 0.34), 'condenser');
      add('box', MAT.struct, M.trs(M.m4(), D.condX, hy, D.condZ + cLegZ, cLegX * 2, 0.34, 0.34), 'condenser');
      add('box', MAT.struct, M.trs(M.m4(), D.condX - cLegX, hy, D.condZ, 0.34, 0.34, cLegZ * 2), 'condenser');
      add('box', MAT.struct, M.trs(M.m4(), D.condX + cLegX, hy, D.condZ, 0.34, 0.34, cLegZ * 2), 'condenser');
      if (!lv) continue;
      var y0 = cLev[lv - 1], y1 = hy;
      // an X in each of the four faces of this bay
      for (var fz = 0; fz < 2; fz++) {
        var z2 = D.condZ + (fz ? 1 : -1) * cLegZ;
        cylBetween([D.condX - cLegX, y0, z2], [D.condX + cLegX, y1, z2], 0.11, MAT.struct, 'condenser');
        cylBetween([D.condX + cLegX, y0, z2], [D.condX - cLegX, y1, z2], 0.11, MAT.struct, 'condenser');
      }
      for (var fx = 0; fx < 2; fx++) {
        var x2 = D.condX + (fx ? 1 : -1) * cLegX;
        cylBetween([x2, y0, D.condZ - cLegZ], [x2, y1, D.condZ + cLegZ], 0.11, MAT.struct, 'condenser');
        cylBetween([x2, y0, D.condZ + cLegZ], [x2, y1, D.condZ - cLegZ], 0.11, MAT.struct, 'condenser');
      }
    }
    // the access platform round the bank, with its handrail
    add('box', MAT.grate, M.trs(M.m4(), D.condX, D.condY + 1.9, D.condZ + D.condD * 0.72,
        D.condW * 1.06, 0.14, 2.2), 'condenser');
    for (var cp = 0; cp < 10; cp++) {
      var cpx = D.condX - D.condW * 0.5 + cp * (D.condW / 9);
      add('cyl', MAT.rail, M.trs(M.m4(), cpx, D.condY + 1.9, D.condZ + D.condD * 0.72 + 1.0,
          0.05, 1.1, 0.05), 'condenser');
    }
    cylBetween([D.condX - D.condW*0.53, D.condY + 2.95, D.condZ + D.condD*0.72 + 1.0],
               [D.condX + D.condW*0.53, D.condY + 2.95, D.condZ + D.condD*0.72 + 1.0],
               0.05, MAT.rail, 'condenser');
    anchors.condenser = [D.condX, D.condY + 3.2, D.condZ];

    pipeRun([[D.condX + D.condW*0.5 + 1, D.condY + 0.75, D.condZ],
             [D.condX + D.condW*0.5 + 3.5, D.condY + 0.75, D.condZ],
             [D.condX + D.condW*0.5 + 3.5, D.drumY + D.drumR + 1.4, D.drumZ],
             [D.drumX + D.drumL*0.3, D.drumY + D.drumR + 1.4, D.drumZ],
             [D.drumX + D.drumL*0.3, D.drumY + D.drumR, D.drumZ]],
            0.3, STREAM.reflux, 'condenser');

    // reflux drum: a horizontal vessel with dished ends and a water boot
    add('cyl', MAT.shell, M.alignY(M.m4(), [D.drumX - D.drumL*0.5, D.drumY, D.drumZ],
        [D.drumL, 0, 0], D.drumR), 'drum');
    add('dish', MAT.head, M.alignY(M.m4(), [D.drumX + D.drumL*0.5, D.drumY, D.drumZ],
        [D.drumR, 0, 0], D.drumR), 'drum');
    add('dish', MAT.head, M.alignY(M.m4(), [D.drumX - D.drumL*0.5, D.drumY, D.drumZ],
        [-D.drumR, 0, 0], D.drumR), 'drum');
    add('cylCap', MAT.shell, M.trs(M.m4(), D.drumX - 1.4, D.drumY - D.drumR - 1.1, D.drumZ,
        0.62, 1.2, 0.62), 'drum');
    for (var sd = 0; sd < 2; sd++)
      add('box', MAT.struct, M.trs(M.m4(), D.drumX + (sd?1:-1)*D.drumL*0.3,
          (D.rackY + D.drumY - D.drumR) / 2, D.drumZ, 0.5, D.drumY - D.drumR - D.rackY, 2.4), 'drum');
    anchors.drum = [D.drumX, D.drumY + D.drumR + 1.6, D.drumZ];

    // reflux back to the top tray
    var rfX = D.towerR + 3.0;
    pipeRun([[D.drumX - D.drumL*0.5 - 0.6, D.drumY - D.drumR*0.6, D.drumZ],
             [rfX, D.drumY - D.drumR*0.6, D.drumZ],
             [rfX, D.drumY - D.drumR*0.6, 0],
             [rfX, shellTop - 2.5, 0],
             [D.towerR + 1.2, shellTop - 2.5, 0]],
            0.26, STREAM.reflux, 'reflux', 'reflux');
    // the riser is guided off the shell every few courses, as a real one is
    for (var rg2 = 0; rg2 * 7 < shellTop - D.drumY - 4; rg2++) {
      var rgy = D.drumY + 2 + rg2 * 7;
      cylBetween([D.towerR, rgy, 0], [rfX, rgy, 0], 0.09, MAT.struct, 'reflux');
    }
    nozzle(shellTop - 2.5, 0, 1.2, 0.26, 'reflux', STREAM.reflux);
    anchors.reflux = [D.towerR + 5, shellTop - 1.2, 0];

    // wet gas off the top of the drum, naphtha off the bottom
    pipeRun([[D.drumX + 2, D.drumY + D.drumR, D.drumZ],
             [D.drumX + 2, D.drumY + D.drumR + 5, D.drumZ],
             [D.rackX + 4.2, D.drumY + D.drumR + 5, D.drumZ],
             [D.rackX + 4.2, D.rackY + 1.5, D.drumZ],
             [D.rackX + 4.2, D.rackY + 1.5, -19]],
            0.22, STREAM.gas, 'product-gas', 'gas');
    pipeRun([[D.drumX + D.drumL*0.42, D.drumY - D.drumR, D.drumZ],
             [D.drumX + D.drumL*0.42, D.rackY + 1.1, D.drumZ],
             [D.rackX + 2.6, D.rackY + 1.1, D.drumZ],
             [D.rackX + 2.6, D.rackY + 1.1, -19]],
            0.26, STREAM.naphtha, 'product-naphtha', 'naphtha');

    /* ── bottoms, stripping steam, and the pipe rack ──────────────────── */
    pipeRun([[0, 0.9, 0], [0, 0.9, D.towerR + 3], [D.rackX + 5.6, 0.9, D.towerR + 3],
             [D.rackX + 5.6, D.rackY + 0.6, D.towerR + 3],
             [D.rackX + 5.6, D.rackY + 0.6, -19]],
            0.34, STREAM.residue, 'product-residue', 'residue');
    pipeRun([[-14, 2.6, -6], [-3.5, 2.6, -6], [-3.5, skirtTop + 1.6, 0]],
            0.16, STREAM.steam, 'reboiler', 'steam');
    nozzle(skirtTop + 1.6, Math.PI, 0.9, 0.16, 'reboiler', STREAM.steam);

    // The pipe rack: bents on a regular bay, two tiers of stringers, and
    // longitudinal bracing in every other bay. A rack without bracing reads as
    // a row of loose posts, which is what it looked like before.
    var rz0 = -14, rzN = 9, bays = 8, rzStep = (rzN - rz0) / (bays - 1);
    for (var rb = 0; rb < bays; rb++) {
      var rz = rz0 + rb * rzStep;
      add('box', MAT.struct, M.trs(M.m4(), D.rackX, D.rackY/2, rz, 0.55, D.rackY, 0.55), '');
      add('box', MAT.struct, M.trs(M.m4(), D.rackX + 5, D.rackY/2, rz, 0.55, D.rackY, 0.55), '');
      add('box', MAT.struct, M.trs(M.m4(), D.rackX + 2.5, D.rackY, rz, 6.2, 0.42, 0.48), '');
      add('box', MAT.struct, M.trs(M.m4(), D.rackX + 2.5, D.rackY * 0.55, rz, 6.2, 0.34, 0.40), '');
      pad(D.rackX, rz, 1.3, 1.3); pad(D.rackX + 5, rz, 1.3, 1.3);
      if (rb && rb % 2) {

                    method. For each component the stage balances form a

                        ℓ_{j-1} − [(1+φ_j) + S_j]·ℓ_j + S_{j+1}·ℓ_{j+1} = −f_j
                    with the stripping factor S_j = K_j·V_j/L_j and the draw
                    ratio φ_j = U_j/L_j. It is solved exactly by the Thomas
                    algorithm; the stage temperatures then follow from the
                    stage bubble points; the two are repeated until neither
                    moves. Writing the draws as ratios rather than rates makes
                    the solve conserve mass exactly on every sweep.
   Internal flows   constant molar overflow, as in the binary simulator
                    elsewhere in DISTILLEX. There are no vapour draws above
                    the feed, so everything entering at the flash zone reaches
                    the top: V = V_flash + V_stripped, D = V/(1+R), and the
                    liquid steps down by each draw as it passes. There is no
                    stage energy balance and no pumparound.
   Stripping        below the flash zone constant molar overflow leaves the
                    boil-up undetermined — a crude tower has no reboiler — so
                    that section is solved instead by the Kremser group method

                    treatment of an open-steam stripper. What the steam lifts
                    rejoins the cascade at the flash zone, and the two halves
                    are iterated against each other.

                    above its draw tray. This is what sharpens the front end of
                    a cut.
   Condenser        the overhead is flashed at the drum temperature. What will
                    not condense leaves as wet gas; the rest splits between
                    reflux and liquid distillate by the reflux ratio. When more
                    vapour refuses to condense than the distillate rate can
                    carry, the specification is infeasible and is reported as
                    such rather than clipped.
   Convergence      reported, never asserted. A run that hit the iteration
                    limit says so and labels its own product split approximate.

   ── 4. ENERGY ───────────────────────────────────────────────────────────
   Duties use the enthalpy of vaporisation above together with a
   representative liquid and vapour heat capacity for hydrocarbons. They are
   order-of-magnitude educational figures, reported to two or three
   significant figures, and are labelled as approximate on screen.

   ── 5. WHAT IS NOT MODELLED ─────────────────────────────────────────────

   efficiency, tray hydraulics, pressure drop across the tower, water and salt

     Twenty-two narrow cuts from refinery gas to vacuum residue. The two
     lightest represent the dissolved C1–C2 and C3 a crude carries: without
     them the reflux drum can never make wet gas, because everything heavier
     stays dissolved in the naphtha at a normal drum temperature. The grid is

    var dS = 36.6 + 8.31 * Math.log(Tb);           // J/(mol·K)

      i: i,
      Tb: Tb,                                      // K
      TbC: tc,                                     // °C
      n: n,                                        // carbon number
      M: M,                                        // g/mol = kg/kmol

  /** Rachford–Rice: solve Σ z(K−1)/(1+ψ(K−1)) = 0 for the vapour fraction.
