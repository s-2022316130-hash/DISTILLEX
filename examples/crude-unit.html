        ' % of the charge. Nothing would be left for the overhead or the residue.' });
    else if (drawSum >= 70)
      warns.push('The side draws take ' + drawSum.toFixed(0) + ' % of the charge between them, which leaves very little residue. A real unit would be close to drying the sump.');
    if (isFinite(+s.furnaceT) && +s.furnaceT > 375)
      warns.push('Furnace outlet above about 375 °C: real crude begins to crack here, which this model does not represent.');
    return { ok: errs.length === 0, errs: errs, warns: warns };
  }

  /** The first half of a run: characterise the charge and flash it at the
   *  furnace outlet. The page calls this before the cascade so that the feed
   *  and flash figures it displays while the solver is working are the ones
   *  actually computed, not a placeholder. run() repeats the work — it is a
   *  few milliseconds — rather than depending on this having been called. */
  function feedPhase(state) {
    var v = validate(state);
    if (!v.ok) return { ok: false, errs: v.errs, warns: v.warns };
    var a = ASSAY[state.assay], z = assayZ(a, state.assaySkew);
    var Mavg = 0, i;
    for (i = 0; i < COMP.length; i++) Mavg += z[i] * COMP[i].M;
    var F = (+state.feedRate * 1000) / Mavg;
    var fl = flash(z, +state.furnaceT + T0, +state.colP);
    return { ok: true, warns: v.warns, assay: a, z: z,
             feed: { mass: +state.feedRate, molar: F, M: Mavg, api: a.api, T: +state.feedT },
             flash: { psi: fl.psi, T: +state.furnaceT, P: +state.colP,
                      vapour: F * fl.psi, liquid: F * (1 - fl.psi), it: fl.it } };
  }

  /* ── the run ─────────────────────────────────────────────────────────
     INPUTS → VALIDATION → FLASH → CASCADE → BALANCES → RESULTS          */
  function run(state, opts) {
    opts = opts || {};
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var s = {}, k;
    for (k in state) if (state.hasOwnProperty(k)) s[k] = state[k];

    var v = validate(s);
    if (!v.ok) return { ok: false, status: 'error', errs: v.errs, warns: v.warns };

    var assay = ASSAY[s.assay];
    var z = assayZ(assay, s.assaySkew);
    var i, j;

    // molar charge from the mass charge and the assay's mean molar mass
    var Mavg = 0;
    for (i = 0; i < COMP.length; i++) Mavg += z[i] * COMP[i].M;
    var F = (+s.feedRate * 1000) / Mavg;          // kmol/h
    var feedMol = z.map(function (zi) { return zi * F; });
    var feedMass = +s.feedRate;                   // t/h

    // ── furnace: heat the charge, then flash it in the tower ──────────
    var Tf   = +s.furnaceT + T0;
    var Tin  = +s.feedT + T0;
    var Pfl  = +s.colP;
    var fl   = flash(z, Tf, Pfl);
    var iters = fl.it, resid = fl.res;

    var Vflash = F * fl.psi;                       // kmol/h rising
    var Lflash = F - Vflash;                       // kmol/h falling to the sump

    var vapMol = fl.y.map(function (y) { return y * Vflash; });
    var liqMol = fl.x.map(function (x) { return x * Lflash; });

    // ── the tower: a stage-by-stage cascade, solved by the bubble-point
    //    (Wang–Henke) method ──────────────────────────────────────────────
    //
    //   j = 0   partial condenser ─► wet gas (vapour) + naphtha (liquid)
    //           │  reflux
    //   j = 1…  rectifying trays
    //   ──────  kerosene draw ─► side stripper ─┐ returns above the draw
    //   ──────  diesel   draw ─► side stripper ─┤
    //   ──────  gas-oil  draw ─► side stripper ─┘
    //           wash trays
    //   ──────  flash zone: the furnace outlet enters here
    //           stripping trays, steam entering at the sump
    //   j = N   sump ─► atmospheric residue
    //
    // Every stage is a real equilibrium stage. For each component the stage
    // balances form a tridiagonal system in the liquid component flows,
    //     ℓ_{j-1} − [(1+φ_j) + S_j]·ℓ_j + S_{j+1}·ℓ_{j+1} = −f_j
    // with the stripping factor S_j = K_j·V_j/L_j. It is solved exactly by the
    // Thomas algorithm, the temperatures are then updated from the stage
    // bubble points, and the two are repeated until neither moves. This is the
    // standard bubble-point method for narrow-boiling systems, which is what a
    // distillation column is.
    //
    // The draws enter as RATIOS φ_j = U_j/L_j rather than as absolute rates.
    // That matters: summing the stage equations telescopes to
    //     Σ f = ℓ_bottom + Σ φ_j·ℓ_j + (condenser outlets)
    // so the solve conserves mass exactly on every iteration, whatever the
    // temperature profile happens to be at the time. Specifying absolute draws
    // instead would divide by a liquid flow carried over from the previous
    // sweep, and the balance would only close once the whole thing had
    // converged. The outer loop then moves each ratio until the draw delivers
    // the rate the operator asked for.
    //
    // Constant molar overflow is assumed, as it is in the binary simulator
    // elsewhere in DISTILLEX: a mole condensing releases enough heat to boil a
    // mole. There is therefore no stage energy balance, and no pumparound.
    //
    // CMO is what fixes the internal traffic, and it has to be imposed rather
    // than hoped for. There are no vapour draws above the feed, so all the
    // vapour entering at the flash zone reaches the top:
    //     V = V_flash + V_stripped          (constant on every stage above the feed)
    //     D = V/(1+R),   L_0 = V·R/(1+R)    (the reflux ratio, by definition)
    //     L_j = L_0 − Σ U_k  for the draws above stage j
    // Without this the component balances alone leave the total flows
    // undetermined — they only constrain ratios — and the reflux quietly
    // evaporates on its way down, so no side draw can be met.
    //
    // WHERE THE RIGOROUS CASCADE STOPS, AND WHY
    // The stage cascade above runs from the condenser down to the flash zone.
    // It does not continue below it, and that is a modelling decision rather
    // than a shortcut taken for convenience.
    //
    // A crude tower has no reboiler: every joule arrives with the feed. Under
    // constant molar overflow the hydrocarbon vapour on a stage follows from
    //     V_hc = Σ K_i·x_i · (V_hc + V_steam)
    // which rearranges to V_hc = V_steam·ΣKx/(1 − ΣKx). In the stripping
    // section the liquid sits at its bubble point, so ΣKx → 1, the denominator
    // → 0, and the vapour rate is unbounded. The equation is singular there —
    // it carries no information, because with no reboiler nothing sets the
    // boil-up but the heat in the feed, which constant molar overflow has
    // already assumed away.
    //
    // So the stripping section is solved instead by the Kremser group method
    // at the transfer-line temperature, which is the standard treatment of an
    // open-steam stripper and is stable. The two halves are then iterated
    // against each other: the liquid leaving the bottom of the cascade is the
    // overflash, it is stripped, and what the steam lifts rejoins the cascade
    // at the flash zone.
    //
    // Stripping steam is carried as an inert. It never condenses, so it is
    // kept out of the component solve and enters only through the total
    // vapour, which is exactly how it works: it lowers the hydrocarbon partial
    // pressure, so the stage bubble-point condition becomes
    //     Σ K_i·x_i = 1 − y_steam
    // and the hydrocarbons boil at a lower temperature than they otherwise
    // would. Treating water as a Raoult component in a hydrocarbon liquid
    // would have been worse than treating it as the inert it effectively is.

    var Rr   = Math.max(0.05, +s.reflux);
    var Ptop = +s.topP;
    var steamMol = (+s.steam / 100) * (+s.feedRate * 1000) / 18.015;   // kmol/h
    var sideSteamPct = Math.max(0, +s.sideSteam || 0) / 100;
    var SIDE_STAGES = 4;

    // ── build the stage table ────────────────────────────────────────────
    var nTop   = Math.round(+s.stagesTop);
    var nKero  = Math.round(+s.stagesKero);
    var nDies  = Math.round(+s.stagesDiesel);
    var nGasoil= Math.round(+s.stagesGasoil);
    var nWash  = Math.round(+s.stagesWash);
    var nStrip = Math.round(+s.stagesStrip);

    var ST = [];
    ST.push({ kind:'cond',  label:'Condenser' });
    for (j = 0; j < nTop;  j++) ST.push({ kind:'tray', sec:'top',  label:'Rectifying' });
    var iKero = ST.length; ST.push({ kind:'draw', key:'kerosene', label:'Kerosene draw' });
    for (j = 0; j < nKero; j++) ST.push({ kind:'tray', sec:'kero', label:'Kerosene section' });
    var iDies = ST.length; ST.push({ kind:'draw', key:'diesel',   label:'Diesel draw' });
    for (j = 0; j < nDies; j++) ST.push({ kind:'tray', sec:'dies', label:'Diesel section' });
    var iGaso = ST.length; ST.push({ kind:'draw', key:'gasoil',   label:'Gas-oil draw' });
    for (j = 0; j < nGasoil; j++) ST.push({ kind:'tray', sec:'gaso', label:'Gas-oil section' });
    for (j = 0; j < nWash; j++)  ST.push({ kind:'tray', sec:'wash', label:'Wash section' });
    var iFeed = ST.length; ST.push({ kind:'feed', label:'Flash zone' });
    var NS = ST.length;                       // the rigorous cascade ends here
    // the stripping trays and the sump exist in the tower and in the drawing,
    // but they are solved by the group method below, not by the cascade
    for (j = 0; j < nStrip; j++) ST.push({ kind:'tray', sec:'strip', label:'Stripping' });
    var iSump = ST.length; ST.push({ kind:'sump', label:'Sump' });
    var NST = ST.length;                      // every stage, for display

    // pressure profile: linear from the overhead to the flash zone, then flat
    for (j = 0; j < NST; j++)
      ST[j].P = (j <= iFeed) ? (Ptop + (Pfl - Ptop) * (j / Math.max(1, iFeed))) : Pfl;

    // ── specified draws, as a share of the charge ────────────────────────
    var drawSpec = [
      { key:'kerosene', at:iKero, pct:+s.drawKero   },
      { key:'diesel',   at:iDies, pct:+s.drawDiesel },
      { key:'gasoil',   at:iGaso, pct:+s.drawGasoil }
    ];
    var phi = [], drawTot = 0;        // liquid draw ratio U_j / L_j
    for (j = 0; j < NST; j++) phi.push(0);
    for (j = 0; j < drawSpec.length; j++) {
      // mass draw → molar, using the molar mass the cut is expected to have,
      // refined each outer iteration once its real composition is known
      var mt = feedMass * drawSpec[j].pct / 100;                  // t/h
      drawSpec[j].mass = mt;
      drawSpec[j].Mguess = [175, 230, 310][j];
      drawSpec[j].mol = mt * 1000 / drawSpec[j].Mguess;           // kmol/h, first pass
      phi[drawSpec[j].at] = 0.25;                                 // opening guess
      drawTot += drawSpec[j].mol;
    }

    // ── steam profile: main steam everywhere, side-stripper steam above
    //    each draw it returns to ─────────────────────────────────────────
    var Vst = [];
    for (j = 0; j < NST; j++) {
      var st = steamMol;
      for (var q = 0; q < drawSpec.length; q++)
        if (j <= drawSpec[q].at) st += sideSteamPct * drawSpec[q].mass * 1000 / 18.015;
      Vst.push(st);
    }

    // ── flows, from constant molar overflow ──────────────────────────────
    var Vhc = [], Lhc = [], Lsolved = [];
    for (j = 0; j < NS; j++) { Vhc.push(1); Lhc.push(1); Lsolved.push(1); }

    /** Rebuild the whole flow profile from the current vapour load and draws.
     *  Returns false when a draw asks for more liquid than flows past its
     *  tray, which is a real operating limit, not a numerical failure. */
    function setFlows(V1, Umol) {
      var Dtot = V1 / (1 + Rr);
      var L0 = V1 - Dtot;
      Vhc[0] = Math.max(1e-9, rVap * L0);
      Lhc[0] = Math.max(1e-9, L0);
      var Lrun = L0, okFlow = true;
      for (var q2 = 1; q2 < NS; q2++) {
        Vhc[q2] = V1;
        Lrun -= (Umol[q2 - 1] || 0);               // draws taken above this stage
        if (Lrun < 1e-6) { Lrun = 1e-6; okFlow = false; }
        Lhc[q2] = Lrun;
      }
      return { ok: okFlow, D: Dtot, L0: L0 };
    }

    // ── initial temperature profile: a smooth ramp between the two ends ──
    // ── initial temperature profile: a smooth ramp between the two ends ──
    var Tj = [];
    var Ttop0 = dewT(norm(fl.y), Ptop, 420).T;
    var Tsump = Tf - 6;                    // no reboiler: the sump sits under
    for (j = 0; j < NS; j++)               // the transfer line
      Tj.push(Ttop0 + (Tf - Ttop0) * Math.pow(j / Math.max(1, iFeed), 0.85));
    // the section below the flash zone is fixed, not solved
    var Tfixed = [];
    for (j = 0; j < NS; j++) {
      // the condenser runs at the drum temperature the operator sets, and the
      // flash zone at the furnace outlet; the trays between are solved
      if (j === 0)      { Tfixed.push(+s.drumT + T0); Tj[0] = Tfixed[0]; continue; }
      if (j === iFeed)  { Tfixed.push(Tf);            Tj[j] = Tf;        continue; }
      Tfixed.push(null);
    }

    // ── the outer loop ───────────────────────────────────────────────────
    var ell = [];                          // ell[j][i] liquid component flow
    var vee = [];                          // vee[j][i] vapour component flow
    var sideRet = {}, sideProd = {};
    var stripUp = zeros();                 // what the sump stripper lifts back
    var residMolOut = zeros();             // the atmospheric residue
    // Opening estimates. With both distillate rates at zero the condenser
    // stage has no outlet at all and the first solve is degenerate.
    var Dvap = 0, Dliq = 0;
    var rVap = 0.12 / Rr, rLiq = 0.88 / Rr;      // opening condenser ratios
    var refluxMol = zeros(), gasMol = zeros(), napMol = zeros();
    var condShort = false, drawStarved = false;
    var converged = false, outer = 0, relax = 0.8, PHI_RELAX = 0.2, lastErr = Infinity, stall = 0;
    // The residual trajectory, recorded so the page can plot what the solver
    // actually did rather than assert that it converged.
    var trace = [];
    var NC = COMP.length;

    for (outer = 0; outer < 420; outer++) {
      // CMO fixes the traffic: everything entering at the flash zone rises
      var V1 = Math.max(1e-6, Vflash + sum(stripUp));
      var Umol = [];
      for (j = 0; j < NS; j++) Umol.push(0);
      for (q = 0; q < drawSpec.length; q++) Umol[drawSpec[q].at] = drawSpec[q].mol;
      var fl2 = setFlows(V1, Umol);
      drawStarved = !fl2.ok;
      // The draw ratio is taken against the liquid the SOLVE has on that tray,
      // not against the CMO estimate. Under constant molar overflow the two
      // are deliberately different — CMO fixes the traffic, the component
      // balances decide the composition — and a draw specified as a rate has
      // to be divided by the flow it is actually taken from, or it silently
      // misses its target.
      // φ is damped in its own right: it is divided by the very liquid flow
      // it controls, so taking it at face value each sweep makes the loop
      // oscillate instead of settle.
      for (j = 0; j < NS; j++) {
        var phiWant = Math.min(0.95, (Umol[j] || 0) / Math.max(1e-9, Lsolved[j]));
        phi[j] = phi[j] + PHI_RELAX * (phiWant - phi[j]);
      }

      // component feeds: the flashed charge at the feed stage, and the side
      // strippers returning their vapour just above each draw
      var Fj = [];
      for (j = 0; j < NS; j++) Fj.push(zeros());
      for (i = 0; i < NC; i++) Fj[iFeed][i] = vapMol[i] + stripUp[i];
      for (q = 0; q < drawSpec.length; q++) {
        var ret = sideRet[drawSpec[q].key];
        if (ret) for (i = 0; i < NC; i++) Fj[Math.max(0, drawSpec[q].at - 1)][i] += ret[i];
      }

      // K and the stripping factors on the current profiles
      var Kj = [], Sj = [];
      for (j = 0; j < NS; j++) {
        var kr = [], sr = [], Vtot = Vhc[j] + Vst[j];
        for (i = 0; i < NC; i++) {
          var kk = kval(COMP[i], Tj[j], ST[j].P);
          kr.push(kk);
          sr.push(kk * Vtot / Math.max(1e-9, Lhc[j]));
        }
        Kj.push(kr); Sj.push(sr);
      }

      // ── solve the tridiagonal system for each component ───────────────
      var A = new Float64Array(NS), B = new Float64Array(NS),
          Cc = new Float64Array(NS), Dd = new Float64Array(NS), X = new Float64Array(NS);
      var newEll = [], newVee = [];
      for (j = 0; j < NS; j++) { newEll.push(zeros()); newVee.push(zeros()); }

      for (i = 0; i < NC; i++) {
        for (j = 0; j < NS; j++) {
          var Uf = phi[j];
          A[j] = (j === 0) ? 0 : 1;
          Cc[j] = (j === NS - 1) ? 0 : Sj[j + 1][i];
          Dd[j] = -Fj[j][i];
          if (j === 0) {
            // partial condenser, also written as ratios against the reflux:
            //   D/L0 = 1/R,  D_vap/L0 = (1+1/R)·ψ,  D_liq/L0 = 1/R − D_vap/L0
            B[j] = -(1 + rLiq + rVap * Kj[0][i]);
          } else if (j === NS - 1) {
            // flash zone: all its liquid leaves downward as the overflash
            B[j] = -(1 + Sj[j][i]);
          } else {
            B[j] = -((1 + Uf) + Sj[j][i]);
          }
        }
        thomas(A, B, Cc, Dd, X, NS);
        for (j = 0; j < NS; j++) {
          var lv = X[j] > 0 ? X[j] : 0;
          newEll[j][i] = lv;
          newVee[j][i] = lv * Sj[j][i];
        }
      }

      // ── the condenser ─────────────────────────────────────────────────
      // V1 arrives from stage 1 and is cooled to the drum temperature. What
      // will not condense has to leave as wet gas; the rest splits between
      // reflux and liquid distillate. In ratios against the reflux L0:
      //     D/L0 = 1/R,  D_vap/L0 = (1 + 1/R)·ψ,  D_liq/L0 = 1/R − D_vap/L0
      // D_liq goes negative when ψ > 1/(1+R): more vapour refuses to condense
      // than the distillate rate can carry, and the specification is
      // infeasible rather than merely inaccurate. That is reported, not
      // quietly clipped.
      var ovMol = newVee[1] ? newVee[1].slice() : zeros();
      var ovTot = sum(ovMol);
      var ov = flash(norm(ovMol), +s.drumT + T0, Ptop);
      iters += ov.it; resid = Math.max(resid, ov.res);
      var psiC = ov.psi;
      var rVapNew = (1 + 1 / Rr) * psiC;
      var rLiqNew = 1 / Rr - rVapNew;
      condShort = rLiqNew < 0;
      if (condShort) { rLiqNew = 0; rVapNew = 1 / Rr; }
      rVap = rVap + relax * (rVapNew - rVap);
      rLiq = rLiq + relax * (rLiqNew - rLiq);

      // the actual flows follow from the solved reflux
      var L0 = Math.max(1e-9, sum(newEll[0]));
      Dvap = rVap * L0; Dliq = rLiq * L0;
      gasMol = zeros(); napMol = zeros(); refluxMol = zeros();
      for (i = 0; i < NC; i++) {
        var x0i = newEll[0][i] / L0;
        refluxMol[i] = newEll[0][i];
        napMol[i]    = x0i * Dliq;
        gasMol[i]    = x0i * Kj[0][i] * Dvap;
      }

      // ── flows and temperatures ────────────────────────────────────────
      var dT = 0, dF = 0;
      var newT = [], newV = [], newL = [];
      for (j = 0; j < NS; j++) {
        var Lsum = sum(newEll[j]), Vsum = sum(newVee[j]);
        newL.push(Math.max(1e-9, Lsum));
        // the condenser's only vapour outlet is the wet gas, which the flash
        // above has just settled; it is not a cascade unknown
        newV.push(Math.max(1e-9, Vsum));
        // stage temperature from Σ K·x = 1 − y_steam
        var x = norm(newEll[j]);
        var ysteam = Vst[j] / Math.max(1e-9, Vsum + Vst[j]);
        var target = Math.max(0.02, 1 - ysteam);
        var Tnew;
        if (Tfixed[j] !== null) {
          Tnew = Tfixed[j];                        // set by the transfer line
        } else {
          var bt = bubbleTTarget(x, ST[j].P, target, Tj[j]);
          iters += bt.it;
          Tnew = bt.T;
        }
        newT.push(Tnew);
        dT = Math.max(dT, Math.abs(Tnew - Tj[j]));
        // Note: newL is the sum of the solved component flows and Lhc is the
        // CMO traffic. They are not the same quantity and are not compared.
        dF = Math.max(dF, Math.abs(newL[j] - Lsolved[j]) / Math.max(1, newL[j]));
      }

      // ── side draws, then their strippers ──────────────────────────────
      // The solve removed φ_j·ℓ_j at each draw. Compare what that delivered
      // with what was asked for, and move the ratio toward it.
      for (q = 0; q < drawSpec.length; q++) {
        var d = drawSpec[q], jj = d.at;
        var raw = newEll[jj].map(function (e) { return e * phi[jj]; });
        var gotMass = massOf(raw);
        // the molar rate that delivers the specified mass rate, using the
        // composition the tray actually has
        var xj = norm(newEll[jj]);
        var Md = 0; for (i = 0; i < NC; i++) Md += xj[i] * COMP[i].M;
        var molWant = d.mass * 1000 / Math.max(1e-6, Md);
        dF = Math.max(dF, Math.abs(gotMass - d.mass) / Math.max(1, d.mass));
        d.mol = d.mol + relax * (molWant - d.mol);
        d.got = gotMass;
        // side stripper: Kremser over SIDE_STAGES with its own steam
        var Ld = Math.max(1e-9, sum(raw)), dm = massOf(raw);
        var Vs = Math.max(1e-12, sideSteamPct * dm * 1000 / 18.015);
        var Pd = ST[jj].P;
        var rt = zeros(), keep = zeros();
        for (i = 0; i < NC; i++) {
          var Ss = kval(COMP[i], newT[jj], Pd) * (Vs + Ld * 0.05) / Ld;
          var fsr = kremserStrip(Ss, SIDE_STAGES);
          rt[i] = raw[i] * fsr; keep[i] = raw[i] - rt[i];
        }
        sideRet[d.key] = rt; sideProd[d.key] = keep;
      }

      // ── stripping section: Kremser on the overflash plus the flash liquid ─
      var overflash = newEll[NS - 1] ? newEll[NS - 1].slice() : zeros();
      var sumpIn = zeros();
      for (i = 0; i < NC; i++) sumpIn[i] = liqMol[i] + overflash[i];
      var Lb = Math.max(1e-6, sum(sumpIn));
      var Tstrip = Tf - 6;
      // the steam dilutes the hydrocarbon partial pressure in the sump
      var yS = steamMol / Math.max(1e-9, steamMol + Lb * 0.08);
      var Pb = Pfl * Math.max(0.12, 1 - yS);
      var newStripUp = zeros(), newResid = zeros();
      for (i = 0; i < NC; i++) {
        var Sb = kval(COMP[i], Tstrip, Pb) * Math.max(1e-9, steamMol) / Lb;
        var fb = kremserStrip(Sb, nStrip);
        newStripUp[i] = sumpIn[i] * fb;
        newResid[i] = sumpIn[i] - newStripUp[i];
      }
      dF = Math.max(dF, Math.abs(sum(newStripUp) - sum(stripUp)) /
                        Math.max(1, sum(newStripUp)));
      for (i = 0; i < NC; i++)
        stripUp[i] = stripUp[i] + relax * (newStripUp[i] - stripUp[i]);
      residMolOut = newResid;

      // ── damped update ─────────────────────────────────────────────────
      for (j = 0; j < NS; j++) {
        Tj[j] = Tj[j] + relax * (newT[j] - Tj[j]);
        Lsolved[j] = Lsolved[j] + relax * (newL[j] - Lsolved[j]);
      }

      h('div', { class:'cap' }, 'Crude assay'),
      h('div', { class:'assays' }, Object.keys(CDU.ASSAY).map(function (k) {
        var a = CDU.ASSAY[k], on = S.inputs.assay === k;
        return h('button', { class:'assay' + (on ? ' on' : ''),
                             onclick: function () { S.inputs.assay = k; markDirty(); render(); } }, [
          h('span', { class:'nm' }, a.name),
          h('span', { class:'api' }, a.api + '° API')
        ]);
      })),
      h('p', { class:'hint', style:'margin:0' }, CDU.ASSAY[S.inputs.assay].note)
    ])));

    SECTIONS.forEach(function (sec) {
      var open = !!S.open[sec.key];
      var head = h('button', { 'aria-expanded': open ? 'true' : 'false',
        onclick: function () { S.open[sec.key] = !S.open[sec.key]; render(); } }, [
        h('span', { class:'t' }, sec.label),
        h('span', { class:'c' }, open ? '−' : '+')
      ]);
      var body = open ? h('div', { class:'secbody' }, [h('p', { class:'hint' }, sec.hint)].concat(
        sec.keys.map(function (k) { return field(k); }))) : null;
      out.push(h('div', { class:'sec' }, [head, body]));
    });
    fill($('panel'), out);
  }

  function field(k) {
    var L = CDU.LIMITS[k], v = S.inputs[k];
    var step = L.int ? 1 : ((L.max - L.min) / 200 >= 1 ? 1 : (L.max - L.min) / 200 >= 0.1 ? 0.1 : 0.01);
    var pct = ((v - L.min) / (L.max - L.min) * 100).toFixed(1) + '%';
    var input = h('input', {
      id:'f-' + k, type:'range', min:L.min, max:L.max, step:step, value:v,
      style:'--p:' + pct, 'aria-label':L.label,
      oninput: function (e) { setInput(k, e.target.value, e.target); }
    });
    return h('div', { class:'fld' }, [
      h('div', { class:'top' }, [
        h('label', { for:'f-' + k }, L.label),
        h('span', { class:'v' }, L.int ? String(v) : rate(v)),
        h('span', { class:'u' }, L.unit)
      ]),
      input,
      h('span', { class:'help' }, HELP[k] || '')
    ]);
  }

  /* ── which viewports are shown ─────────────────────────────────────── */
  function renderStage() {
    var st = $('stage');
    st.className = 'stage v-' + S.view;
    $('vp3d').hidden = S.view === '2d';
    $('vp2d').hidden = S.view === '3d';
    if (S.view !== '3d') render2D();
    // the scene keeps rendering while hidden would be waste; pause it instead
    if (gl) gl.state.flow = S.flow && !reduced && S.view !== '2d';
  }

  /* ── the 2D flow sheet ─────────────────────────────────────────────── */
  function render2D() {
    var d = RIG2D.build(S.r, S.mode, S.sel, S.prod, S.flow && !reduced);
    var kids = [];

    d.pipes.forEach(function (p) {
      var g = s('g', { opacity:p.op });
      if (p.halo) g.appendChild(s('path', { class:'d2-halo', d:p.d, stroke:p.col, 'stroke-width':p.halo }));
      g.appendChild(s('path', { class:'d2-pipe', d:p.d, stroke:p.col, 'stroke-width':p.w,
        onclick: function () { select(p.pick); } }));
      if (p.tracer) g.appendChild(s('path', { class:'d2-trace', d:p.d, 'stroke-width':p.tw,
        style:p.style + ';stroke:' + d.sheet.tracer + ';opacity:' + d.sheet.tracerOp }));
      kids.push(g);
    });

    var tw = d.tower, tg = s('g', { opacity:tw.op });
    tg.appendChild(s('rect', { x:tw.x, y:tw.y, width:tw.w, height:tw.h, rx:tw.rx, fill:tw.fill }));
    d.bands.forEach(function (b) {
      tg.appendChild(s('rect', { x:b.x, y:b.y, width:b.w, height:b.h, fill:b.fill, opacity:b.op }));
    });
    d.trays.forEach(function (t) {
      tg.appendChild(s('line', { class:'d2-tray', x1:t.x1, y1:t.y, x2:t.x2, y2:t.y, opacity:t.op }));
    });
    tg.appendChild(s('rect', { class:'d2-shell' + (S.sel === 'tower' ? ' on' : ''),
      x:tw.x, y:tw.y, width:tw.w, height:tw.h, rx:tw.rx,
      onclick: function () { select('tower'); } }));
    kids.push(tg);

    d.blocks.forEach(function (b) {
      kids.push(s('g', { opacity:b.op }, [
        s('rect', { class:b.cls, x:b.x, y:b.y, width:b.w, height:b.h, rx:b.rx,
          onclick: function () { select(b.pick); } }),
        s('text', { class:'d2-lbl', x:b.lx, y:b.ly, 'text-anchor':'middle' }, b.label),
        s('text', { class:'d2-sub', x:b.lx, y:b.sy, 'text-anchor':'middle' }, b.sub)
      ]));
    });
    d.tags.forEach(function (t) {
      kids.push(s('text', { class:'d2-tag', x:t.x, y:t.y, 'font-size':t.size,
        'text-anchor':t.anchor, fill:t.col, opacity:t.op }, t.text));
    });
    d.temps.forEach(function (t) {
      kids.push(s('text', { class:'d2-tin', x:t.x, y:t.y, 'text-anchor':t.anchor }, t.text));
    });
    d.out.forEach(function (o) {
      kids.push(s('g', { class:'d2-out', opacity:o.op, onclick: function () { select(o.pick); } }, [
        s('line', { class:'d2-tick', x1:o.tick.x1, y1:o.tick.y, x2:o.tick.x2, y2:o.tick.y, stroke:o.col }),
        s('text', { class:'nm', x:o.x, y:o.y, dy:'-4', fill:o.col }, o.name),
        s('text', { class:'r', x:o.x, y:o.y, dy:'12' }, o.rate + ' t/h'),
        s('text', { class:'sm', x:o.x, y:o.y, dy:'24' }, o.pct),
        s('text', { class:'sm', x:o.x, y:o.y, dy:'35' }, o.cut)
      ]));
    });
    if (d.legend) {
      var lg = d.legend;
      var grad = s('linearGradient', { id:'heatramp', x1:'0', x2:'1', y1:'0', y2:'0' },
        lg.stops.map(function (q) { return s('stop', { offset:q.off, 'stop-color':q.col }); }));
      kids.push(s('defs', null, grad));
      kids.push(s('rect', { x:lg.x, y:lg.y, width:lg.w, height:lg.h, rx:4, fill:'url(#heatramp)' }));
      kids.push(s('text', { class:'d2-tin', x:lg.x, y:lg.y, dy:'-5' }, lg.lo));
      kids.push(s('text', { class:'d2-tin', x:lg.x + lg.w, y:lg.y, dy:'-5', 'text-anchor':'end' }, lg.hi));
    }

    var svg = s('svg', { viewBox:'0 0 ' + d.w + ' ' + d.h, preserveAspectRatio:'xMidYMid meet',
      role:'img', 'aria-label':'Process flow diagram of the crude unit, with the computed rate on every product rundown.' }, kids);
    fill($('d2'), svg);
  }

  /* ── the product strip, and the ribbon above it ────────────────────────
     The ribbon is the material balance drawn as a single bar: the whole
     charge, segmented by where it left the unit. It is the strip's header
     and a chart at the same time, and it costs no extra vertical space. */
  function renderProducts() {
    var has = !!S.r;
    var list = has ? S.r.products : CDU.CUTS.map(function (c) { return { key:c.key, name:c.name }; });

    fill($('ribbon'), list.map(function (p) {
      var pct = has ? Math.max(0.35, p.pct) : 100 / 6;
      var dimmed = S.prod && S.prod !== p.key;
      return h('i', { class: dimmed ? 'dim' : '',
                      style:'width:' + pct.toFixed(2) + '%;background:' + tone(p.key),
                      title: p.name + (has ? ' — ' + fmt(p.pct, 1) + ' % of charge' : '') });
    }));

    fill($('products'), list.map(function (p) {
      var on = S.prod === p.key;
      var cut = has && p.mass > 0.05 ? fmt(p.tbp5, 0) + '\u2013' + fmt(p.tbp95, 0) + ' \u00b0C' : DASH;
      return h('button', { class:'prod' + (on ? ' on' : ''), style:'--pc:' + tone(p.key),
        'aria-pressed': on ? 'true' : 'false',
        onclick: function () { selectProduct(p.key); } }, [
        h('span', { class:'nm' }, p.name),
        h('span', { class:'n' }, [ has ? rate(p.mass) : DASH, h('small', null, 't/h') ]),
        h('span', { class:'d' }, (has ? fmt(p.pct, 1) : DASH) + ' % \u00b7 ' + cut)
      ]);
    }));
  }
  /** A product's colour, from the theme, so it follows the lights. */
  function tone(key) { return THEME.get().stream[key] || THEME.get().ui.ink3; }

  /* ── the results rail ──────────────────────────────────────────────── */
  function renderResults() {
    var r = S.r, st = STATUS[S.status] || STATUS.ready, out = [];

    /* run state */
    var blk = [h('div', { class:'cap' }, 'Run state'), h('p', { class:'note', style:'margin:0' }, st[1])];
    if (S.pre) {
      blk.push(row('Charge', rate(S.pre.feed.molar) + ' kmol/h'));
      blk.push(row('Mean molar mass', fmt(S.pre.feed.M, 1) + ' kg/kmol'));
      blk.push(row('Flash-zone vapour', fmt(S.pre.flash.psi * 100, 1) + ' %'));
    }
    if (r) {
      blk.push(row('Cascade sweeps', String(r.outer)));
      blk.push(row(r.iters > 999 ? 'Equilibrium solves' : 'Flash iterations', group(r.iters)));
      blk.push(row('Solve time', Math.round(r.ms) + ' ms'));
      blk.push(msg(r.converged ? 'ok' : 'warn', r.converged ? 'Converged' : 'Iteration limit reached',
        r.converged ? 'The tray temperatures and the component flows both stopped moving inside tolerance.'
                    : 'The solver stopped at its iteration limit with the profile still moving. The numbers below are the last state it reached — not a converged answer.'));
      var tr = traceChart(r.trace);
      if (tr) {
        blk.push(h('div', null, [
          h('div', { class:'cap', style:'margin-bottom:5px' }, 'Residual, per sweep'),
          tr.svg,
          h('div', { class:'note' }, 'Temperature residual on a log scale, ' + tr.hi +
            ' K down to ' + tr.lo + ' K over ' + tr.n + ' sweeps.')
        ]));
      }
    }
    S.errs.forEach(function (e) { blk.push(msg('err', '!', e.msg || String(e))); });
    S.warns.forEach(function (w) { blk.push(msg('warn', '⚠', typeof w === 'string' ? w : (w.msg || ''))); });
    out.push(h('div', { class:'blk' }, blk));

    if (r) {
      /* headline figures.
         The numeral carries the colour, because in this interface colour
         means something. No coloured rule down the side of a card: that is
         decoration pretending to be information. Only the two figures that
         genuinely belong to a stream are tinted; the rest are ink. */
      var dist = r.products.filter(function (p) { return p.key !== 'residue'; })
                           .reduce(function (a, p) { return a + p.pct; }, 0);
      var U = THEME.get().ui;
      var figs = [
        ['Distillate yield',   fmt(dist, 1),                    '% of charge',  U.accent],
        ['Flash-zone vapour',  fmt(r.flash.psi * 100, 1),       '% vaporised',  U.ink],
        ['Top tray',           fmt(r.internals.Tprofile[1], 0), '\u00b0C',      U.ink],
        ['Sump',               fmt(r.energy.Tbot, 0),           '\u00b0C',      U.ink],
        ['Furnace duty',       fmt(r.energy.furnace, 0),        'MW',           tone('hot')],
        ['Condenser duty',     fmt(r.energy.condenser, 0),      'MW',           tone('vapour')]
      ];
      out.push(h('div', { class:'blk' }, [
        h('div', { class:'cap' }, 'Operating result'),
        h('div', { class:'figs' }, figs.map(function (f) {
          return h('div', { class:'fig' }, [
            h('span', { class:'n', style:'color:' + f[3] }, f[1]),
            h('span', { class:'u' }, f[2]),
            h('span', { class:'k' }, f[0])
          ]);
        }))
      ]));

      /* temperature profile and the stages */
      out.push(h('div', { class:'blk' }, [
        h('div', { class:'cap' }, 'Temperature profile'),
        profileChart(r),
        h('div', { class:'note' }, S.expert
          ? 'Every stage the solver carries, with the liquid and vapour traffic on it, in kmol/h.'
          : 'The named stages, top to bottom. Expert view lists every tray and its internal traffic.'),
        h('div', { class:'stgs' }, stageRows(r))
      ]));

      /* material balance */
      var closes = Math.abs(r.balance.closure) <= 1e-6;
      var bal = [h('div', { class:'cap' }, 'Material balance'),
        row('Crude charged', rate(r.balance.inMass) + ' t/h'),
        row('Stripping steam (inert)', rate(r.steam.mass) + ' t/h'),
        row('Products out', rate(r.balance.outMass) + ' t/h')];
      r.products.forEach(function (p) {
        bal.push(h('div', { class:'row' }, [
          h('i', { class:'sw', style:'background:' + tone(p.key) }),
          h('span', { class:'k' }, p.name),
          h('span', { class:'v' }, rate(p.mass) + ' t/h'),
          h('span', { class:'p' }, fmt(p.pct, 2) + ' %')
        ]));
      });
      bal.push(msg(closes ? 'ok' : 'warn', 'Σ',
        'Balance error ' + expo(Math.abs(r.balance.closure)) + ' of the charge, ' +
        (closes ? 'within the 1×10⁻⁶ tolerance — the products account for the whole charge.'
                : 'outside the 1×10⁻⁶ tolerance — treat the split as approximate.')));
      out.push(h('div', { class:'blk' }, bal));

      /* expert-only blocks */
      if (S.expert) {
        var I = r.internals;
        out.push(h('div', { class:'blk' }, [h('div', { class:'cap' }, 'Internal flows')].concat([
          ['Reflux to the top tray', rate(I.Ltop), 'kmol/h'],
          ['Vapour off the flash zone', rate(I.Vflash), 'kmol/h'],
          ['Liquid to the sump', rate(I.Lflash), 'kmol/h'],
          ['Distillate, vapour', rate(I.Dvap), 'kmol/h'],
          ['Distillate, liquid', rate(I.Dliq), 'kmol/h'],
          ['Theoretical stages', String(I.stages), ''],
          ['Charge, molar', rate(r.feed.molar), 'kmol/h'],
          ['Mean molar mass', fmt(r.feed.M, 1), 'kg/kmol'],
          ['Stripping steam', rate(r.steam.molar), 'kmol/h']
        ].map(function (q) {
          return h('div', { class:'row' }, [h('span', { class:'k' }, q[0]),
            h('span', { class:'v' }, q[1]), h('span', { class:'p' }, q[2])]);
        })).concat([h('div', { class:'note' },
          'Molar rates inside the tower. They are not product rates and do not sum to the charge.')])));
        var cut = cutChart(r, S.prod);
        if (cut) out.push(h('div', { class:'blk' }, [
          h('div', { class:'cap' }, 'Cut composition — ' + cut.name), cut.svg,
          h('div', { class:'note' }, cut.note)
        ]));
      }
    }

    /* run history */
    if (S.hist.length) {
      out.push(h('div', { class:'blk' }, [h('div', { class:'cap' }, 'Run history')].concat(
        S.hist.map(function (q, i) {
          return h('button', { class:'hrow' + (i === 0 ? ' now' : ''), title:'Load these inputs',
            onclick: function () { S.inputs = JSON.parse(JSON.stringify(q.snap)); markDirty(); render(); } }, [
            h('span', { class:'at' }, q.at),
            h('span', null, CDU.ASSAY[q.assay].name),
            h('span', { class:'y' }, fmt(q.yield, 1) + ' %'),
            h('span', { class:'m' }, fmt(q.furnaceT, 0) + ' °C · R ' + fmt(q.reflux, 2) +
              ' · ' + rate(q.feedRate) + ' t/h · ' + (q.conv ? 'converged' : 'limit') +
              ' in ' + q.ms + ' ms')
          ]);
        })).concat([h('div', { class:'note' }, 'Click a run to load its inputs back into the panel.')])));
    }

    /* assumptions */
    out.push(h('details', { class:'det' }, [
      h('summary', null, 'Model assumptions'),
      h('div', { class:'dbody' }, h('ul', null, ASSUMPTIONS.map(function (a) { return h('li', null, a); })))
    ]));

    fill($('results'), out);
  }

  function row(k, v, p) {
    return h('div', { class:'row' }, [h('span', { class:'k' }, k), h('span', { class:'v' }, v),
                                      p ? h('span', { class:'p' }, p) : null]);
  }
  function msg(tone, badge, text) {
    return h('div', { class:'msg ' + tone }, [h('b', null, badge), h('span', null, text)]);
  }

  /* ── charts ────────────────────────────────────────────────────────────
     Small SVGs built from the result. Each one plots something the solver
     produced; none of them smooths, extrapolates or fills a gap. */
  function profileChart(r) {
    var T = r.internals.Tprofile, P = r.internals.Pprofile;
    var W = 300, H = 190, ml = 34, mb = 26, mt = 10, mr = 8, n = T.length;
    var lo = Math.min.apply(null, T), hi = Math.max.apply(null, T);
    var pad = Math.max(6, (hi - lo) * 0.06), t0 = lo - pad, t1 = hi + pad;
    function X(t) { return ml + (W - ml - mr) * (t - t0) / Math.max(1e-6, t1 - t0); }
    function Y(j) { return mt + (H - mt - mb) * (j / Math.max(1, n - 1)); }
    var kids = [
      s('line', { class:'ax', x1:ml, y1:mt, x2:ml, y2:H - mb }),
      s('line', { class:'ax', x1:ml, y1:H - mb, x2:W - 6, y2:H - mb }),
      s('polyline', { class:'ln', points: T.map(function (t, j) {
        return X(t).toFixed(1) + ',' + Y(j).toFixed(1); }).join(' ') })
    ];
    T.forEach(function (t, j) {
      var kind = r.internals.stageKind[j] || '';
      kids.push(s('circle', { cx:X(t).toFixed(1), cy:Y(j).toFixed(1),
        r: (kind === 'draw' || j === 0 || j === r.internals.feedStage) ? 3.6 : 2.0,
        fill: RIG2D.heat(t, 30, 380) }));
    });
    for (var q = 0; q <= 4; q++) {
      var tv = t0 + (t1 - t0) * q / 4;
      kids.push(s('text', { class:'lbl', x:X(tv).toFixed(1), y:H - mb + 14, 'text-anchor':'middle' },
        fmt(tv, 0)));
    }
    kids.push(s('text', { class:'lbl', x:4, y:12 }, 'top'));
    kids.push(s('text', { class:'lbl', x:4, y:H - mb }, 'base'));
    return s('svg', { class:'chart', viewBox:'0 0 ' + W + ' ' + H, 'aria-hidden':'true' }, kids);
  }

  function traceChart(tr) {
    if (!tr || tr.length < 2) return null;
    var W = 300, H = 92, ml = 30, mb = 16, mt = 8, mr = 6;
    var y = tr.map(function (q) { return Math.log10(Math.max(1e-9, q[1])); });
    var lo = Math.min.apply(null, y), hi = Math.max.apply(null, y);
    function X(i) { return ml + (W - ml - mr) * (i / Math.max(1, tr.length - 1)); }
    function Y(v) { return mt + (H - mt - mb) * (1 - (v - lo) / Math.max(1e-6, hi - lo)); }
    var svg = s('svg', { class:'chart', viewBox:'0 0 ' + W + ' ' + H, 'aria-hidden':'true' }, [
      s('line', { class:'ax', x1:ml, y1:mt, x2:ml, y2:H - mb }),
      s('line', { class:'ax', x1:ml, y1:H - mb, x2:W - 6, y2:H - mb }),
      s('polyline', { class:'tr', points: y.map(function (v, i) {
        return X(i).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ') })
    ]);
    return { svg:svg, n:tr.length, hi:expo(Math.pow(10, hi)), lo:expo(Math.pow(10, lo)) };
  }

  /** One product's composition on the pseudocomponent grid — the model's own
   *  internal representation, shown rather than described. */
  function cutChart(r, prodKey) {
    var p = r.products.filter(function (q) { return q.key === (prodKey || 'kerosene'); })[0] || r.products[2];
    var tot = p.comp.reduce(function (a, v) { return a + v; }, 0);
    if (!(tot > 0)) return null;
    var W = 300, H = 110, ml = 6, mb = 18, mt = 6, n = p.comp.length;
    var bw = (W - ml * 2) / n, mx = Math.max.apply(null, p.comp);
    var kids = [s('line', { class:'ax', x1:4, y1:H - mb, x2:W - 4, y2:H - mb })];
    p.comp.forEach(function (v, i) {
      var bh = Math.max(0.6, (H - mt - mb) * v / mx);
      kids.push(s('rect', { x:(ml + i * bw).toFixed(1), y:(H - mb - bh).toFixed(1),
        width:Math.max(1.5, bw - 1.4).toFixed(1), height:bh.toFixed(1),
        fill:RIG2D.heat(CDU.NBP_C[i], 30, 380), rx:1 }));
    });
    kids.push(s('text', { class:'lbl', x:4, y:H - 4 }, CDU.NBP_C[0] + ' °C'));
    kids.push(s('text', { class:'lbl', x:W - 4, y:H - 4, 'text-anchor':'end' },
      CDU.NBP_C[n - 1] + ' °C'));
    return { name:p.name,
             svg:s('svg', { class:'chart', viewBox:'0 0 ' + W + ' ' + H, 'aria-hidden':'true' }, kids),
             note:'Molar flow of each pseudocomponent in the ' + p.name.toLowerCase() +
                  ', by normal boiling point. This is the grid the model actually solves on.' };
  }

  /** The stage list. The ordinary view names the stages an operator names;
   *  expert view lists every one with its internal traffic. Clicking a row
   *  takes the camera into the cutaway at that elevation. */
  function stageRows(r) {
    var I = r.internals, keep = { cond:1, draw:1, feed:1, sump:1 }, out = [];
    for (var j = 0; j < I.Tprofile.length; j++) {
      var kind = I.stageKind[j] || 'tray';
      if (!S.expert && !keep[kind] && j !== 0 && j !== I.Tprofile.length - 1) continue;
      out.push(stageRow(j, kind, I));
    }
    return out;
  }
  function stageRow(j, kind, I) {
    var kids = [
      h('i', { style:'background:' + RIG2D.heat(I.Tprofile[j], 30, 380) }),
      h('span', { class:'l' }, I.stageLabel[j] || ('Stage ' + j)),
      h('span', { class:'t' }, fmt(I.Tprofile[j], 0) + ' °C'),
      h('span', { class:'p' }, fmt(I.Pprofile[j], 0) + ' kPa')
    ];
    if (S.expert) {
      kids.push(h('span', { class:'p x' }, 'L ' + rate(I.Lprofile[j])));
      kids.push(h('span', { class:'p x' }, 'V ' + rate(I.Vprofile[j])));
    }
    return h('button', { class:'stg k-' + kind + (S.stage === j ? ' on' : ''),
      title:'Look at this stage in the cutaway',
      onclick: function () { selectStage(j); } }, kids);
  }

  /* ══ the 3D scene ═════════════════════════════════════════════════════ */
  function mountGL() {
    var cv = $('gl');
    try {
      plant = PLANT.build();
      gl = RIGGL.create(cv, plant, { maxDpr: 2, theme: S.theme });
    } catch (err) {
      $('glfail').hidden = false;
      $('glfail').textContent = 'WebGL is unavailable in this browser, so the 3D view cannot be drawn. '
        + 'Everything else works: use the Process view, which needs no WebGL.';
      S.view = '2d';
      render();
      return;
    }
    cams = RIGINFO.cameras(plant);
    camTo('plant', true);
    if (reduced) gl.state.flow = false;
    bindPointer(cv);
    buildTags();
    loop();
  }

  /** The render loop. It never touches the DOM through render(): the tag
   *  positions and the frame counter are written directly, so a 60 Hz scene
   *  does not drag a rebuild behind it. */
  function loop() {
    var last = performance.now(), acc = 0, frames = 0;
    function step(now) {
      if (!gl) { raf = 0; return; }
      var dt = (now - last) / 1000; last = now;
      if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
      try { gl.render(dt); placeTags(); } catch (e) { raf = 0; return; }
      acc += dt; frames++;
      if (acc >= 0.5) {
        var fps = Math.round(frames / acc);
        $('fps').textContent = fps + ' fps';
        adapt(fps);
        acc = 0; frames = 0;
      }
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }

  /** Hold the frame rate, and say so when holding it costs something. Two
   *  levers in the order that costs the viewer least: the tracers, which are
   *  decoration, then the backing-store resolution, which is what actually
   *  changes shading cost. Both climb back when the machine can afford them. */
  function adapt(fps) {
    var st = gl.state, note = '';
    if (fps < 26 && st.tracers > 0.35 && S.flow) st.tracers = 0.3;
    else if (fps < 22 && st.scale > 0.62) st.scale = Math.max(0.6, st.scale - 0.2);
    else if (fps > 52 && st.scale < 1) st.scale = Math.min(1, st.scale + 0.2);
    else if (fps > 55 && st.tracers < 1) st.tracers = 1;
    if (st.scale < 0.99 && st.tracers < 1) note = 'Tracers + resolution reduced';
    else if (st.scale < 0.99) note = 'Resolution reduced';
    else if (st.tracers < 1) note = 'Tracers thinned';
    var w = $('degrade');
    w.hidden = !note;
    if (note) {
      w.textContent = note;
      w.title = 'This machine could not hold a usable frame rate at full quality, so the scene is '
              + 'being drawn with ' + note.toLowerCase() + '. It goes back up on its own.';
    }
  }

  /* ── instrument tags, pinned to world points ───────────────────────── */
  function buildTags() {
    var host = $('tags');
    fill(host, null);
    tagEls = plant.instruments.map(function (ins) {
      var el = h('div', { class:'tag' }, [
        h('b', null, ins.key), h('span', { class:'v' }, DASH), h('u', null, '')
      ]);
      host.appendChild(el);
      return { el:el, at:ins.at, read:ins.read };
    });
    updateTagValues();
  }
  function updateTagValues() {
    tagEls.forEach(function (t) {
      var rd = reading(t.read);
      t.el.querySelector('.v').textContent = rd ? rd.v : DASH;
      t.el.querySelector('u').textContent = rd ? rd.u : '';
    });
  }
  /** One instrument reading, or null when nothing has been solved. */
  function reading(k) {
    var r = S.r;
    if (!r) return null;
    function draw(key) {
      var p = r.products.filter(function (q) { return q.key === key; })[0];
      return { v: fmt(p ? p.drawT : NaN, 0), u:'°C' };
    }
    var M = {
      charge:      function () { return { v:rate(r.feed.mass), u:'t/h' }; },
      top:         function () { return { v:fmt(r.internals.Tprofile[1], 0), u:'°C' }; },
      flash:       function () { return { v:fmt(r.flash.T, 0), u:'°C' }; },
      flashP:      function () { return { v:fmt(r.flash.P, 0), u:'kPa' }; },
      topP:        function () { return { v:fmt(r.internals.Pprofile[0], 0), u:'kPa' }; },
      drum:        function () { return { v:fmt(r.energy.Ttop, 0), u:'°C' }; },
      reflux:      function () { return { v:fmt(r.internals.reflux, 2), u:'' }; },
      kerosene:    function () { return draw('kerosene'); },
      diesel:      function () { return draw('diesel'); },
      gasoil:      function () { return draw('gasoil'); }
    };
    return M[k] ? M[k]() : null;
  }
  /** Project every tag, then drop the ones that would land on another. Ten
   *  tags on a tower this tall overlap from most angles, and a pile of
   *  half-legible labels is worse than the four that fit. */
  function placeTags() {
    if (!gl || !tagEls.length) return;
    var narrow = (window.innerWidth || 1200) < 760;
    var gapY = narrow ? 30 : 21, gapX = narrow ? 150 : 118, cap = narrow ? 4 : 10;
    var shown = [], placed = [];
    tagEls.forEach(function (t) {
      var p = gl.toScreen(t.at);
      if (!p) { t.el.style.opacity = '0'; return; }
      shown.push({ t:t, p:p });
    });
    shown.sort(function (a, b) { return a.p.d - b.p.d; });
    shown.forEach(function (q) {
      var clash = placed.some(function (p) {
        return Math.abs(p.y - q.p.y) < gapY && Math.abs(p.x - q.p.x) < gapX;
      });
      if (clash || placed.length >= cap) { q.t.el.style.opacity = '0'; return; }
      placed.push(q.p);
      q.t.el.style.opacity = String(Math.max(0.34, Math.min(1, 1.25 - q.p.d * 0.006)));
      q.t.el.style.transform = 'translate3d(' + Math.round(q.p.x) + 'px,' + Math.round(q.p.y) + 'px,0)';
    });
  }

  /* ── pointer, wheel, touch and keyboard ────────────────────────────── */
  function bindPointer(cv) {
    var drag = null, moved = 0, pinch = 0;
    function pos(e) { var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
    function orbit(dx, dy) {
      gl.cam.tYaw -= dx * 0.006;
      gl.cam.tPitch = Math.max(-0.28, Math.min(1.10, gl.cam.tPitch + dy * 0.005));
      camPreset = '';
      renderOverlay();
    }
    function zoom(f) { gl.cam.tDist = Math.max(18, Math.min(210, gl.cam.tDist * f)); }

    cv.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') return;
      cv.setPointerCapture(e.pointerId); drag = pos(e); moved = 0;
    });
    cv.addEventListener('pointermove', function (e) {
      var p = pos(e);
      if (drag) {
        orbit(p[0] - drag[0], p[1] - drag[1]);
        moved += Math.abs(p[0] - drag[0]) + Math.abs(p[1] - drag[1]);
        drag = p;
        return;
      }
      // Picking renders the id buffer and reads a pixel back, which stalls the
      // pipeline. Cap it by wall clock so a fast mouse cannot starve the scene.
      if (hoverRaf) return;
      var now = performance.now();
      if (now - hoverAt < 70) return;
      hoverAt = now;
      hoverRaf = requestAnimationFrame(function () {
        hoverRaf = 0;
        if (!gl) return;
        var k = gl.pickAt(p[0], p[1]);
        if (k !== gl.state.hov) { gl.state.hov = k; gl.refresh(); cv.style.cursor = k ? 'pointer' : 'grab'; }
        chip(k, p[0], p[1]);
      });
    });
    cv.addEventListener('pointerup', function (e) {
      if (!drag) return;
      var wasDrag = moved > 6; drag = null;
      if (wasDrag) return;
      var p = pos(e);
      select(gl ? gl.pickAt(p[0], p[1]) : null);
    });
    cv.addEventListener('pointercancel', function () { drag = null; });
    cv.addEventListener('pointerleave', function () {
      drag = null;
      if (gl && gl.state.hov) { gl.state.hov = null; gl.refresh(); }
      chip(null);
    });
    cv.addEventListener('wheel', function (e) {
      e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0014));
    }, { passive:false });

    function touches(e) {
      var b = cv.getBoundingClientRect(), t = e.touches;
      return { n:t.length, x:t[0].clientX - b.left, y:t[0].clientY - b.top,
               d: t.length > 1 ? Math.hypot(t[0].clientX - t[1].clientX,
                                            t[0].clientY - t[1].clientY) : 0 };
    }
    cv.addEventListener('touchstart', function (e) {
      var t = touches(e); drag = [t.x, t.y]; moved = 0; pinch = t.d;
    }, { passive:true });
    cv.addEventListener('touchmove', function (e) {
      var t = touches(e);
      if (t.n > 1 && pinch > 0) { zoom(pinch / Math.max(1, t.d)); pinch = t.d; moved = 99; e.preventDefault(); return; }
      if (drag) {
        orbit(t.x - drag[0], t.y - drag[1]);
        moved += Math.abs(t.x - drag[0]) + Math.abs(t.y - drag[1]);
        drag = [t.x, t.y];
        e.preventDefault();
      }
    }, { passive:false });
    cv.addEventListener('touchend', function () {
      var wasDrag = moved > 8, at = drag;
      drag = null; pinch = 0;
      if (!wasDrag && at && gl) select(gl.pickAt(at[0], at[1]));
    });

    cv.addEventListener('keydown', function (e) {
      var K = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] };
      if (K[e.key]) { e.preventDefault(); orbit(K[e.key][0] * 28, K[e.key][1] * 20); return; }
      if (e.key === '+' || e.key === '=') { e.preventDefault(); zoom(0.88); }
      if (e.key === '-' || e.key === '_') { e.preventDefault(); zoom(1.14); }
      if (e.key === 'Escape') select(null);
    });
    cv.style.cursor = 'grab';
  }

  /** The name that follows the cursor. Written directly: at 60 Hz this must
   *  not go through a rebuild. */
  function chip(key, x, y) {
    var el = $('hover');
    var d = key && RIGINFO.describe(key);
    if (!d) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = d.name;
    el.style.transform = 'translate3d(' + Math.round(x + 14) + 'px,' + Math.round(y + 14) + 'px,0)';
  }

  /* ── the overlay: info card, cameras, tour ─────────────────────────── */
  function renderOverlay() {
    updateTagValues();

    var info = RIGINFO.describe(S.sel);
    var card = $('info');
    if (!info) fill(card, null);
    else {
      var reads = (info.reads || []).map(function (k) { return [k, reading(k)]; })
                                    .filter(function (q) { return q[1]; });
      fill(card, [
        h('button', { class:'x', 'aria-label':'Close', onclick: function () { select(null); } }, '×'),
        h('div', { class:'cat' }, info.cat),
        h('h3', null, info.name),
        h('dl', null, [
          h('div', null, [h('dt', null, 'Purpose'), h('dd', null, info.purpose)]),
          h('div', null, [h('dt', null, 'How it works'), h('dd', null, info.how)]),
          h('div', null, [h('dt', null, 'Role in the separation'), h('dd', null, info.role)])
        ]),
        reads.length ? h('div', { class:'reads' }, reads.map(function (q) {
          return h('span', null, [q[0], ' ', h('b', null, q[1].v), ' ' + q[1].u]);
        })) : null
      ]);
    }
    card.hidden = !info;

    fill($('cams'), (cams || []).map(function (c) {
      return h('button', { class:'cam' + (camPreset === c.key ? ' on' : ''),
        onclick: function () { camTo(c.key); renderOverlay(); } }, c.label);
    }));

    var tour = $('tour');
    if (S.tour < 0) { tour.hidden = true; fill(tour, null); }
    else {
      var stop = RIGINFO.TOUR[S.tour];
      tour.hidden = false;
      fill(tour, [
        h('span', { class:'n' }, (S.tour + 1) + ' / ' + RIGINFO.TOUR.length),
        h('div', { style:'min-width:0' }, [h('h4', null, stop.title), h('p', null, stop.text)]),
        h('div', { style:'display:flex;flex-direction:column;gap:6px;margin-left:auto' }, [
          h('button', { class:'cam', onclick: function () { tourGo(S.tour + 1); } }, 'Next'),
          h('button', { class:'cam', onclick: function () { stopTour(); set({ tour:-1 }); } }, 'End')
        ])
      ]);
    }

    $('flowbtn').textContent = S.flow ? 'Pause flow' : 'Resume flow';
  }

  /* ══ boot ═════════════════════════════════════════════════════════════ */
  function boot() {
    // Resolve the theme first: the scene is created with it, so there is no
    // flash of the wrong palette and no second upload of every colour buffer.
    applyTheme(stored(), false);
    if (media && media.addEventListener) {
      media.addEventListener('change', function () {
        if (S.themePref === 'auto') applyTheme('auto', true);
      });
    }
    $('run').addEventListener('click', run);
    $('reset').addEventListener('click', reset);
    $('save').addEventListener('click', save);
    $('loadbtn').addEventListener('click', function () { $('loadfile').click(); });
    $('loadfile').addEventListener('change', load);
    $('flowbtn').addEventListener('click', function () {
      S.flow = !S.flow;
      if (gl) gl.state.flow = S.flow && !reduced;
      render();
    });
    mountGL();
    render();
    // Solve the base case once so the page opens on a result rather than an
    // empty panel. It is a couple of hundred milliseconds of idle time.
    setTimeout(run, 400);
  }

  return { boot: boot, state: S };
})();
APP.boot();
</script>
</body>
