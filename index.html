ot;exam&quot;,&quot;about&quot;],&quot;default&quot;:&quot;landing&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Startup&quot;},&quot;defaultMixture&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bt&quot;,&quot;ew&quot;,&quot;mw&quot;,&quot;hh&quot;,&quot;aw&quot;],&quot;default&quot;:&quot;bt&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Startup&quot;},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Startup&quot;}}\">\nclass Component extends DCLogic {\n  static COMP = {\n    benzene:{name:'Benzene',cas:'71-43-2',A:6.90565,B:1211.033,C:220.790,MW:78.11,Tb:80.1,lat:30.72,lo:8,hi:103},\n    toluene:{name:'Toluene',cas:'108-88-3',A:6.95464,B:1344.800,C:219.482,MW:92.14,Tb:110.6,lat:33.18,lo:6,hi:137},\n    ethanol:{name:'Ethanol',cas:'64-17-5',A:8.20417,B:1642.89,C:230.300,MW:46.07,Tb:78.37,lat:38.56,lo:20,hi:93},\n    water:{name:'Water',cas:'7732-18-5',A:8.07131,B:1730.63,C:233.426,MW:18.02,Tb:100.0,lat:40.65,lo:1,hi:100},\n    methanol:{name:'Methanol',cas:'67-56-1',A:8.07240,B:1574.99,C:238.870,MW:32.04,Tb:64.7,lat:35.21,lo:15,hi:84},\n    hexane:{name:'n-Hexane',cas:'110-54-3',A:6.87601,B:1171.17,C:224.410,MW:86.18,Tb:68.7,lat:28.85,lo:-25,hi:92},\n    heptane:{name:'n-Heptane',cas:'142-82-5',A:6.89385,B:1264.37,C:216.636,MW:100.20,Tb:98.4,lat:31.77,lo:-2,hi:124},\n    acetone:{name:'Acetone',cas:'67-64-1',A:7.11714,B:1210.595,C:229.664,MW:58.08,Tb:56.1,lat:29.10,lo:-13,hi:55}\n  };\n  static SOURCE = 'Antoine constants (mmHg, °C) from the Reid–Prausnitz–Poling / Lange compilations — the sets in general engineering use. Check: benzene at 80.0 °C → 759.0 mmHg (T_b 80.1 °C); water at 100.0 °C → 757.6 mmHg. Latent heats are at the normal boiling point.';\n  /** Convergence tolerance for the rating-mode shooting solve, in mole fraction.\n   *  A rating solution whose |x_N − x_B| exceeds this is reported as NOT CONVERGED\n   *  and is never presented as a valid result. */\n  static RATING_TOL = 1e-4;\n  static MIX = {\n    bt:{label:'Benzene / Toluene',a:'benzene',b:'toluene',alpha:2.45,ideal:true,az:null,note:'Close-boiling hydrocarbon pair and the classic teaching system. Raoult\\u2019s law is an excellent approximation; \\u03b1 \\u2248 2.4\\u20132.5 at 1 atm and no azeotrope exists at any pressure.'},\n    ew:{label:'Ethanol / Water',a:'ethanol',b:'water',alpha:2.20,ideal:false,az:{x:0.894,T:78.2,txt:'95.6 wt% ethanol, boiling at 78.2 \\u00b0C at 1 atm'},note:'Strongly non-ideal. A minimum-boiling azeotrope at 95.6 wt% ethanol (x \\u2248 0.894 mole fraction), boiling at 78.2 \\u00b0C at 1 atm, caps ordinary distillation \\u2014 an ideal model cannot reproduce it. Anhydrous ethanol needs azeotropic, extractive or membrane separation.'},\n    mw:{label:'Methanol / Water',a:'methanol',b:'water',alpha:3.60,ideal:false,az:null,note:'Moderately non-ideal but azeotrope-free, so it can be separated to any purity by ordinary distillation. Ideal VLE over-predicts \\u03b1 at low methanol content; use as a teaching approximation only.'},\n    hh:{label:'n-Hexane / n-Heptane',a:'hexane',b:'heptane',alpha:2.60,ideal:true,az:null,note:'Near-ideal homologous pair \\u2014 Raoult\\u2019s law applies well over the whole composition range.'},\n    aw:{label:'Acetone / Water',a:'acetone',b:'water',alpha:6.00,ideal:false,az:null,note:'Strongly non-ideal (large positive deviations) but azeotrope-free at 1 atm. \\u03b1 is very large at low acetone content and collapses towards the acetone end; the ideal model is indicative of the dilute-acetone separation only.'},\n    custom:{label:'Custom binary',a:null,b:null,alpha:2.5,ideal:true,az:null,note:'User-supplied Antoine constants. Data quality is your responsibility \\u2014 constants must be in mmHg and \\u00b0C, and within their fitted temperature range.'}\n  };\n  static TIPS = {\n    R:'Ratio of liquid returned to the column as reflux to the amount withdrawn as distillate. Increasing reflux generally improves separation but increases condenser and reboiler duty.',\n    q:'Feed quality: moles of saturated liquid added to the stripping section per mole of feed. q>1 subcooled liquid, q=1 saturated liquid, 0<q<1 partially vaporised, q=0 saturated vapour, q<0 superheated vapour.',\n    Rmin:'The reflux ratio at which an operating line first touches the equilibrium curve. At Rmin an infinite number of stages would be needed.',\n    Nmin:'Minimum theoretical stages at total reflux, from the Fenske equation using a geometric-mean relative volatility.',\n    eff:'Overall column efficiency = theoretical trays / actual trays. The reboiler is an equilibrium stage and is not converted to a tray.',\n    Qc:'Condenser duty, Qc = V\\u00b7\\u03bb, using a composition-weighted latent heat. Sensible heat and sub-cooling are neglected.',\n    Qr:'Reboiler duty, Qr = V\\u0304\\u00b7\\u03bb. Heat losses and feed pre-heat are neglected.'\n  };\n  static NAV = [['sim','Simulation'],['vle','VLE Explorer'],['mt','McCabe\\u2013Thiele'],['column','Column'],['results','Results'],['sens','Sensitivity'],['theory','Theory'],['exam','Exam Mode'],['validate','Validation'],['about','About']];\n  static EXPLAIN = [\n    ['Feed enters the column','The feed stream F, at composition z\\u1da0 and quality q, enters at the feed stage. Its quality decides how much of it joins the descending liquid and how much joins the rising vapour.'],\n    ['The reboiler generates vapour','Heat Q\\u1d3f boils the liquid held in the reboiler. The vapour it produces is the only source of the upward traffic that makes separation possible.'],\n    ['Vapour rises through the column','Vapour V flows upward through every tray, bubbling through the liquid held on each one.'],\n    ['Liquid descends','Liquid L flows downward from tray to tray, driven by gravity, contacting the rising vapour in counter-current.'],\n    ['Each stage approaches equilibrium','On an ideal tray the leaving vapour and liquid reach vapour\\u2013liquid equilibrium: y* = f(x). Real trays fall short of this, which is what tray efficiency accounts for.'],\n    ['The volatile component enriches the vapour','Because the more volatile component has the higher vapour pressure, the vapour leaving each tray is richer in it than the liquid it left behind.'],\n    ['The heavy component enriches the liquid','The reverse holds for the less volatile component: it condenses preferentially, so the descending liquid becomes steadily heavier.'],\n    ['The condenser makes distillate','Overhead vapour is condensed by removing duty Q_C. Part of the condensate is drawn off as distillate D at composition x_D.'],\n    ['Reflux returns liquid to the column','The remainder, L = R\\u00b7D, is returned as reflux. Reflux is what creates the liquid traffic in the rectifying section \\u2014 without it there would be no rectification.'],\n    ['Bottom product leaves the reboiler','Liquid depleted of the volatile component leaves as bottoms B at composition x_B. The overall balance F = D + B always closes.']\n  ];\n  static EQUIP = {\n    tank:{title:'Feed tank (T-101)',body:'Atmospheric storage providing surge volume upstream of the column so that feed rate is decoupled from upstream batch operations. Sized for residence time, not modelled here.'},\n    pump:{title:'Feed pump (P-101)',body:'Centrifugal pump raising the feed from storage pressure to column pressure plus line and control-valve losses. Hydraulics are not part of the equilibrium model.'},\n    preheat:{title:'Feed preheater (E-101)',body:'Sets the feed quality q that the simulation uses. Duty is what moves the feed between subcooled liquid, saturated liquid, part-vaporised and saturated vapour.'},\n    column:{title:'Fractionating column (C-101)',body:'The counter-current contacting device. Stage count, feed stage and internals are set on the left; the stage table shows the resulting profile.'},\n    cond:{title:'Overhead condenser (E-102)',body:'Removes the latent heat of the overhead vapour. A total condenser gives a liquid distillate with y\\u2081 = x_D; a partial condenser acts as an extra equilibrium stage. This simulator models the total-condenser case only \\u2014 no condenser stage is added to the stage count.'},\n    drum:{title:'Reflux drum (V-101)',body:'Holds condensate and splits it between reflux and distillate product. Level control on the drum sets the distillate draw; the reflux ratio is the control handle you adjust.'},\n    reb:{title:'Reboiler (E-103)',body:'Supplies the boil-up. A kettle reboiler behaves as one theoretical equilibrium stage, which is why the stage count here includes it.'},\n    prod:{title:'Product draws',body:'Distillate D at x_D and bottoms B at x_B. Their rates follow directly from the overall and component material balances.'}\n  };\n  static THEORY = [\n    ['t1','What is fractional distillation?','Separation of a liquid mixture into fractions by repeated partial vaporisation and partial condensation in counter-current contact. A single flash gives one equilibrium stage; a column stacks many of them, and reflux makes the stages work in series so that a separation far beyond one flash becomes possible.'],\n    ['t2','Vapour\\u2013liquid equilibrium','At equilibrium the fugacity of each component is equal in both phases. For an ideal system that reduces to Raoult\\u2019s law, y\\u1d62P = x\\u1d62P\\u1d62\\u02e2\\u1d43\\u1d57. The x\\u2013y diagram in the VLE Explorer is the whole basis of the stage calculation \\u2014 no separation is possible where the curve touches the diagonal.'],\n    ['t3','Relative volatility','\\u03b1 = (y_A/x_A)/(y_B/x_B). For an ideal mixture \\u03b1 = P_A\\u02e2\\u1d43\\u1d57/P_B\\u02e2\\u1d43\\u1d57, a weak function of temperature. \\u03b1 close to 1 means a difficult separation needing many stages; \\u03b1 = 1 means no separation is possible by ordinary distillation.'],\n    ['t4','Raoult\\u2019s law','p_A = x_A P_A\\u02e2\\u1d43\\u1d57. Valid when the components are chemically similar so that activity coefficients are near unity \\u2014 benzene/toluene, hexane/heptane. It fails for alcohol\\u2013water systems, which is why those mixtures are flagged in this simulator.'],\n    ['t5','Bubble point','The temperature at which the first bubble of vapour forms: \\u03a3 x\\u1d62P\\u1d62\\u02e2\\u1d43\\u1d57(T) = P. Every stage temperature in the profile chart is a bubble-point calculation on that stage\\u2019s liquid composition.'],\n    ['t6','Dew point','The temperature at which the first drop of liquid forms: \\u03a3 y\\u1d62P/P\\u1d62\\u02e2\\u1d43\\u1d57(T) = 1. Between bubble and dew point the mixture is two-phase.'],\n    ['t7','Reflux','Condensed overhead liquid returned to the top of the column. Reflux supplies the descending liquid in the rectifying section; without it the section above the feed does nothing.'],\n    ['t8','Rectifying section','Above the feed. Operating line y = R/(R+1)\\u00b7x + x_D/(R+1). Its slope rises towards 1 as reflux increases, moving the line away from the equilibrium curve and making each stage more effective.'],\n    ['t9','Stripping section','Below the feed. The operating line runs from (x_B, x_B) to the intersection with the q-line, and its job is to strip the volatile component out of the descending liquid.'],\n    ['t10','Feed condition','How much of the feed is liquid decides how much joins each internal stream: L\\u0304 = L + qF and V\\u0304 = V \\u2212 (1\\u2212q)F. Feed condition is a genuine design variable, not a detail.'],\n    ['t11','The q-line','The locus of intersections of the two operating lines: y = q/(q\\u22121)\\u00b7x \\u2212 z\\u1da0/(q\\u22121). Vertical for saturated liquid, horizontal for saturated vapour. It always passes through (z\\u1da0, z\\u1da0).'],\n    ['t12','McCabe\\u2013Thiele method','A graphical solution of the stage-by-stage balances, valid under constant molar overflow. Steps between the operating lines and the equilibrium curve count equilibrium stages directly.'],\n    ['t13','Theoretical stages','A theoretical stage produces vapour and liquid in equilibrium. The number required follows from the specifications and the reflux; real trays are fewer in effect, hence efficiency.'],\n    ['t14','Tray efficiency','Overall efficiency E\\u2092 = N_theoretical / N_actual. Typical values are 0.5\\u20130.8 for hydrocarbon systems. Murphree efficiency is defined per tray and is the more rigorous measure.'],\n    ['t15','Total vs partial condenser','A total condenser condenses all overhead vapour: y\\u2081 = x_D and it is not an equilibrium stage. A partial condenser produces vapour distillate and does act as one extra stage. Note on this simulator: only the total condenser is implemented, so every stage count on screen assumes y\\u2081 = x_D.'],\n    ['t16','Reboiler','A kettle reboiler is a partial reboiler and counts as one equilibrium stage. A thermosiphon reboiler with vapour return may be treated as less than a full stage.'],\n    ['t17','Minimum reflux','At R_min an operating line touches the equilibrium curve \\u2014 a pinch \\u2014 and stage-to-stage progress stops. Real columns run at 1.1\\u20131.5\\u00d7R_min, the economic trade-off between column height and energy.'],\n    ['t18','Total reflux','No products are withdrawn; the operating lines collapse onto the diagonal and the stage count reaches its minimum, N_min, given by the Fenske equation. Used for start-up and for column testing.'],\n    ['t19','Flooding and weeping','Too much vapour and the liquid cannot descend \\u2014 the column floods. Too little and liquid rains through the tray perforations \\u2014 weeping. Both bound the operating window; hydraulics are outside the scope of this equilibrium model.'],\n    ['t20','Industrial applications','Crude-oil fractionation, air separation, solvent recovery, ethanol dehydration (with entrainers, because of the azeotrope), petrochemical splitters. Distillation is responsible for a large share of industrial separation energy use \\u2014 which is why reflux ratio matters commercially.']\n  ];\n\n  state = {\n    view:(this.props||{}).startView||'landing', mixKey:(this.props||{}).defaultMixture||'bt', model:'raoult', P:101.325, alphaC:2.45,\n    F:100, zF:0.45, q:1.0, xD:0.96, xB:0.04, R:2.2, Nspec:12, DF:0.45,\n    eff:0.70, reb:'partial', calcMode:'design',\n    mode:'learning', theme:'light', colView:'stages', equip:'column', colVP:'front',\n    anim:999, hoverStage:null, tip:null, tipXY:[0,0],\n    explaining:false, explainI:0, wiVar:'R', wiTo:3.2, whatIf:null,\n    sens:{ind:'R',dep:'N',min:1.2,max:6,n:24}, exam:{i:0,reveal:'',input:''},\n    theoryOpen:'t1', toast:'', vleShow:'xy', mtDrag:null, vleHover:null,\n    theme:(this.props||{}).defaultTheme||'light',\n    custom:{a:{name:'Component A',A:6.90565,B:1211.033,C:220.79,MW:78.11,Tb:80.1,lat:30.8},\n            b:{name:'Component B',A:6.95464,B:1344.800,C:219.48,MW:92.14,Tb:110.6,lat:33.2}}\n  };\n  setCustom(side,field,val){\n    const c=this.state.custom, side2=Object.assign({},c[side],{[field]:field==='name'?val:parseFloat(val)});\n    this.setState({custom:Object.assign({},c,{[side]:side2})});\n  }\n\n  componentWillUnmount(){ if(this._t) clearInterval(this._t); if(this._tt) clearTimeout(this._tt); }\n\n  // ---------- thermodynamics ----------\n  compsOf(s){\n    const m = Component.MIX[s.mixKey];\n    if(s.mixKey==='custom' && s.custom) return [s.custom.a, s.custom.b];\n    return [Component.COMP[m.a], Component.COMP[m.b]];\n  }\n  psat(c,T){ return Math.pow(10, c.A - c.B/(T + c.C)) * 0.13332239; }\n  bubbleT(x,s){\n    const [A,B]=this.compsOf(s); let lo=-80, hi=500;\n    for(let i=0;i<70;i++){ const T=(lo+hi)/2; const P=x*this.psat(A,T)+(1-x)*this.psat(B,T); if(P>s.P) hi=T; else lo=T; }\n    return (lo+hi)/2;\n  }\n  dewT(y,s){\n    const [A,B]=this.compsOf(s); let lo=-80, hi=500;\n    for(let i=0;i<70;i++){ const T=(lo+hi)/2; const f=y*s.P/this.psat(A,T)+(1-y)*s.P/this.psat(B,T); if(f<1) hi=T; else lo=T; }\n    return (lo+hi)/2;\n  }\n  curve(s){\n    const key=[s.mixKey,s.model,s.P,s.alphaC,s.custom?JSON.stringify(s.custom):''].join('|');\n    if(this._ck===key) return this._cv;\n    const n=240, xs=[], ys=[], Ts=[], as=[], [A,B]=this.compsOf(s);\n    for(let i=0;i<=n;i++){\n      const x=i/n; const T=this.bubbleT(x,s);\n      const pa=this.psat(A,T), pb=this.psat(B,T);\n      const alpha = s.model==='alpha' ? +s.alphaC : pa/pb;\n      const y = s.model==='alpha' ? alpha*x/(1+(alpha-1)*x) : Math.min(1,Math.max(0, x*pa/s.P));\n      xs.push(x); ys.push(y); Ts.push(T); as.push(alpha);\n    }\n    this._ck=key; this._cv={xs,ys,Ts,as};\n    return this._cv;\n  }\n  yEq(x,s){\n    const c=this.curve(s), n=c.xs.length-1, t=Math.min(Math.max(x,0),1)*n, i=Math.min(n-1,Math.floor(t)), f=t-i;\n    return c.ys[i]+(c.ys[i+1]-c.ys[i])*f;\n  }\n  xEq(y,s){\n    const c=this.curve(s); const yy=Math.min(Math.max(y,0),1);\n    let lo=0, hi=c.ys.length-1;\n    while(hi-lo>1){ const m=(lo+hi)>>1; if(c.ys[m]<=yy) lo=m; else hi=m; }\n    const d=c.ys[hi]-c.ys[lo];\n    return d<1e-12 ? c.xs[lo] : c.xs[lo]+(c.xs[hi]-c.xs[lo])*(yy-c.ys[lo])/d;\n  }\n  alphaAt(x,s){ const c=this.curve(s), i=Math.round(Math.min(Math.max(x,0),1)*(c.xs.length-1)); return c.as[i]; }\n  tempAt(x,s){ const c=this.curve(s), n=c.xs.length-1, t=Math.min(Math.max(x,0),1)*n, i=Math.min(n-1,Math.floor(t)), f=t-i; return c.Ts[i]+(c.Ts[i+1]-c.Ts[i])*f; }\n\n  // ---------- column ----------\n  qIntersect(s){\n    const q=+s.q, zF=+s.zF;\n    if(Math.abs(q-1)<1e-4) return {x:zF, y:this.yEq(zF,s)};\n    const m=q/(q-1), b=-zF/(q-1);\n    let lo=1e-5, hi=1-1e-5;\n    const f=(x)=> this.yEq(x,s)-(m*x+b);\n    let flo=f(lo), fhi=f(hi);\n    if(flo*fhi>0) return {x:zF, y:this.yEq(zF,s)};\n    for(let i=0;i<60;i++){ const mid=(lo+hi)/2, fm=f(mid); if(flo*fm<=0){hi=mid; fhi=fm;} else {lo=mid; flo= feeds are both legitimate in this model, so no artificial bound is set. */\n  static LIMITS = {\n    F     :{min:0,minOpen:true,label:'Feed flowrate F',unit:' kmol/h'},\n    zF    :{min:0,max:1,minOpen:true,maxOpen:true,label:'Feed composition z_F'},\n    xD    :{min:0,max:1,minOpen:true,maxOpen:true,label:'Distillate composition x_D'},\n    xB    :{min:0,max:1,minOpen:true,maxOpen:true,label:'Bottoms composition x_B'},\n    R     :{min:0,minOpen:true,label:'Reflux ratio R'},\n    P     :{min:0,minOpen:true,label:'Column pressure P',unit:' kPa'},\n    eff   :{min:0,max:1,minOpen:true,label:'Overall tray efficiency'},\n    DF    :{min:0,max:1,minOpen:true,maxOpen:true,label:'Distillate cut D/F'},\n    Nspec :{min:3,max:60,integer:true,label:'Theoretical stages N'},\n    alphaC:{min:1,minOpen:true,label:'Relative volatility α'},\n    q     :{label:'Feed quality q'}\n  };\n  /** Antoine C must keep T + C > 0 across the whole −80…500 °C interval that\n   *  bubbleT/dewT bisect over, so the correlation never crosses its pole inside\n   *  the solver's own search bracket. Solver-domain bound, not a literature\n   *  value; every shipped component satisfies it (lowest is n-heptane, 216.6). */\n  static ANTOINE_C_MIN = 80;\n  /** solve() emits plain strings and is deliberately left byte-identical, so its\n   *  messages are classified for display here rather than at source. */\n  static SOLVE_KIND = [\n    [/^Rating solution did not converge/, 'domain'],\n    [/^Antoine extrapolation/, 'domain']\n  ];\n\n  num(v){\n    if(typeof v === 'number') return v;\n    if(typeof v === 'string' && v.trim() !== '') return Number(v);\n    return NaN;\n  }\n  /** One numeric field against Component.LIMITS. Never coerces: an out-of-domain\n   *  value is reported, not clamped. */\n  checkNum(key,val,out){\n    const L = Component.LIMITS[key], n = this.num(val);\n    if(!Number.isFinite(n)){\n      const why = (val===''||val===undefined||val===null) ? ' — the field is empty.'\n        : (t stant C must exceed '+Component.ANTOINE_C_MIN+' so that T + C stays positive across the −80…500 °C range the bubble- and dew-point solver searches. Below that the correlation crosses its pole inside the solver’s own bracket and the vapour pressure is meaningless.'});\n      const MW=need('MW','Molar mass');\n      if(MW!==null && !(MW>0)) out.push({kind:'input',field:'custom',msg:lbl+': molar mass must be positive.'});\n      need('Tb','Normal boiling point T_b');\n      if(d.lat!==undefined){ const la=need('lat','Latent heat of vaporisation');\n        if(la!==null && !(la>0)) out.push({kind:'input',field:'custom',msg:lbl+': latent heat of vaporisation must be positive.'}); }\n    });\n    const na=String(c.a.name===undefined?'':c.a.name).trim().toLowerCase();\n    const nb=String(c.b.name===undefined?'':c.b.name).trim().toLowerCase();\n    if(na && na===nb) out.push({kind:'input',field:'custom',msg:'The two components of a binary mixture must have different names.'});\n  }\n  /** Single gate in front of the engine. Runs before solve() on every render and\n   *  inside variant(), so no programmatic caller (sensitivity sweep, what-if\n   *  comparison, exam generator) can reach the equations with invalid input. */\n  validateInputs(s){\n    const E=[];\n    ['F','zF','P','R','q'].forEach(k=>this.checkNum(k,s[k],E));\n    this.checkNum('eff',s.eff,E);\n    if(s.calcMode==='rating'){ this.checkNum('Nspec',s.Nspec,E); this.checkNum('DF',s.DF,E); }\n    else { this.checkNum('xD',s.xD,E); this.checkNum('xB',s.xB,E); }\n    if(s.model==='alpha') this.checkNum('alphaC',s.alphaC,E);\n    if(s.mixKey==='custom') this.checkCustom(s,E);\n    else if(!Component.MIX[s.mixKey]) E.push({kind:'input',field:'mixKey',msg:'Unknown mixture selection “'+String(s.mixKey)+'”.'});\n    return {ok:E.length===0, errors:E};\n  }\n  kindOf(msg){\n    const h=Component.SOLVE_KIND.find(k=>k[0].test(msg));\n    return h ? h[1] : 'spec';\n  }\n  /** Builds the 3D column scene from a solved case.\n \n    } else {\n      out.mtOk=false; out.mtSegs=[]; out.mtMarks=[]; out.mtPoints=[]; out.mtSummary=[];\n      out.rectLine={x1:0,y1:0,x2:0,y2:0}; out.stripLine={x1:0,y1:0,x2:0,y2:0};\n      out.qLine={x1:0,y1:0,x2:0,y2:0}; out.rminLine={x1:0,y1:0,x2:0,y2:0};\n      out.mtStepInfo='Resolve the input errors above to build the diagram.'; out.shownStages='\\u2014';\n    }\n    out.mtDown=(e)=>this.setState({mtDrag:e.currentTarget.dataset.k});\n    out.mtUp=()=>this.setState({mtDrag:null});\n    out.mtMove=(e)=>{\n      if(!this.state.mtDrag) return;\n      const b=e.currentTarget.getBoundingClientRect();\n      let x=(((e.clientX-b.left)/b.width)*500-60)/400;\n      x=Math.min(0.999,Math.max(0.001,x));\n      const k=this.state.mtDrag, st=this.state;\n      if(k==='xD') this.setState({xD:Math.max(x,+st.zF+0.005),whatIf:null});\n      else if(k==='xB') this.setState({xB:Math.min(x,+st.zF-0.005),whatIf:null});\n      else this.setState({zF:Math.min(Math.max(x,+st.xB+0.005),+st.xD-0.005),whatIf:null});\n    };\n    out.runSteps=()=>{ if(this._t) clearInterval(this._t);\n      // Never start on state the gate rejects, and never keep ticking on it.\n      // The tick used to call solve() directly; its throw pre-empted\n      // clearInterval, so the interval raised on every tick indefinitely.\n      if(!this.validateInputs(this.state).ok){\n        this.flash('Fix the reported input problems before stepping the stages.'); return; }\n      this.setState({anim:0});\n      this._t=setInterval(()=>{ const n=(this.state.anim||0)+1;\n        const v=this.variant(this.state,{}), tot=v.ok?(v.stages||[]).length:0;\n        this.setState({anim:n});\n        if(!v.ok || n>=tot){ clearInterval(this._t); this._t=null; } },260); };\n    out.stepOne=()=>this.setState({anim:(s.anim>=900?0:s.anim)+1});\n    out.stepBack=()=>this.setState({anim:Math.max(0,(s.anim>=900?0:s.anim)-1)});\n    out.stepAll=()=>{ if(this._t) clearInterval(this._t); this.setState({anim:999}); };\n\n    // ---- results / export ----\n    out.inputRows=[['Binary mixture',(r.mix&&r.mix.label)||''],['Thermodynamic model',s.model==='raoult'?'Ideal VLE (Raoult)':'Constant \\u03b1 = '+f(s.alphaC,2)],\n      ['Specification mode',s.calcMode==='design'?'Design (purities fixed)':'Rating (stages fixed)'],\n      ['Pressure',f(s.P,2)+' kPa'],['Feed flowrate F',f(s.F,2)+' kmol/h'],['Feed composition z_F',f(s.zF,4)],\n      ['Feed quality q',f(s.q,3)+' — '+this.qPhase(+s.q)],\n      s.calcMode==='design'?['Distillate spec x_D',f(s.xD,4)]:['Stages specified N',String(s.Nspec)],\n      s.calcMode==='design'?['Bottoms spec x_B',f(s.xB,4)]:['Distillate cut D/F',f(s.DF,3)],\n      ['Reflux ratio R',f(s.R,3)],['Overall efficiency',f(s.eff,2)],\n      ['Condenser','Total condenser \\u2014 the only treatment this model implements'],['Reboiler',s.reb==='partial'?'Partial (kettle)':'Total'],\n      ['Internals','Trays \\u2014 stagewise model; packed columns and HETP are not modelled']].map(a=>({k:a[0],v:a[1]}));\n    out.calcRows=hasR?[['Distillate D',f(r.D,3)+' kmol/h'],['Bottoms B',f(r.B,3)+' kmol/h'],\n      ['x_D',f(r.xD,5)],['x_B',f(r.xB,5)],['Recovery of light key',(100*r.rec).toFixed(2)+' %'],\n      ['Heavy-key recovery in bottoms',(100*r.recB).toFixed(2)+' %'],\n      ['Separation factor',r.sep>=1000?r.sep.toExponential(3):f(r.sep,2)],\n      ['Theoretical stages (incl. reboiler)',f(r.N,0)],['Actual trays',f(r.Nact,0)],['Feed stage',f(r.feedStage,0)],\n      ['Minimum reflux R_min',f(r.Rmin,4)],['R / R_min',f(r.R/r.Rmin,3)],['Minimum stages N_min',f(r.Nmin,3)],\n      ['Mean relative volatility',f(r.aAvg,3)],\n      ['Reflux L',f(r.L,2)+' kmol/h'],['Vapour V (rectifying)',f(r.V,2)+' kmol/h'],\n      ['Liquid L\\u0304 (stripping)',f(r.Lb,2)+' kmol/h'],['Boil-up V\\u0304',f(r.Vb,2)+' kmol/h'],\n      ['Condenser duty Q_C',f(r.Qc,4)+' MW'],['Reboiler duty Q_R',f(r.Qr,4)+' MW'],\n      ['Top / bottom temperature',f(r.Ttop,2)+' / '+f(r.Tbot,2)+' \\u00b0C']].map(a=>({k:a[0],v:a[1]})):[];\n    out.assumptions=['Steady-state operation','Binary mixture; the two components account for the whole stream',\n      'Constant molar overflow in each section (equimolar latent heats)',\n      s.model==='raoult'?'Ideal vapour\\u2013liquid equilibrium: Raoult\\u2019s law with Antoine vapour pressures; ideal gas vapour phase':'Constant relative volatility independent of composition and temperature. Stage, top and bottom temperatures are still read from the selected pair\\u2019s Antoine bubble-point curve and do not depend on \\u03b1, so they are a nominal overlay and are not thermodynamically consistent with the \\u03b1 in use \\u2014 the mismatch reaches a few \\u00b0C when \\u03b1 differs from the pair\\u2019s true value.',\n      'Uniform column pressure — no tray pressure drop','Negligible heat loss to the environment',\n      s.reb==='partial'?'Partial reboiler treated as one theoretical equilibrium stage':'Total reboiler contributes no equilibrium stage',\n      'Total condenser only: the overhead vapour is condensed completely, so y\\u2081 = x_D and the condenser is not an equilibrium stage. A partial condenser \\u2014 which would contribute one additional equilibrium stage \\u2014 is NOT modelled; the stage count is unchanged whatever condenser hardware a real column would use.',\n      'Overall tray efficiency applied uniformly; Murphree efficiencies not resolved per tray',\n      'Tray column only: the stage calculation is internals-agnostic. Packed columns are NOT modelled \\u2014 no HETP, packed height or transfer-unit (HTU/NTU) calculation is performed.',\n      'Condenser and reboiler duties are latent-heat only; sensible heat, sub-cooling and feed pre-heat are excluded',\n      'Column hydraulics (flooding, weeping, pressure drop, sizing) are outside this model'];\n    out.exportCSV=()=>{\n      const rows=[['DISTILLEX simulation export'],['Generated',new Date().toISOString()],\n        ['Run status',runIssues.length\n          ? 'REJECTED - no results were produced; the inputs below are the entries as submitted'\n          : 'completed']]\n        .concat(runIssues.map(e=>['  '+e.kind+' issue',e.msg]),[[],['USER INPUTS']])\n        .concat(out.inputRows.map(a=>[a.k,a.v]),[[],['CALCULATED RESULTS']],out.calcRows.map(a=>[a.k,a.v]),\n        [[],['MATERIAL BALANCE (identity - D and B are solved from it; not an independent check)'],\n         ['F = D + B',hasR?f(r.F,4)+' = '+f(r.D,4)+' + '+f(r.B,4):'n/a'],\n         ['F.zF = D.xD + B.xB',hasR?f(r.F*r.zF,4)+' = '+f(r.D*r.xD,4)+' + '+f(r.B*r.xB,4):'n/a'],\n         ['Identity residual overall / component (kmol/h)',hasR?r.bal.fRes.toExponential(3)+' / '+r.bal.cRes.toExponential(3):'n/a'],\n         [],['NUMERICAL CONVERGENCE'],\n         ['Solve mode',hasR?(r.bal.rating?'Rating - shooting on x_D':'Design - direct stage stepping'):'n/a'],\n         ['Terminal stage liquid x_N',hasR?r.bal.xN.toFixed(6):'n/a'],\n         [hasR&&r.bal.rating?'Shooting residual |x_N - x_B| (mole fraction)':'Terminal overshoot x_B - x_N (mole fraction)',\n          hasR?Math.abs(r.bal.stepResid).toExponential(3):'n/a'],\n         ['Convergence tolerance (mole fraction)',hasR?(r.bal.rating?r.bal.tol.toExponential(0):'n/a - design mode is not iterative'):'n/a'],\n         ['Converged',hasR?(r.bal.converged?'yes':'NO'):'n/a']],\n        [[],['STAGE PROFILE'],['Stage','Section','x','y','T (C)','alpha','L','V']],\n        (hasR?r.stages:[]).map(a=>[a.n,a.rect?'Rectifying':'Stripping',a.x.toFixed(5),a.y.toFixed(5),a.T.toFixed(2),a.a.toFixed(4),a.L.toFixed(2),a.V.toFixed(2)]),\n        [[],['ASSUMPTIONS']],out.assumptions.map(a=>[a]));\n      this.download('distillex-results.csv',rows.map(rw=>rw.map(c=>'\"'+String(c).replace(/\"/g,'\"\"')+'\"').join(',')).join('\\n'),'text/csv');\n      this.flash('CSV exported');\n    };\n    out.exportJSON=()=>{\n      this.download('distillex-results.json',JSON.stringify({generated:new Date().toISOString(),\n        run:{completed:runIssues.length===0,\n          issues:runIssues.map(e=>({kind:e.kind,field:e.field||undefined,message:e.msg}))},\n        inputs:this.cfg(),model:s.model,assumptions:out.assumptions,\n        results:hasR?{D:r.D,B:r.B,xD:r.xD,xB:r.xB,N:r.N,Nact:r.Nact,feedStage:r.feedStage,Rmin:r.Rmin,Nmin:r.Nmin,\n          recovery:r.rec,Qc_MW:r.Qc,Qr_MW:r.Qr,L:r.L,V:r.V,Lbar:r.Lb,Vbar:r.Vb,Ttop:r.Ttop,Tbot:r.Tbot,\n          materialBalanceIdentity:{overall:r.bal.fRes,component:r.bal.cRes,\n            note:'D and B are solved from F = D + B and F.zF = D.xD + B.xB, so these residuals are zero by construction and are not an independent validation.'},\n          convergence:{mode:r.bal.rating?'rating-shooting':'design-stepping',\n            terminalStageLiquid_xN:r.bal.xN,\n            residual:r.bal.stepResid,\n            residualDefinition:r.bal.rating?'x_N - x_B (shooting residual)':'x_B - x_N (integer-stage terminal overshoot)',\n            toleranceMoleFraction:r.bal.rating?r.bal.tol:null,\n            converged:r.bal.converged}}:null,\n        stages:hasR?r.stages.map(a=>({n:a.n,section:a.rect?'rectifying':'stripping',x:a.x,y:a.y,T:a.T,alpha:a.a,L:a.L,V:a.V})):[]\n      },null,2),'application/json');\n      this.flash('JSON exported');\n    };\n    out.printReport=()=>window.print();\n\n    // ---- sensitivity ----\n    const L=this.sensLists(s);\n    out.sensInd=L.ind.map(a=>({k:a[0],label:a[1]})); out.sensDep=L.dep.map(a=>({k:a[0],label:a[1]}));\n    out.sv={ind:s.sens.ind,dep:s.sens.dep,min:s.sens.min,max:s.sens.max,n:s.sens.n};\n    if(s.view==='sens'){\n      const ind=L.ind.some(a=>a[0]===s.sens.ind)?s.sens.ind:L.ind[0][0];\n      const dep=L.dep.some(a=>a[0]===s.sens.dep)?s.sens.dep:L.dep[0][0];\n      const n=Math.max(3,Math.min(60,Math.round(+s.sens.n))), lo=+s.sens.min, hi=+s.sens.max;\n      const rangeOk=Number.isFinite(lo)&&Number.isFinite(hi);\n      const pts=[]; let fails=0;\n      for(let i=0;rangeOk&&i<n;i++){\n        const val=lo+(hi-lo)*i/(n-1);\n        const v=this.variant(s,{[ind]:ind==='Nspec'?Math.round(val):val});\n        if(!v.ok){ fails++; continue; }\n        const dv={N:v.N,Nact:v.Nact,Rmin:v.Rmin,Qr:v.Qr,Qc:v.Qc,D:v.D,xD:v.xD,xB:v.xB,rec:v.rec}[dep];\n        if(isFinite(dv)) pts.push([val,dv]);\n      }\n      const ys=pts.map(p=>p[1]);\n      const ymin=ys.length?Math.min.apply(null,ys):0, ymax=ys.length?Math.max.apply(null,ys):1;\n      const pad=(ymax-ymin)*0.08||Math.abs(ymax)*0.08||1;\n      const y0=ymin-pad, y1=ymax+pad;\n      const SX=(x)=>70+540*((x-lo)/((hi-lo)||1)), SY=(y)=>250-210*((y-y0)/((y1-y0)||1));\n      out.sensPts=this.poly(pts.map(p=>[SX(p[0]),SY(p[1])]));\n      out.sensDots=pts.filter((p,i)=>i%Math.ceil(pts.length/18||1)===0).map(p=>({cx:SX(p[0]).toFixed(1),cy:SY(p[1]).toFixed(1)}));\n      out.sensXTicks=[0,0.25,0.5,0.75,1].map(t=>({x:SX(lo+(hi-lo)*t).toFixed(0),label:(lo+(hi-lo)*t).toFixed(2)}));\n      out.sensYTicks=[0,0.25,0.5,0.75,1].map(t=>({y:SY(y0+(y1-y0)*t).toFixed(0),label:(y0+(y1-y0)*t).toFixed(y1-y0<5?3:1)}));\n      out.sensXLabel=(L.ind.find(a=>a[0]===ind)||['',''])[1];\n      out.sensYLabel=(L.dep.find(a=>a[0]===dep)||['',''])[1];\n      out.sensTitle=out.sensYLabel+' vs '+out.sensXLabel;\n      out.sensHasData=pts.length>1;\n      if(pts.length>1){\n        const a=pts[0], b=pts[pts.length-1];\n        let mono=true, dir=Math.sign(b[1]-a[1]);\n        for(let i=1;i<pts.length;i++){ const d=Math.sign(pts[i][1]-pts[i-1][1]); if(d!==0&&dir!==0&&d!==dir) mono=false; }\n        const pct=a[1]!==0? (100*(b[1]-a[1])/Math.abs(a[1])) : NaN;\n        out.sensNote='Over '+out.sensXLabel+' from '+a[0].toFixed(3)+' to '+b[0].toFixed(3)+', '+out.sensYLabel+\n          ' moves from '+a[1].toFixed(4)+' to '+b[1].toFixed(4)+\n          (isFinite(pct)?' ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)':'')+'. The response is '+\n          (mono?(dir>0?'monotonically increasing':(dir<0?'monotonically decreasing':'flat')):'non-monotonic over this range')+'.'+\n          (fails?' '+fails+' of '+n+' points were invalid or infeasible and were omitted.':'');\n      } else out.sensNote = !rangeOk\n        ? 'Sensitivity range must be numeric: enter finite values for the start and end of the sweep.'\n        : 'No valid or feasible points in this range — narrow the range or change the specification.';\n      out.sensCSV=()=>{ this.download('distillex-sensitivity.csv',\n        [out.sensXLabel+','+out.sensYLabel].concat(pts.map(p=>p[0].toFixed(6)+','+p[1].toFixed(6))).join('\\n'),'text/csv');\n        this.flash('Sensitivity data exported'); };\n    } else { out.sensPts=''; out.sensDots=[]; out.sensXTicks=[]; out.sensYTicks=[]; out.sensHasData=false;\n      out.sensNote=''; out.sensTitle=''; out.sensXLabel=''; out.sensYLabel=''; out.sensCSV=()=>{}; }\n    out.setSens=(e)=>{ const t=e.target, k=t.dataset.k;\n      const val=(k==='ind'||k==='dep')?t.value:parseFloat(t.value);\n      if(val===''||(typeof val==='number'&&isNaN(val))) return;\n      this.setState({sens:Object.assign({},this.state.sens,{[k]:val})}); };\n\n    // ---- theory ----\n    out.theoryItems=S.THEORY.map(t=>({k:t[0],title:t[1],body:t[2],open:s.theoryOpen===t[0],\n      bodyStyle:'margin:0;font-size:13.5px;line-height:1.6;max-width:82ch;display:'+(s.theoryOpen===t[0]?'block':'none'),\n      headStyle:'display:flex;gap:10px;align-items:baseline;cursor:pointer;padding:9px 0;border:0;background:transparent;width:100%;text-align:left;font-family:var(--font-heading);font-size:19px;color:'+(s.theoryOpen===t[0]?'var(--dx-ink-accent)':'var(--color-text)'),\n      no:String(S.THEORY.indexOf(t)+1).padStart(2,'0')}));\n    out.setTheory=(e)=>this.setState({theoryOpen:e.currentTarget.dataset.k});\n\n    // ---- exam ----\n    const qs=[];\n    if(hasR){\n      qs.push({q:'For the current specification, determine the minimum reflux ratio R_min.',a:r.Rmin,tol:0.02,unit:'',\n        hint:'Find where the q-line meets the equilibrium curve, then use R_min/(R_min+1) = (x_D \\u2212 y\\u2032)/(x_D \\u2212 x\\u2032).',\n        sol:'The q-line intersects the equilibrium curve at x\\u2032 = '+r.pinch.x.toFixed(4)+', y\\u2032 = '+r.pinch.y.toFixed(4)+'. The slope of the limiting rectifying line is (x_D \\u2212 y\\u2032)/(x_D \\u2212 x\\u2032) = '+((r.xD-r.pinch.y)/(r.xD-r.pinch.x)).toFixed(4)+', so R_min = m/(1\\u2212m) = '+r.Rmin.toFixed(4)+'.'});\n      qs.push({q:'How many theoretical stages (including the reboiler) does this separation require?',a:r.N,tol:0,unit:'stages',\n        hint:'Step between the equilibrium curve and the operating lines from x_D until you pass x_B.',\n        sol:'Stepping from (x_D, x_D) with R = '+r.R.toFixed(2)+' and switching operating lines at x = '+r.xInt.toFixed(4)+' takes '+r.N+' stages to reach x_B = '+r.xB.toFixed(4)+'.'});\n      qs.push({q:'On which stage should the feed enter for the optimum construction?',a:r.feedStage,tol:0,unit:'',\n        hint:'The feed stage is the one that straddles the intersection of the two operating lines.',\n        sol:'The operating lines cross at x = '+r.xInt.toFixed(4)+'; the first step whose liquid composition falls below that value is stage '+r.feedStage+'.'});\n      qs.push({q:'Calculate the distillate flowrate D from the overall and component material balances (kmol/h).',a:r.D,tol:0.01,unit:'kmol/h',\n        hint:'Combine F = D + B with F z_F = D x_D + B x_B.',\n        sol:'D = F(z_F \\u2212 x_B)/(x_D \\u2212 x_B) = '+r.F.toFixed(1)+'('+r.zF.toFixed(3)+' \\u2212 '+r.xB.toFixed(4)+')/('+r.xD.toFixed(4)+' \\u2212 '+r.xB.toFixed(4)+') = '+r.D.toFixed(3)+' kmol/h, and B = '+r.B.toFixed(3)+' kmol/h.'});\n      qs.push({q:'What percentage of the light key fed to the column is recovered in the distillate?',a:100*r.rec,tol:0.01,unit:'%',\n        hint:'Recovery = D\\u00b7x_D / (F\\u00b7z_F).',\n        sol:'D x_D = '+(r.D*r.xD).toFixed(3)+' kmol/h against F z_F = '+(r.F*r.zF).toFixed(3)+' kmol/h, giving '+(100*r.rec).toFixed(2)+' %.'});\n      qs.push({q:'Using the Fenske equation with a geometric-mean \\u03b1, what is the minimum number of theoretical stages at total reflux?',a:r.Nmin,tol:0.03,unit:'stages',\n        hint:'N_min = ln[(x_D/(1\\u2212x_D))((1\\u2212x_B)/x_B)] / ln \\u03b1_avg.',\n        sol:'\\u03b1_avg = \\u221a(\\u03b1_top\\u00b7\\u03b1_bottom) = \\u221a('+r.aTop.toFixed(3)+'\\u00d7'+r.aBot.toFixed(3)+') = '+r.aAvg.toFixed(4)+', so N_min = '+r.Nmin.toFixed(3)+'.'});\n      qs.push({q:'Is this mixture easy or difficult to separate at the current pressure? Justify with a number.',a:null,tol:0,unit:'',\n        hint:'Look at the relative volatility across the composition range, and at how far the equilibrium curve sits from the diagonal.',\n        sol:'\\u03b1 runs from '+this.alphaAt(0.05,s).toFixed(2)+' at the bottom to '+this.alphaAt(0.95,s).toFixed(2)+' at the top, mean '+r.aAvg.toFixed(2)+'. '+(r.aAvg>2.5?'That is a comfortable separation — a modest stage count and reflux suffice.':(r.aAvg>1.5?'That is a normal, workable separation requiring a conventional column.':'That is a difficult separation: \\u03b1 near 1 means many stages and high reflux, and an alternative technology may be more economic.'))+' The current design needs '+r.N+' theoretical stages at R = '+r.R.toFixed(2)+'.'});\n      qs.push({q:'Explain what happens to duties and stage count if the reflux ratio is raised by 50%.',a:null,tol:0,unit:'',\n        hint:'Higher reflux steepens the rectifying line, moving it away from the equilibrium curve.',\n        sol:(()=>{ const v=this.variant(s,{R:+s.R*1.5}); return v.ok\n          ? 'At R = '+(+s.R*1.5).toFixed(2)+' the stage requirement changes from '+r.N+' to '+v.N+', vapour traffic rises from '+r.V.toFixed(1)+' to '+v.V.toFixed(1)+' kmol/h, condenser duty from '+r.Qc.toFixed(3)+' to '+v.Qc.toFixed(3)+' MW and reboiler duty from '+r.Qr.toFixed(3)+' to '+v.Qr.toFixed(3)+' MW. Separation is easier per stage but each stage is more expensive to run — the classic capital/energy trade-off.'\n          : 'At that reflux the current specification has no feasible solution in this model.'; })()});\n    }\n    const ei=Math.min(s.exam.i,Math.max(0,qs.length-1));\n    const cur=qs[ei];\n    out.examOk=qs.length>0;\n    out.examNo=String(ei+1); out.examTotal=String(qs.length);\n    out.examQ=cur?cur.q:''; out.examUnit=cur?cur.unit:'';\n    out.examNumeric=!!(cur&&cur.a!==null);\n    out.examInput=s.exam.input;\n    out.examReveal=s.exam.reveal; out.showHint=s.exam.reveal==='hint'; out.showSol=s.exam.reveal==='sol';\n    out.examHint=cur?cur.hint:''; out.examSol=cur?cur.sol:'';\n    out.examVerdict=s.exam.verdict||''; out.examVerdictStyle='font-size:13px;padding:5px 9px;border:1px solid '+(s.exam.right?'var(--color-accent)':'var(--color-divider)')+';background:'+(s.exam.right?'color-mix(in srgb,var(--color-accent) 14%,transparent)':'transparent');\n    out.examHasVerdict=!!s.exam.verdict;\n    out.examSet=(e)=>this.setState({exam:Object.assign({},this.state.exam,{input:e.target.value})});\n    out.examCheck=()=>{ if(!cur||cur.a===null) return;\n      const g=parseFloat(s.exam.input);\n      if(isNaN(g)){ this.setState({exam:Object.assign({},s.exam,{verdict:'Enter a number first.',right:false})}); return; }\n      const tol=cur.tol===0?0.4999:Math.abs(cur.a)*cur.tol;\n      const right=Math.abs(g-cur.a)<=tol;\n      this.setState({exam:Object.assign({},s.exam,{verdict:right?'\\u2713 Correct — within tolerance of the simulator\\u2019s value.':'\\u2717 Not yet. Check your construction and try again, or reveal the hint.',right})}); };\n    out.examHintBtn=()=>this.setState({exam:Object.assign({},s.exam,{reveal:s.exam.reveal==='hint'?'':'hint'})});\n    out.examSolBtn=()=>this.setState({exam:Object.assign({},s.exam,{reveal:s.exam.reveal==='sol'?'':'sol'})});\n    out.examRetry=()=>this.setState({exam:Object.assign({},s.exam,{input:'',reveal:'',verdict:'',right:false})});\n    out.examNext=()=>this.setState({exam:{i:(ei+1)%Math.max(1,qs.length),input:'',reveal:'',verdict:'',right:false}});\n    out.examPrev=()=>this.setState({exam:{i:(ei+qs.length-1)%Math.max(1,qs.length),input:'',reveal:'',verdict:'',right:false}});\n\n    const mp = s.mode==='learning'\n      ? {title:'Learning notes',lines:[\n          'Reflux ratio R — how much condensed overhead is sent back down the column. More reflux washes heavy material out of the rising vapour, so each tray does more work; the price is more boil-up and more cooling.',\n          'Feed quality q — how much of the feed is liquid. It decides how much of the feed joins the downflow, and it tilts the q-line on the McCabe–Thiele diagram.',\n          'Purities x_D and x_B — what you demand of the two products. Demanding more of both at once always costs stages, reflux, or both.',\n          'Pressure — lowering it usually raises relative volatility and makes the split easier, but it lowers the condensing temperature and may need vacuum equipment.',\n          hasR? 'Right now: '+f(r.N,0)+' theoretical stages at R = '+f(r.R,2)+', which is '+f(r.R/r.Rmin,2)+'× the minimum reflux.' : 'Right now: the inputs do not give a feasible column — read the message at the top of the screen.']}\n      : s.mode==='advanced'\n      ? {title:'Model & numerics',lines:[\n          s.model==='raoult'? 'VLE: y_A = x_A·P_A^sat(T)/P with log₁₀P^sat[mmHg] = A − B/(T+C); the stage temperature is the bubble point of its liquid.' : 'VLE: y = αx/(1+(α−1)x) with α held constant; temperatures are still bubble points from the Antoine data.',\n          'Bubble/dew points: bisection over −80…500 °C. 70 halvings take the 580 °C bracket to ~5×10⁻¹⁹ °C, far below what a double can represent, so the root is resolved to the floating-point limit (~10⁻¹³ °C at column temperatures).',\n          'Equilibrium curve tabulated at 241 points; y*(x) and x*(y) obtained by linear interpolation on that table (error < 10⁻⁴ mole fraction).',\n          'Operating lines from constant molar overflow; q-line intersection by direct solution, or bisection when the q-line is not vertical.',\n          'Minimum reflux: q-line pinch plus a scan of 59 interior points for a tangent pinch; the larger requirement governs.',\n          s.calcMode==='rating'? 'Rating mode: shooting on x_D with 70 bisection steps; the residual is the N-th stage liquid composition minus the balance-implied x_B, and the solve is rejected unless |x_N − x_B| ≤ 10⁻⁴ mole fraction.' : 'Design mode: direct stage stepping, terminated when x ≤ x_B or when the step makes no downward progress. Not an iterative solve, so there is nothing to converge.',\n          hasR? 'The material balance is an identity here — D and B are solved from it, so its residuals are zero by construction and check nothing. The residual that carries information is '+(r.bal.rating? 'the rating shooting residual |x_N − x_B| = '+Math.abs(r.bal.stepResid).toExponential(2)+' against a 10⁻⁴ mole-fraction tolerance.' : 'the terminal overshoot x_B − x_N = '+r.bal.stepResid.toExponential(2)+' mole fraction, which is integer-stage discretisation error.') : 'No converged solution to report residuals for.']}\n      : {title:'Engineering summary',lines:[\n          hasR? 'Internal traffic: L = '+f(r.L,1)+', V = '+f(r.V,1)+', L̄ = '+f(r.Lb,1)+', V̄ = '+f(r.Vb,1)+' kmol/h.' : 'No converged solution.',\n          hasR? 'Duties: condenser '+f(r.Qc,3)+' MW, reboiler '+f(r.Qr,3)+' MW (latent heat only).' : '',\n          hasR? 'Stages: '+f(r.N,0)+' theoretical (N_min '+f(r.Nmin,2)+'), '+f(r.Nact,0)+' actual trays at '+Math.round(+s.eff*100)+'% efficiency, feed on stage '+f(r.feedStage,0)+'.' : '',\n          hasR? 'Volatility: α = '+f(r.aTop,2)+' at the top, '+f(r.aBot,2)+' at the bottom, mean '+f(r.aAvg,2)+'.' : ''].filter(Boolean)};\n    out.modeTitle=mp.title; out.modeLines=mp.lines;\n    out.isCustom=s.mixKey==='custom';\n    // The editor must still render when the stored custom record is malformed,\n    // otherwise the user cannot see or repair the values validation rejected.\n    const cu=(s.custom&&typeof s.custom==='object')?s.custom:{}, cuA=cu.a||{}, cuB=cu.b||{};\n    out.cust={aName:cuA.name,aA:cuA.A,aB:cuA.B,aC:cuA.C,aMW:cuA.MW,aTb:cuA.Tb,\n              bName:cuB.name,bA:cuB.A,bB:cuB.B,bC:cuB.C,bMW:cuB.MW,bTb:cuB.Tb};\n    out.setCust=(e)=>{const t=e.target; this.setCustom(t.dataset.side,t.dataset.f,t.value);};\n    out.isValidate=s.view==='validate';\n    // Re-solves several cases, so it is built only when the view is open.\n    out.val=out.isValidate? this.validationReport(s)\n      : {groups:[],total:0,failed:0,summary:'',summaryStyle:''};\n    out.isVLE=s.view==='vle'; out.isMT=s.view==='mt'; out.isResults=s.view==='results';\n    out.isSens=s.view==='sens'; out.isTheory=s.view==='theory'; out.isExam=s.view==='exam'; out.isAbout=s.view==='about';\n    out.setVleShow=(e)=>this.setState({vleShow:e.target.value});\n    out.vleMove=(e)=>{ const b=e.currentTarget.getBoundingClientRect();\n      let x=(((e.clientX-b.left)/b.width)*500-60)/400;\n      if(x<0||x>1){ if(this.state.vleHover!==null) this.setState({vleHover:null}); return; }\n      this.setState({vleHover:x}); };\n    out.vleLeave=()=>this.setState({vleHover:null});\n    return out;\n  }\n  wiLabel(k){ return ({R:'Reflux ratio R',zF:'Feed composition z_F',P:'Pressure kPa',q:'Feed quality q',eff:'Tray efficiency',xD:'Distillate x_D',Nspec:'Stages N'})[k]; }\n  wiNote(k,a,b){\n    const out=[]; const d=(x,y)=>y-x;\n    if(isFinite(a.N)&&isFinite(b.N)&&b.N!==a.N) out.push('Theoretical stages move from '+a.N+' to '+b.N+'.');\n    if(Math.abs(d(a.V,b.V))>1e-6) out.push('Internal vapour traffic '+(b.V>a.V?'rises':'falls')+' from '+a.V.toFixed(1)+' to '+b.V.toFixed(1)+' kmol/h, so condenser duty '+(b.Qc>a.Qc?'increases':'decreases')+' to '+b.Qc.toFixed(3)+' MW and reboiler duty to '+b.Qr.toFixed(3)+' MW.');\n    if(Math.abs(d(a.xD,b.xD))>1e-5) out.push('Distillate purity moves from '+a.xD.toFixed(4)+' to '+b.xD.toFixed(4)+'.');\n    if(Math.abs(d(a.Rmin,b.Rmin))>1e-4) out.push('The minimum reflux itself shifts to '+b.Rmin.toFixed(3)+'.');\n    if(!out.length) out.push('No calculated quantity changed appreciably.');\n    return out.join(' ');\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
