<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crude Unit — atmospheric distillation simulator</title>
<meta name="description" content="A working atmospheric crude distillation simulator: pseudocomponent feed, Rachford–Rice flash, Wang–Henke stage cascade, in one self-contained HTML file.">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Everything is scoped to the page and defined here — no framework, no
   external stylesheet, no font request. The palette is a dark instrument
   surround, because the 3D scene is lit for one and the panels have to sit
   in the same light as the plant they describe.

   Every text tone below clears WCAG 1.4.3 (4.5:1) on every surface it can
   appear over. If you restyle, keep that true.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --ink:   #e8edf9;   /* body text            17.2:1 on --l0 */
  --dim:   #8b97b2;   /* secondary             6.9:1 */
  --faint: #7987aa;   /* quietest text         4.7:1 */
  --l0:    #05070f;   /* floor                */
  --l1:    #090d18;   /* rail                 */
  --l2:    #0e1424;   /* surface              */
  --l3:    #141c31;   /* control              */
  --line:  rgba(185,198,230,.13);
  --line2: rgba(185,198,230,.22);
  --cyan:  #5ed6ff;
  --viol:  #a48bff;
  --amber: #ffc457;
  --red:   #ff6b7f;
  --green: #58e0a6;
  --r-sm: 7px; --r-md: 10px; --r-lg: 13px;
  --fast: 130ms; --base: 220ms; --slow: 360ms;
  --ease: cubic-bezier(.32,.72,.28,1);
  --spring: cubic-bezier(.34,1.42,.44,1);
  --sans: 'Inter var', 'Inter', ui-sans-serif, system-ui, -apple-system,
          'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100% }
body {
  margin: 0; background: var(--l0); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  font-feature-settings: 'tnum' 1;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px }

.app { display: flex; flex-direction: column; height: 100% }

/* ── the bar ────────────────────────────────────────────────────────── */
.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  padding: 0 16px; min-height: 52px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--l2), var(--l1));
}
.topbar h1 { margin: 0; font-size: 14px; letter-spacing: .17em; text-transform: uppercase;
          font-weight: 650; white-space: nowrap }
.topbar .sub { font-size: 10.5px; letter-spacing: .1em; color: var(--faint);
            text-transform: uppercase; white-space: nowrap }
.topbar .sp { margin-left: auto }
.tools { display: flex; align-items: center; gap: 10px; min-width: 0 }

.segs { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px;
        border: 1px solid var(--line); background: var(--l1) }
.seg { appearance: none; border: 0; background: transparent; color: var(--dim);
       font-size: 11.5px; letter-spacing: .05em; cursor: pointer;
       padding: 6px 12px; border-radius: var(--r-sm); min-height: 30px; white-space: nowrap;
       transition: color var(--fast), background var(--fast) }
.seg:hover { color: var(--ink) }
.seg.on { color: #061020; font-weight: 650;
          background: linear-gradient(180deg, var(--cyan), #38b6e8);
          box-shadow: 0 1px 10px rgba(94,214,255,.4) }
.ghost { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
         border: 1px solid var(--line); border-radius: 8px; background: transparent;
         color: var(--dim); font-size: 12px; cursor: pointer; white-space: nowrap;
         transition: color var(--fast), border-color var(--fast), background var(--fast) }
.ghost:hover { color: var(--ink); border-color: var(--line2); background: var(--l3) }

.pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 13px;
        border-radius: 999px; font-size: 11px; letter-spacing: .13em; font-weight: 650;
        border: 1px solid var(--line2); background: var(--l2); white-space: nowrap }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor;
          box-shadow: 0 0 9px currentColor; flex: 0 0 auto }
.pill.idle { color: var(--dim) }
.pill.busy { color: var(--cyan); border-color: rgba(94,214,255,.4) }
.pill.busy i { animation: blink 1s var(--ease) infinite }
.pill.ok   { color: var(--green); border-color: rgba(88,224,166,.34) }
.pill.warn { color: var(--amber); border-color: rgba(255,196,87,.38) }
.pill.err  { color: var(--red);   border-color: rgba(255,107,127,.4) }
@keyframes blink { 0%,100% { opacity:.25 } 50% { opacity:1 } }

/* ── the three columns ──────────────────────────────────────────────── */
.cols { flex: 1 1 auto; min-height: 0; display: grid;
        grid-template-columns: 314px minmax(0,1fr) 348px }
.rail { min-height: 0; overflow: auto; overscroll-behavior: contain;
        background: var(--l1); display: flex; flex-direction: column;
        scrollbar-width: thin; scrollbar-color: var(--line2) transparent }
.rail.l { border-right: 1px solid var(--line) }
.rail.r { border-left: 1px solid var(--line) }
.rail::-webkit-scrollbar { width: 9px }
.rail::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 9px;
                                 border: 3px solid transparent; background-clip: content-box }

/* ── the stage ──────────────────────────────────────────────────────── */
.stage { position: relative; min-width: 0; min-height: 0; display: grid;
         background: radial-gradient(120% 90% at 50% 0%, #0b1426, #04060d 70%) }
.stage.v-split { grid-template-rows: 1fr 1fr }
@media (min-width: 1800px) { .stage.v-split { grid-template-rows: none; grid-template-columns: 1fr 1fr } }
.vp { position: relative; min-width: 0; min-height: 0; overflow: hidden }
.vp[hidden] { display: none }
.vp + .vp { border-top: 1px solid var(--line) }
@media (min-width: 1800px) { .stage.v-split .vp + .vp { border-top: 0; border-left: 1px solid var(--line) } }
#gl { display: block; width: 100%; height: 100%; touch-action: none; outline: none }
.ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.ov > * { pointer-events: auto }

.tag { position: absolute; top: 0; left: 0; will-change: transform; opacity: 0;
       transform: translate3d(-999px,-999px,0); transition: opacity 180ms linear;
       display: flex; align-items: center; gap: 6px; padding: 3px 8px;
       font-size: 10px; letter-spacing: .06em; border-radius: 6px;
       background: rgba(5,9,18,.78); border: 1px solid var(--line2); color: var(--ink);
       backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
       white-space: nowrap; pointer-events: none }
.tag b { font-weight: 650; color: var(--cyan); letter-spacing: .1em; font-size: 9px }
.tag u { text-decoration: none; color: var(--faint); font-size: 9px }

#hover { position: absolute; top: 0; left: 0; will-change: transform; pointer-events: none;
         padding: 4px 10px; font-size: 11.5px; border-radius: var(--r-sm); white-space: nowrap;
         background: rgba(5,9,18,.86); border: 1px solid var(--line2);
         box-shadow: 0 8px 22px rgba(0,0,0,.5) }

#cams { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; gap: 5px;
        padding: 0 14px 2px; overflow-x: auto; scrollbar-width: none }
#cams::-webkit-scrollbar { display: none }
.cam { flex: 0 0 auto; appearance: none; border: 1px solid var(--line); border-radius: 999px;
       background: rgba(5,9,18,.72); color: var(--dim);
       font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
       padding: 6px 11px; min-height: 28px; cursor: pointer;
       backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
       transition: color var(--fast), border-color var(--fast), background var(--fast) }
.cam:hover { color: var(--ink); border-color: var(--line2) }
.cam.on { color: #061020; background: var(--cyan); border-color: transparent; font-weight: 650 }

.hud { position: absolute; right: 14px; bottom: 46px; display: flex; flex-direction: column;
       align-items: flex-end; gap: 8px; max-width: 34%; text-align: right;
       font-size: 10px; letter-spacing: .1em; color: var(--faint); text-transform: uppercase }
.hud .r { display: flex; gap: 10px; align-items: center }
.hud button { appearance: none; border: 1px solid var(--line); border-radius: var(--r-sm);
              background: rgba(5,9,18,.72); color: var(--dim); font-size: 10px;
              letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px;
              min-height: 28px; cursor: pointer }
.hud button:hover { color: var(--ink) }

#info { position: absolute; left: 14px; top: 14px; width: min(330px, calc(100% - 28px));
        max-height: calc(100% - 28px); overflow: auto; overscroll-behavior: contain;
        border-radius: var(--r-lg); border: 1px solid var(--line2);
        background: linear-gradient(180deg, rgba(12,20,36,.92), rgba(7,11,22,.94));
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 20px 50px rgba(0,0,0,.55);
        padding: 14px 15px 13px; display: flex; flex-direction: column; gap: 9px;
        animation: card 260ms var(--spring) both }
#info[hidden] { display: none }
@keyframes card { from { opacity:0; transform:translateY(-8px) scale(.98) } to { opacity:1; transform:none } }
#info .cat { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan) }
#info h3 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .01em }
#info dl { margin: 0; display: grid; gap: 8px }
#info dt { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint) }
#info dd { margin: 2px 0 0; font-size: 12.5px; line-height: 1.55; color: rgba(232,237,249,.88) }
#info .reads { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--line); padding-top: 9px }
#info .reads span { font-size: 11px; padding: 3px 8px; border-radius: 6px;
                    background: var(--l3); border: 1px solid var(--line) }
#info .reads b { color: var(--cyan); font-weight: 650 }
#info .x { position: absolute; right: 9px; top: 9px; width: 26px; height: 26px; border-radius: var(--r-sm);
           appearance: none; border: 1px solid var(--line); background: transparent;
           color: var(--dim); cursor: pointer; font-size: 14px; line-height: 1 }
#info .x:hover { color: var(--ink); border-color: var(--line2) }

#tour { position: absolute; left: 50%; transform: translateX(-50%); bottom: 58px;
        width: min(560px, calc(100% - 32px)); border-radius: var(--r-lg);
        border: 1px solid rgba(164,139,255,.4);
        background: linear-gradient(180deg, rgba(20,15,44,.92), rgba(9,7,19,.94));
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 18px 46px rgba(0,0,0,.5);
        padding: 13px 15px; display: flex; gap: 13px; align-items: flex-start;
        animation: card 300ms var(--spring) both }
#tour[hidden] { display: none }
#tour .n { font-size: 10px; letter-spacing: .14em; color: var(--viol); white-space: nowrap; padding-top: 2px }
#tour h4 { margin: 0 0 3px; font-size: 14px; font-weight: 650 }
#tour p { margin: 0; font-size: 12.5px; line-height: 1.55; color: rgba(232,237,249,.82) }

#glfail { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px;
          text-align: center; font-size: 13px; color: var(--dim); line-height: 1.6 }
#glfail[hidden] { display: none }

/* ── the operator panel ─────────────────────────────────────────────── */
.sec { border-bottom: 1px solid var(--line) }
.sec > button { width: 100%; appearance: none; border: 0; background: transparent; cursor: pointer;
                display: flex; align-items: center; gap: 10px; padding: 13px 15px; text-align: left;
                color: var(--ink); min-height: 46px; transition: background var(--fast) }
.sec > button:hover { background: var(--l2) }
.sec .t { font-size: 11.5px; letter-spacing: .13em; text-transform: uppercase; font-weight: 650 }
.sec .c { margin-left: auto; color: var(--faint); font-size: 15px; line-height: 1; width: 14px; text-align: center }
.sec .secbody { padding: 0 15px 15px; display: flex; flex-direction: column; gap: 13px }
.hint { font-size: 11px; line-height: 1.5; color: var(--faint); margin: -4px 0 0 }
.hd { font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase;
      color: var(--faint); font-weight: 650 }

.fld { display: flex; flex-direction: column; gap: 6px }
.fld .top { display: flex; align-items: baseline; gap: 8px }
.fld label { font-size: 11.5px; color: var(--dim); line-height: 1.35 }
.fld .v { margin-left: auto; font-size: 13px; font-weight: 650; white-space: nowrap }
.fld .u { font-size: 10px; color: var(--faint); white-space: nowrap }
.fld .help { font-size: 10.5px; line-height: 1.45; color: var(--faint) }
.fld input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
                         background: transparent; cursor: pointer; margin: 0 }
.fld input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, var(--cyan) var(--p,0%), var(--line2) var(--p,0%)) }
.fld input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line2) }
.fld input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--cyan) }
.fld input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; margin-top: -5.5px; background: #eaf6ff; border: 2px solid #0a1120;
  box-shadow: 0 0 0 1px var(--cyan), 0 0 12px rgba(94,214,255,.55);
  transition: transform var(--fast) }
.fld input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%;
  background: #eaf6ff; border: 2px solid #0a1120; box-shadow: 0 0 0 1px var(--cyan) }
.fld input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.18) }

.assays { display: flex; flex-direction: column; gap: 6px }
.assay { appearance: none; text-align: left; cursor: pointer; display: flex; align-items: center;
         gap: 10px; padding: 10px 12px; min-height: 44px; border-radius: 9px;
         border: 1px solid var(--line); background: var(--l2); color: var(--ink);
         transition: border-color var(--fast), background var(--fast) }
.assay:hover { border-color: var(--line2); background: var(--l3) }
.assay.on { border-color: var(--cyan); background: rgba(94,214,255,.11) }
.assay .nm { font-size: 12.5px; font-weight: 600 }
.assay .api { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap }
.assay.on .api { color: var(--cyan) }

.runblock { position: sticky; bottom: 0; margin-top: auto; padding: 13px 15px 15px;
            border-top: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(9,13,24,.6), var(--l1) 34%);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; flex-direction: column; gap: 9px }
.go { appearance: none; border: 0; cursor: pointer; width: 100%; min-height: 46px;
      border-radius: var(--r-md); font-size: 13.5px; font-weight: 650; letter-spacing: .09em;
      text-transform: uppercase; color: #04121e;
      background: linear-gradient(180deg, #7fe1ff, #2aa9dd);
      box-shadow: 0 8px 26px rgba(94,214,255,.3);
      transition: transform var(--fast), box-shadow var(--fast), filter var(--fast),
                  background var(--base) }
/* the panel has moved since the result on screen was solved */
.go.dirty { background: linear-gradient(180deg, var(--amber), #e39a22);
            box-shadow: 0 8px 26px rgba(255,196,87,.3) }
.go:hover { transform: translateY(-1px); filter: brightness(1.06);
            box-shadow: 0 12px 32px rgba(94,214,255,.4) }
.go:active { transform: translateY(0) }
.mini { display: flex; gap: 7px }
.mini button { flex: 1; appearance: none; cursor: pointer; min-height: 34px; border-radius: 8px;
               border: 1px solid var(--line); background: transparent; color: var(--dim);
               font-size: 11px; letter-spacing: .06em;
               transition: color var(--fast), border-color var(--fast), background var(--fast) }
.mini button:hover { color: var(--ink); border-color: var(--line2); background: var(--l2) }

/* ── the results rail ───────────────────────────────────────────────── */
.blk { padding: 14px 15px; border-bottom: 1px solid var(--line);
       display: flex; flex-direction: column; gap: 11px }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px }
.fig { padding: 10px 11px; border-radius: 9px; background: var(--l2);
       border: 1px solid var(--line); border-top-width: 2px;
       display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.fig .k { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); line-height: 1.3 }
.fig .n { font-size: 21px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums }
.fig .u { font-size: 9.5px; color: var(--faint) }

.row { display: flex; align-items: baseline; gap: 10px; font-size: 12px;
       padding: 5px 0; border-bottom: 1px dashed var(--line) }
.row:last-child { border-bottom: 0 }
.row .k { color: var(--dim); min-width: 0 }
.row .v { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap }
.row .p { color: var(--faint); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums }
.sw { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto }

.note { font-size: 11.5px; line-height: 1.55; color: var(--faint) }
.msg { display: flex; gap: 9px; font-size: 11.5px; line-height: 1.55;
       padding: 10px 11px; border-radius: 9px; border: 1px solid; background: var(--l2) }
.msg b { flex: 0 0 auto; font-size: 13px; line-height: 1.3 }
.msg.ok   { border-color: rgba(88,224,166,.3);  color: #a9eed0 }
.msg.warn { border-color: rgba(255,196,87,.34); color: #ffe0a6 }
.msg.err  { border-color: rgba(255,107,127,.38); color: #ffb3be }

.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline;
        width: 100%; text-align: left; cursor: pointer; appearance: none; border: 0;
        border-radius: 8px; padding: 8px 9px; background: transparent; color: var(--ink);
        font-size: 11.5px; transition: background var(--fast) }
.hrow:hover { background: var(--l2) }
.hrow.now { background: var(--l2); box-shadow: inset 2px 0 0 var(--cyan) }
.hrow .at { font-variant-numeric: tabular-nums; color: var(--faint) }
.hrow .y { font-weight: 650; font-variant-numeric: tabular-nums }
.hrow .m { grid-column: 1 / -1; color: var(--faint); font-size: 10.5px }

.stgs { display: flex; flex-direction: column; gap: 1px; max-height: 246px; overflow: auto }
.stg { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 9px; align-items: baseline;
       padding: 5px 7px; font-size: 11px; border-radius: 5px; font-variant-numeric: tabular-nums;
       width: 100%; text-align: left; appearance: none; border: 0; background: transparent;
       color: var(--ink); cursor: pointer; min-height: 28px; transition: background var(--fast) }
.stg:hover { background: var(--l2) }
.stg.on { background: var(--l3); box-shadow: inset 2px 0 0 var(--cyan) }
.stg:has(.x) { grid-template-columns: 12px 1fr auto auto auto auto }
.stg i { width: 7px; height: 7px; border-radius: 50%; align-self: center }
.stg .l { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.stg .t { font-weight: 650 }
.stg .p { color: var(--faint); font-size: 10px }
.stg .x { font-variant-numeric: tabular-nums; color: var(--dim) }
.stg.k-draw .l { color: var(--amber) }
.stg.k-cond .l, .stg.k-sump .l { color: var(--cyan) }

.det { border-top: 1px solid var(--line) }
.det summary { cursor: pointer; padding: 12px 15px; font-size: 10.5px; letter-spacing: .15em;
               text-transform: uppercase; color: var(--faint); list-style: none; min-height: 42px;
               display: flex; align-items: center; gap: 8px }
.det summary::-webkit-details-marker { display: none }
.det summary::after { content: '+'; margin-left: auto; font-size: 14px }
.det[open] summary::after { content: '\2212' }
.det summary:hover { color: var(--ink) }
.det .dbody { padding: 0 15px 15px }
.det ul { margin: 0; padding-left: 16px }
.det li { font-size: 11.5px; line-height: 1.55; color: var(--faint); margin-bottom: 7px }

/* ── product strip ──────────────────────────────────────────────────── */
.products { flex: 0 0 auto; display: grid; gap: 1px; background: var(--line);
            grid-template-columns: repeat(6, minmax(0,1fr)); border-top: 1px solid var(--line) }
.prod { appearance: none; border: 0; cursor: pointer; text-align: left; background: var(--l1);
        color: var(--ink); padding: 11px 13px 12px; min-width: 0; display: flex;
        flex-direction: column; gap: 3px; position: relative; transition: background var(--fast) }
.prod::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
                background: var(--pc, var(--faint)); opacity: .8 }
.prod:hover { background: var(--l2) }
.prod.on { background: var(--l3) }
.prod.on::before { opacity: 1; box-shadow: 0 0 14px var(--pc) }
.prod .nm { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.prod .n { font-size: 20px; font-weight: 700; line-height: 1.1;
           font-variant-numeric: tabular-nums; color: var(--pc) }
.prod .d { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums }
.prod .meter { display: block; height: 3px; border-radius: 3px; background: var(--line2);
               overflow: hidden; margin-top: 3px }
.prod .meter i { display: block; height: 100%; background: var(--pc);
                 transition: width var(--slow) var(--ease) }

/* ── the flow sheet ─────────────────────────────────────────────────── */
.d2 { position: relative; width: 100%; height: 100%; display: grid; place-items: center;
      background: radial-gradient(100% 90% at 50% 0%, #0a1120, #05070f 72%); overflow: hidden }
.d2 svg { width: 100%; height: 100%; max-height: 100% }
.d2-blk { fill: #101a2e; stroke: var(--line2); stroke-width: 1.2; cursor: pointer;
          transition: fill var(--base) var(--ease), stroke var(--base) }
.d2-blk:hover { fill: #16233c; stroke: var(--cyan) }
.d2-blk.on { fill: #172942; stroke: var(--cyan);
             filter: drop-shadow(0 0 7px rgba(94,214,255,.5)) }
/* an SVG presentation attribute loses to a CSS rule, so the shell outline
   needs a rule of its own rather than fill="none" */
.d2-shell { fill: none !important; stroke: var(--line2); stroke-width: 1.4; cursor: pointer }
.d2-shell:hover { stroke: var(--cyan) }
.d2-shell.on { stroke: var(--cyan); stroke-width: 1.8;
               filter: drop-shadow(0 0 8px rgba(94,214,255,.55)) }
.d2-lbl { fill: #a7b6d2; font-size: 8.5px; letter-spacing: .13em; pointer-events: none }
.d2-sub { fill: var(--cyan); font-size: 9.5px; font-weight: 650;
          font-variant-numeric: tabular-nums; pointer-events: none }
.d2-tag { letter-spacing: .15em; pointer-events: none }
.d2-tray { stroke: #6d80a6; stroke-width: 1 }
.d2-pipe { fill: none; stroke-linecap: round; stroke-linejoin: round; cursor: pointer }
.d2-halo { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .16;
           filter: blur(3px); pointer-events: none }
.d2-trace { fill: none; stroke-linecap: round; stroke: #f2f8ff; opacity: .8;
            stroke-dasharray: 3 26; pointer-events: none }
.d2-out { cursor: pointer }
.d2-out .nm { font-size: 9px; letter-spacing: .1em; text-transform: uppercase }
.d2-out .r { fill: #dde6f5; font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 700 }
.d2-out .sm { fill: var(--faint); font-size: 9px; font-variant-numeric: tabular-nums }
.d2-out:hover .r { fill: #fff }
.d2-tick { stroke-width: 1.4; opacity: .8 }
.d2-tin { fill: #f0f5ff; font-size: 10px; font-weight: 650; font-variant-numeric: tabular-nums;
          pointer-events: none; paint-order: stroke; stroke: rgba(5,9,18,.85); stroke-width: 3px;
          stroke-linejoin: round }
@keyframes d2Flow { from { stroke-dashoffset: 58 } to { stroke-dashoffset: 0 } }

/* ── charts ─────────────────────────────────────────────────────────── */
.chart { width: 100%; height: auto; display: block; overflow: visible }
.chart .ax { stroke: var(--line2); stroke-width: 1 }
.chart .lbl { fill: var(--faint); font-size: 8.5px }
.chart .ln { fill: none; stroke: var(--cyan); stroke-width: 1.6; stroke-linejoin: round }
.chart .tr { fill: none; stroke: var(--viol); stroke-width: 1.4 }

/* ── signature and toast ────────────────────────────────────────────── */
.sig { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
       padding: 7px 0 8px; border-top: 1px solid var(--line); line-height: 1.2 }
.sig::before, .sig::after { content: ''; width: 30px; height: 1px; flex: 0 0 auto;
                            background: var(--line) }
.sig::before { margin-right: 13px } .sig::after { margin-left: 13px }
.sig b { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400;
         font-size: 11.5px; letter-spacing: .055em; color: var(--faint) }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
         padding: 10px 18px; border-radius: var(--r-md); font-size: 12.5px;
         background: var(--l3); border: 1px solid var(--line2); z-index: 20;
         box-shadow: 0 14px 34px rgba(0,0,0,.5) }
#toast[hidden] { display: none }

/* ── responsive ─────────────────────────────────────────────────────── */
@media (max-width: 1240px) {
  .cols { grid-template-columns: 280px minmax(0,1fr) 300px }
  .products { grid-template-columns: repeat(3, minmax(0,1fr)) }
}
@media (max-width: 1000px) {
  body { overflow: auto }
  .app { height: auto; min-height: 100% }
  .cols { display: flex; flex-direction: column; overflow: visible }
  .stage { order: -1; flex: 0 0 46vh; min-height: 280px }
  .rail.l, .rail.r { border: 0; border-top: 1px solid var(--line); overflow: visible }
  .runblock { position: static }
  .products { grid-template-columns: repeat(2, minmax(0,1fr)) }
  #info { width: min(280px, calc(100% - 24px)) }
}
@media (max-width: 860px) {
  .topbar { flex-wrap: wrap; padding: 8px 11px; gap: 8px 10px }
  .topbar .sub { display: none }
  .tools { order: 9; flex: 1 0 100%; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none }
  .tools::-webkit-scrollbar { display: none }
  .tools > * { flex: 0 0 auto }
  .seg { padding: 6px 10px; font-size: 11px }
  .ghost { height: 30px; padding: 0 10px; font-size: 11px }
}
@media (max-width: 620px) {
  #cams { bottom: 8px; padding: 0 10px 2px }
  .cam { padding: 5px 9px; font-size: 10px; min-height: 26px }
  .hud { bottom: 42px; right: 10px; max-width: 130px; font-size: 9px }
  .hud #degrade { display: none }
  #tour { bottom: 46px; padding: 11px 12px; gap: 10px }
  .tag { font-size: 9px; padding: 2px 6px }
  #info { left: 10px; top: 10px; padding: 12px 13px 11px }
}
@media (prefers-reduced-motion: reduce) {
  #info, #tour { animation: none }
  .d2-trace { animation: none !important }
  .pill.busy i { animation: none }
  * { transition-duration: 1ms !important }
}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1>Crude Unit</h1>
    <span class="sub">Atmospheric distillation &middot; digital twin</span>
    <span class="sp"></span>
    <span class="pill idle" id="pill" role="status" aria-live="polite"><i></i>READY</span>
    <div class="tools" id="tools"></div>
  </div>

  <div class="cols">

    <!-- operator control rail -->
    <div class="rail l">
      <div id="panel"></div>
      <div class="runblock">
        <button class="go" id="run">Run simulation</button>
        <div class="mini">
          <button id="reset">Reset</button>
          <button id="save">Save case</button>
          <button id="loadbtn">Load case</button>
        </div>
        <input type="file" id="loadfile" accept="application/json" style="display:none">
      </div>
    </div>

    <!-- the stage: the scene and the flow sheet, two renderings of one state -->
    <div class="stage v-3d" id="stage">
      <div class="vp" id="vp3d">
        <canvas id="gl" tabindex="0" role="img"
                aria-label="Three-dimensional model of an atmospheric crude distillation unit. The results panel lists every stage and product as text."></canvas>
        <div class="ov">
          <div id="tags"></div>
          <div id="hover" hidden></div>
          <div id="info" hidden></div>
          <div id="tour" hidden></div>
          <div id="cams"></div>
          <div class="hud">
            <span id="degrade" hidden></span>
            <div class="r">
              <button id="flowbtn">Pause flow</button>
              <span id="fps">&mdash;</span>
            </div>
          </div>
        </div>
        <div id="glfail" hidden></div>
      </div>
      <div class="vp" id="vp2d" hidden>
        <div class="d2" id="d2"></div>
      </div>
    </div>

    <!-- results rail -->
    <div class="rail r" id="results"></div>
  </div>

  <div class="products" id="products"></div>
  <div class="sig"><b>Shafin Ahamed Neon</b></div>
</div>
<div id="toast" hidden></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   The simulator, in six layers. Nothing below computes a process quantity
   except engine.js — everything else reads what it produced.

     glmath     vectors, matrices, the camera spring
     geometry   parametric meshes, built in unit frames
     plant      the unit itself: geometry, streams, instruments
     renderer   the WebGL scene: instancing, id-buffer picking, tracers
     engine     the simulation
     info       what each component is; camera presets; the guided tour
     view2d     the process flow sheet, from the same result
     ui         the interface
   ══════════════════════════════════════════════════════════════════════ */

// @include rig/renderer.js

APP.boot();
</script>
</body>
</html>
