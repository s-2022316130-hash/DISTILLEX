t }}%<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.2\" max=\"1\" step=\"0.01\" value=\"{{ v.eff }}\" data-k=\"eff\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Overall tray efficiency\">\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:10px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div class=\"dx-head\" style=\"padding:0\">\n              <div class=\"dx-head-l\">\n                <div class=\"dx-kicker\">Fractionating column<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                  <span class=\"dx-num\" style=\"font-size:13px\">{{ scene.caption }}<\u002Fspan>\n                  <span class=\"dx-dot live\" aria-hidden=\"true\"><\u002Fspan>\n                  <span class=\"dx-num\" style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ scene.thermLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                <div class=\"dx-vp-btns dx-noprint\" role=\"group\" aria-label=\"Column viewpoint\" sc-camel-on-click=\"{{ setVP }}\">\n                  <sc-for list=\"{{ vpBtns }}\" as=\"b\" hint-placeholder-count=\"5\">\n                    <button class=\"btn\" data-vp=\"{{ b.k }}\" data-on=\"{{ b.on }}\" aria-pressed=\"{{ b.cur }}\">{{ b.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button class=\"btn btn-secondary dx-noprint\" sc-camel-on-click=\"{{ explainToggle }}\" style=\"min-height:30px\">{{ explainLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"dx-stage\" style=\"height:462px\" role=\"img\" aria-label=\"Three-dimensional schematic of the distillation column. {{ scene.caption }}. {{ scene.thermLabel }}.\">\n              <i class=\"dx-stage-grid\" aria-hidden=\"true\"><\u002Fi>\n              <sc-if value=\"{{ scene.empty }}\">\n                <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px\">\n                  <span class=\"dx-dot warn\" aria-hidden=\"true\"><\u002Fspan>\n                  <div style=\"font-size:13.5px;font-weight:600\">{{ scene.emptyMsg }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 70%,transparent);max-width:34ch;line-height:1.5\">{{ scene.emptyHint }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div class=\"{{ vpCls }}\" style=\"position:absolute;inset:0;display:grid;place-items:center\">\n                <div class=\"dx-col\" style=\"width:{{ scene.W }}px;height:{{ scene.H }}px\">\n                  <div class=\"dx-col-mid\" style=\"height:{{ scene.H }}px\">\n                    <sc-for list=\"{{ scene.slats }}\" as=\"sl\" hint-placeholder-count=\"16\">\n                      <i class=\"dx-slat\" style=\"{{ sl.style }}\"><\u002Fi>\n                    <\u002Fsc-for>\n                    <i class=\"dx-therm\" style=\"{{ scene.thermStyle }}\"><\u002Fi>\n                    <sc-for list=\"{{ scene.caps }}\" as=\"cp\" hint-placeholder-count=\"2\">\n                      <i class=\"dx-cap\" style=\"{{ cp.style }}\"><\u002Fi>\n                    <\u002Fsc-for>\n                    <sc-for list=\"{{ scene.trays }}\" as=\"tr2\" hint-placeholder-count=\"12\">\n                      <i class=\"{{ tr2.cls }}\" style=\"{{ tr2.style }}\"><\u002Fi>\n                    <\u002Fsc-for>\n                    <div class=\"dx-layer-flow\" style=\"position:absolute;inset:0;transform-style:preserve-3d\">\n                      <sc-for list=\"{{ scene.parts }}\" as=\"p\" hint-placeholder-count=\"18\">\n                        <span class=\"{{ p.cls }}\" style=\"{{ p.style }}\"><i style=\"{{ p.dot }}\"><\u002Fi><\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div class=\"dx-layer-notes\" style=\"position:absolute;inset:0;transform-style:preserve-3d\">\n                      <sc-for list=\"{{ scene.notes }}\" as=\"nt\" hint-placeholder-count=\"5\">\n                        <span class=\"{{ nt.cls }}\" style=\"{{ nt.style }}\">{{ nt.k }}<b>{{ nt.v }}<\u002Fb><\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:11px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Stage positions, feed stage and the end temperatures are read from the solved case. The rising and falling traffic depicts counter-current flow and scales with the internal vapour and liquid rates — it is a visual aid, not a hydraulic calculation.<\u002Fp>\n            <sc-if value=\"{{ hover }}\">\n              <div class=\"blueprint\" style=\"padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px;font-size:12px;font-variant-numeric:tabular-nums;background:var(--color-surface)\">\n                <sc-for list=\"{{ hoverRows }}\" as=\"h\" hint-placeholder-count=\"6\">\n                  <div><div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ h.k }}<\u002Fdiv><div>{{ h.v }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ explaining }}\">\n              <div class=\"blueprint\" style=\"padding:12px;background:var(--color-surface);display:flex;flex-direction:column;gap:8px\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span class=\"tag tag-accent\">Step {{ explainNo }} / 10<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading);font-size:17px\">{{ explainTitle }}<\u002Fspan>\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ explainPrev }}\" style=\"margin-left:auto;min-height:28px\">Back<\u002Fbutton>\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ explainNext }}\" style=\"min-height:28px\">Next<\u002Fbutton>\n                <\u002Fdiv>\n                <p style=\"margin:0;font-size:13.5px;line-height:1.55\">{{ explainText }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:10px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Live results<\u002Fh6>\n            <sc-for list=\"{{ liveRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n              <div style=\"{{ row.style }}\">\n                <span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 70%,transparent)\">{{ row.k }}<\u002Fspan>\n                <span style=\"font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section class=\"card blueprint\" style=\"padding:14px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Material balance &amp; convergence<\u002Fh6>\n            <div style=\"font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.identityHead }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;font-variant-numeric:tabular-nums;line-height:1.7;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">\n              <div>F = D + B → {{ mb.total }}<\u002Fdiv>\n              <div>F·z<sub>F<\u002Fsub> = D·x<sub>D<\u002Fsub> + B·x<sub>B<\u002Fsub> → {{ mb.comp }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.identityNote }}<\u002Fdiv>\n            <div style=\"font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--color-divider);padding-top:8px;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.convHead }}<\u002Fdiv>\n            <div style=\"{{ mb.convStyle }}\">{{ mb.convStatus }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;font-variant-numeric:tabular-nums;line-height:1.7;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.residLabel }}: {{ mb.residValue }}<\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.residNote }}<\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"card blueprint dx-noprint\" style=\"padding:14px;gap:10px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">What happens if?<\u002Fh6>\n            <div style=\"display:flex;gap:6px\">\n              <sc-raw-select class=\"input\" value=\"{{ v.wiVar }}\" data-k=\"wiVar\" sc-camel-on-change=\"{{ setStr }}\" style=\"flex:1\" aria-label=\"Variable to change\">\n                <sc-for list=\"{{ wiOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n                  <option value=\"{{ o.k }}\">{{ o.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <input class=\"input\" type=\"number\" step=\"{{ wiStep }}\" value=\"{{ v.wiTo }}\" data-k=\"wiTo\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:88px\" aria-label=\"New value\">\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ runWhatIf }}\" style=\"flex:1\">Compare<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ applyWhatIf }}\">Apply<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasWhatIf }}\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 72%,transparent);border-bottom:1px solid var(--color-divider);padding-bottom:4px\">\n                  <span>Quantity<\u002Fspan><span>Before<\u002Fspan><span>After<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ whatIfRows }}\" as=\"w\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums;align-items:baseline\">\n                    <span style=\"color:color-mix(in srgb,var(--color-text) 70%,transparent)\">{{ w.k }}<\u002Fspan>\n                    <span>{{ w.a }}<\u002Fspan>\n                    <span style=\"{{ w.style }}\">{{ w.b }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <p style=\"margin:6px 0 0;font-size:12px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ whatIfNote }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section class=\"card blueprint\" style=\"padding:14px;gap:10px;margin-top:14px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n          <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Stage profiles<\u002Fh6>\n          <span style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Stage 1 = top tray · stage {{ r.N }} = reboiler<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"dx-grid2\" style=\"gap:14px\">\n          <sc-for list=\"{{ profiles }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <figure class=\"blueprint\" style=\"padding:10px 8px 6px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <svg sc-camel-view-box=\"0 0 360 190\" style=\"width:100%;height:auto\" role=\"img\" aria-label=\"{{ p.title }}\">\n                <text x=\"8\" y=\"14\" font-size=\"11\" font-family=\"var(--font-heading)\" letter-spacing=\".08em\" fill=\"var(--color-text)\">{{ p.title }}<\u002Ftext>\n                <g stroke=\"var(--color-divider)\" stroke-width=\"1\" fill=\"none\"><path d=\"M46 24 V162 H352\"><\u002Fpath><\u002Fg>\n                <g stroke=\"color-mix(in srgb,var(--color-text) 8%,transparent)\" stroke-width=\"1\"><path d=\"{{ p.grid }}\"><\u002Fpath><\u002Fg>\n                <sc-for list=\"{{ p.series }}\" as=\"s\" hint-placeholder-count=\"1\">\n                  <polyline points=\"{{ s.pts }}\" fill=\"none\" stroke=\"{{ s.color }}\" stroke-width=\"1.6\" stroke-dasharray=\"{{ s.dash }}\"><\u002Fpolyline>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ p.ticks }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <text x=\"{{ t.x }}\" y=\"{{ t.y }}\" text-anchor=\"{{ t.anchor }}\" font-size=\"9\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext>\n                <\u002Fsc-for>\n                <text x=\"200\" y=\"184\" text-anchor=\"middle\" font-size=\"9\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">Stage number (top → bottom)<\u002Ftext>\n                <sc-for list=\"{{ p.legend }}\" as=\"g\" hint-placeholder-count=\"1\">\n                  <g><rect x=\"{{ g.x }}\" y=\"20\" width=\"14\" height=\"2\" fill=\"{{ g.color }}\"><\u002Frect><text x=\"{{ g.tx }}\" y=\"25\" font-size=\"9\" fill=\"color-mix(in srgb,var(--color-text) 65%,transparent)\">{{ g.label }}<\u002Ftext><\u002Fg>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n            <\u002Ffigure>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isColumn }}\">\n      <div class=\"dx-side\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:12px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Column configuration<\u002Fh6>\n            <div class=\"field\">\n              <label>Internals<\u002Flabel>\n              <div class=\"input\" style=\"display:flex;align-items:center;background:transparent;color:color-mix(in srgb,var(--color-text) 78%,transparent)\">Trays — stagewise model<\u002Fdiv>\n              <details class=\"dx-dis\"><summary>Why there is no choice here<\u002Fsummary><div class=\"dx-dis-b\">The stage calculation is internals-agnostic and the tray column is the only case this model completes. Packed columns are not modelled — no HETP, packed height or transfer-unit (HTU/NTU) calculation is performed — so no selector is offered rather than one that changes nothing.<\u002Fdiv><\u002Fdetails>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Condenser<\u002Flabel>\n              <div class=\"input\" style=\"display:flex;align-items:center;background:transparent;color:color-mix(in srgb,var(--color-text) 78%,transparent)\">Total condenser — y₁ = x_D<\u002Fdiv>\n              <details class=\"dx-dis\"><summary>Why there is no choice here<\u002Fsummary><div class=\"dx-dis-b\">Only the total condenser is implemented. A partial condenser would add one equilibrium stage, and that is not modelled — so no selector is offered rather than one that changes nothing.<\u002Fdiv><\u002Fdetails>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label for=\"dx-reb\">Reboiler<\u002Flabel>\n              <sc-raw-select class=\"input\" id=\"dx-reb\" value=\"{{ v.reb }}\" data-k=\"reb\" sc-camel-on-change=\"{{ setStr }}\">\n                <option value=\"partial\">Partial (kettle) — counts as one equilibrium stage<\u002Foption>\n                <option value=\"total\">Total (thermosiphon, no equilibrium stage)<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Overall efficiency<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ r.effPct }}%<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.2\" max=\"1\" step=\"0.01\" value=\"{{ v.eff }}\" data-k=\"eff\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Overall tray efficiency\">\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12.5px;border-top:1px solid var(--color-divider);padding-top:8px\"><span style=\"color:color-mix(in srgb,var(--color-text) 70%,transparent)\">Theoretical stages<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ r.N }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12.5px\"><span style=\"color:color-mix(in srgb,var(--color-text) 70%,transparent)\">{{ r.actualLabel }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ r.Nact }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12.5px\"><span style=\"color:color-mix(in srgb,var(--color-text) 70%,transparent)\">Feed stage<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ r.feedStage }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsection>\n          <section class=\"card blueprint dx-noprint\" style=\"padding:14px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">View<\u002Fh6>\n            <div class=\"seg\" style=\"width:100%\">\n              <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxview\" value=\"stages\" checked=\"{{ isStageView }}\" data-k=\"colView\" sc-camel-on-change=\"{{ setStr }}\"><span>Stage table<\u002Fspan><\u002Flabel>\n              <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxview\" value=\"industrial\" checked=\"{{ isIndView }}\" data-k=\"colView\" sc-camel-on-change=\"{{ setStr }}\"><span>Industrial<\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-if value=\"{{ isStageView }}\">\n            <section class=\"card blueprint\" style=\"padding:14px;gap:8px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Stage-by-stage results<\u002Fh6>\n              <div style=\"overflow:auto;max-height:620px\">\n                <sc-raw-table class=\"table\">\n                  <sc-raw-thead><sc-raw-tr><sc-raw-th>Stage<\u002Fsc-raw-th><sc-raw-th>Section<\u002Fsc-raw-th><sc-raw-th>x (liquid)<\u002Fsc-raw-th><sc-raw-th>y (vapour)<\u002Fsc-raw-th><sc-raw-th>T °C<\u002Fsc-raw-th><sc-raw-th>α local<\u002Fsc-raw-th><sc-raw-th>L kmol/h<\u002Fsc-raw-th><sc-raw-th>V kmol/h<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ stageRows }}\" as=\"s\" hint-placeholder-count=\"8\">\n                      <sc-raw-tr style=\"{{ s.style }}\"><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.n }}<\u002Fsc-raw-td><sc-raw-td>{{ s.sec }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.x }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.y }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.T }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.a }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.L }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.V }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isIndView }}\">\n            <section class=\"card blueprint\" style=\"padding:14px;gap:10px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"display:flex;align-items:baseline;gap:10px\"><h6 style=\"margin:0;color:var(--dx-ink-accent)\">Industrial flowsheet<\u002Fh6><span style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Click an item for its engineering information<\u002Fspan><\u002Fdiv>\n              <svg sc-camel-view-box=\"0 0 900 420\" style=\"width:100%;height:auto\" role=\"img\" aria-label=\"Process flow diagram of the distillation unit\">\n                <g stroke=\"color-mix(in srgb,var(--color-text) 8%,transparent)\" stroke-width=\"1\"><path d=\"M0 60 H900 M0 140 H900 M0 220 H900 M0 300 H900 M0 380 H900 M100 0 V420 M300 0 V420 M500 0 V420 M700 0 V420\"><\u002Fpath><\u002Fg>\n                <defs><marker id=\"dxA2\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--color-accent)\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n                <g stroke=\"var(--color-accent)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#dxA2)\">\n                  <path d=\"M92 250 H126\"><\u002Fpath><path d=\"M158 250 H196\"><\u002Fpath><path d=\"M256 250 H300\"><\u002Fpath>\n                  <path d=\"M300 250 H340\"><\u002Fpath>\n                  <path d=\"M400 118 H470 V150\"><\u002Fpath><path d=\"M470 214 V250 H520\"><\u002Fpath>\n                  <path d=\"M600 250 H660\"><\u002Fpath><path d=\"M470 250 V250\"><\u002Fpath>\n                  <path d=\"M370 372 H430 V340\"><\u002Fpath><path d=\"M430 340 V340\"><\u002Fpath>\n                  <path d=\"M340 372 H300 V340\"><\u002Fpath>\n                <\u002Fg>\n                <sc-for list=\"{{ equipment }}\" as=\"e\" hint-placeholder-count=\"8\">\n                  <g data-k=\"{{ e.k }}\" sc-camel-on-click=\"{{ pickEquip }}\" style=\"cursor:pointer\">\n                    <rect x=\"{{ e.x }}\" y=\"{{ e.y }}\" width=\"{{ e.w }}\" height=\"{{ e.h }}\" fill=\"{{ e.fill }}\" stroke=\"var(--color-accent)\" stroke-width=\"{{ e.sw }}\"><\u002Frect>\n                    <text x=\"{{ e.tx }}\" y=\"{{ e.ty }}\" text-anchor=\"middle\" font-size=\"10.5\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\">{{ e.label }}<\u002Ftext>\n                    <text x=\"{{ e.tx }}\" y=\"{{ e.ty2 }}\" text-anchor=\"middle\" font-size=\"9\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ e.tag }}<\u002Ftext>\n                  <\u002Fg>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <div class=\"blueprint\" style=\"padding:10px 12px;background:var(--color-surface)\">\n                <div style=\"font-family:var(--font-heading);font-size:16px\">{{ equipInfo.title }}<\u002Fdiv>\n                <p style=\"margin:4px 0 0;font-size:12.5px;line-height:1.55\">{{ equipInfo.body }}<\u002Fp>\n                <div style=\"margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--color-accent-700)\">{{ equipInfo.duty }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isVLE }}\">\n      <div class=\"dx-side\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:12px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Equilibrium parameters<\u002Fh6>\n            <div class=\"field\">\n              <label for=\"dx-vmix\">Binary mixture<\u002Flabel>\n              <sc-raw-select class=\"input\" id=\"dx-vmix\" value=\"{{ v.mixKey }}\" data-k=\"mixKey\" sc-camel-on-change=\"{{ setStr }}\">\n                <sc-for list=\"{{ mixOptions }}\" as=\"m\" hint-placeholder-count=\"6\"><option value=\"{{ m.k }}\">{{ m.label }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Model<\u002Flabel>\n              <div class=\"seg\" style=\"width:100%\">\n                <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxvmodel\" value=\"raoult\" checked=\"{{ isRaoult }}\" data-k=\"model\" sc-camel-on-change=\"{{ setStr }}\"><span>Raoult / ideal<\u002Fspan><\u002Flabel>\n                <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxvmodel\" value=\"alpha\" checked=\"{{ isAlpha }}\" data-k=\"model\" sc-camel-on-change=\"{{ setStr }}\"><span>Constant α<\u002Fspan><\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between\"><span>Pressure — kPa<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.P }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"10\" max=\"600\" step=\"1\" value=\"{{ v.P }}\" data-k=\"P\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Column pressure, kPa\">\n            <\u002Fdiv>\n            <sc-if value=\"{{ isAlpha }}\">\n              <div class=\"field\">\n                <label style=\"display:flex;justify-content:space-between\"><span>Relative volatility α<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.alphaC }}<\u002Fspan><\u002Flabel>\n                <input type=\"range\" min=\"1.05\" max=\"12\" step=\"0.05\" value=\"{{ v.alphaC }}\" data-k=\"alphaC\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Relative volatility alpha\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <details class=\"dx-dis\"><summary>About this mixture<\u002Fsummary><div class=\"dx-dis-b\">{{ r.mixNote }}<\u002Fdiv><\u002Fdetails>\n          <\u002Fsection>\n\n          <sc-if value=\"{{ isCustom }}\">\n            <section class=\"card blueprint\" style=\"padding:14px;gap:10px\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Custom binary — Antoine data<\u002Fh6>\n              <div style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">log₁₀ P<sup>sat<\u002Fsup>[mmHg] = A − B/(T[°C] + C). Component A must be the more volatile one.<\u002Fdiv>\n              <div class=\"dx-grid2\" style=\"gap:8px\">\n                <div class=\"field\"><label>Name A<\u002Flabel><input class=\"input\" value=\"{{ cust.aName }}\" data-side=\"a\" data-f=\"name\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>Name B<\u002Flabel><input class=\"input\" value=\"{{ cust.bName }}\" data-side=\"b\" data-f=\"name\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>A (A)<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.0001\" value=\"{{ cust.aA }}\" data-side=\"a\" data-f=\"A\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>A (B)<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.0001\" value=\"{{ cust.bA }}\" data-side=\"b\" data-f=\"A\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>B (A)<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.01\" value=\"{{ cust.aB }}\" data-side=\"a\" data-f=\"B\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>B (B)<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.01\" value=\"{{ cust.bB }}\" data-side=\"b\" data-f=\"B\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>C (A)<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.01\" value=\"{{ cust.aC }}\" data-side=\"a\" data-f=\"C\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>C (B)<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.01\" value=\"{{ cust.bC }}\" data-side=\"b\" data-f=\"C\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>MW A<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.01\" value=\"{{ cust.aMW }}\" data-side=\"a\" data-f=\"MW\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>MW B<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.01\" value=\"{{ cust.bMW }}\" data-side=\"b\" data-f=\"MW\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>T<sub>b<\u002Fsub> A — °C<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.1\" value=\"{{ cust.aTb }}\" data-side=\"a\" data-f=\"Tb\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n                <div class=\"field\"><label>T<sub>b<\u002Fsub> B — °C<\u002Flabel><input class=\"input\" type=\"number\" step=\"0.1\" value=\"{{ cust.bTb }}\" data-side=\"b\" data-f=\"Tb\" sc-camel-on-change=\"{{ setCust }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <section class=\"card blueprint\" style=\"padding:14px;gap:6px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Model facts<\u002Fh6>\n            <sc-for list=\"{{ vleFacts }}\" as=\"fct\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;flex-direction:column;gap:1px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)\">\n                <span style=\"font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ fct.k }}<\u002Fspan>\n                <span style=\"font-size:12.5px\">{{ fct.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:10px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Vapour–liquid equilibrium<\u002Fh6>\n              <div class=\"seg\" style=\"margin-left:auto\">\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"dxvle\" value=\"xy\" checked=\"{{ isXY }}\" sc-camel-on-change=\"{{ setVleShow }}\"><span>x–y diagram<\u002Fspan><\u002Flabel>\n                <label class=\"seg-opt\"><input type=\"radio\" name=\"dxvle\" value=\"txy\" checked=\"{{ isTXY }}\" sc-camel-on-change=\"{{ setVleShow }}\"><span>T–x–y diagram<\u002Fspan><\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 500 480\" style=\"width:100%;height:auto;touch-action:none\" sc-camel-on-pointer-move=\"{{ vleMove }}\" sc-camel-on-pointer-leave=\"{{ vleLeave }}\" role=\"img\" aria-label=\"Equilibrium diagram\">\n              <g stroke=\"color-mix(in srgb,var(--color-text) 8%,transparent)\" stroke-width=\"1\">\n                <path d=\"M60 340 H460 M60 260 H460 M60 180 H460 M60 100 H460 M140 20 V420 M220 20 V420 M300 20 V420 M380 20 V420\"><\u002Fpath>\n              <\u002Fg>\n              <path d=\"M60 20 V420 H460\" fill=\"none\" stroke=\"var(--color-divider)\" stroke-width=\"1.4\"><\u002Fpath>\n              <sc-if value=\"{{ isXY }}\">\n                <line x1=\"60\" y1=\"420\" x2=\"460\" y2=\"20\" stroke=\"color-mix(in srgb,var(--color-text) 45%,transparent)\" stroke-width=\"1.2\"><\u002Fline>\n                <polyline points=\"{{ eqPoints }}\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Fpolyline>\n                <text x=\"70\" y=\"36\" font-size=\"11\" font-family=\"var(--font-heading)\" letter-spacing=\".08em\" fill=\"var(--color-accent)\">EQUILIBRIUM y* = f(x)<\u002Ftext>\n                <text x=\"352\" y=\"404\" font-size=\"11\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">y = x<\u002Ftext>\n                <sc-if value=\"{{ vleHoverOn }}\">\n                  <g>\n                    <line x1=\"{{ vleHover.cx }}\" y1=\"420\" x2=\"{{ vleHover.cx }}\" y2=\"{{ vleHover.cy }}\" stroke=\"var(--color-accent)\" stroke-dasharray=\"3 3\" stroke-width=\"1\"><\u002Fline>\n                    <line x1=\"60\" y1=\"{{ vleHover.cy }}\" x2=\"{{ vleHover.cx }}\" y2=\"{{ vleHover.cy }}\" stroke=\"var(--color-accent)\" stroke-dasharray=\"3 3\" stroke-width=\"1\"><\u002Fline>\n                    <circle cx=\"{{ vleHover.cx }}\" cy=\"{{ vleHover.cy }}\" r=\"4\" fill=\"var(--color-accent)\"><\u002Fcircle>\n                    <text x=\"{{ vleHover.lx }}\" y=\"{{ vleHover.cy }}\" font-size=\"11\" font-variant-numeric=\"tabular-nums\" fill=\"var(--color-text)\">{{ vleHover.label }}<\u002Ftext>\n                  <\u002Fg>\n                <\u002Fsc-if>\n                <text x=\"260\" y=\"458\" text-anchor=\"middle\" font-size=\"12\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\">LIQUID MOLE FRACTION x_A<\u002Ftext>\n                <text x=\"18\" y=\"220\" text-anchor=\"middle\" font-size=\"12\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\" transform=\"rotate(-90 18 220)\">VAPOUR MOLE FRACTION y_A<\u002Ftext>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ isTXY }}\">\n                <polyline points=\"{{ bubPoints }}\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Fpolyline>\n                <polyline points=\"{{ dewPoints }}\" fill=\"none\" stroke=\"var(--color-accent-700)\" stroke-width=\"2\" stroke-dasharray=\"6 4\"><\u002Fpolyline>\n                <text x=\"70\" y=\"36\" font-size=\"11\" font-family=\"var(--font-heading)\" letter-spacing=\".08em\" fill=\"var(--color-accent)\">BUBBLE (solid) / DEW (dashed) — VAPOUR REGION ABOVE<\u002Ftext>\n                <sc-for list=\"{{ tTicks }}\" as=\"t\" hint-placeholder-count=\"5\">\n                  <text x=\"52\" y=\"{{ t.y }}\" text-anchor=\"end\" font-size=\"10\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext>\n                <\u002Fsc-for>\n                <text x=\"260\" y=\"458\" text-anchor=\"middle\" font-size=\"12\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\">MOLE FRACTION A (x, y)<\u002Ftext>\n                <text x=\"18\" y=\"220\" text-anchor=\"middle\" font-size=\"12\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\" transform=\"rotate(-90 18 220)\">TEMPERATURE °C<\u002Ftext>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ axTicks }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <g><text x=\"{{ t.x }}\" y=\"438\" text-anchor=\"middle\" font-size=\"10\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext><\u002Fg>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ isXY }}\">\n                <sc-for list=\"{{ axTicks }}\" as=\"t\" hint-placeholder-count=\"6\">\n                  <text x=\"52\" y=\"{{ t.y }}\" text-anchor=\"end\" font-size=\"10\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n            <\u002Fsvg>\n            <div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Move the pointer across the plot to read exact equilibrium values.<\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"card blueprint\" style=\"padding:14px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Component data<\u002Fh6>\n            <div style=\"overflow-x:auto\" tabindex=\"0\" role=\"region\" aria-label=\"Component data table, scrolls horizontally\">\n            <sc-raw-table class=\"table\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Component<\u002Fsc-raw-th><sc-raw-th>CAS<\u002Fsc-raw-th><sc-raw-th>Role<\u002Fsc-raw-th><sc-raw-th>MW g/mol<\u002Fsc-raw-th><sc-raw-th>T<sub>b<\u002Fsub> °C<\u002Fsc-raw-th><sc-raw-th>Antoine A / B / C<\u002Fsc-raw-th><sc-raw-th>Valid range<\u002Fsc-raw-th><sc-raw-th>Check<\u002Fsc-raw-th><sc-raw-th>λ kJ/mol<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ compRows }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <sc-raw-tr><sc-raw-td>{{ c.name }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ c.cas }}<\u002Fsc-raw-td><sc-raw-td>{{ c.role }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ c.mw }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ c.tb }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ c.ant }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ c.rng }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ c.chk }}<\u002Fsc-raw-td><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ c.lat }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">The <em>Check<\u002Fem> column recomputes each component's vapour pressure at its own normal boiling point — it should read ≈ 760 mmHg. Any stage temperature outside the fitted range raises an extrapolation warning at the top of the screen.<\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMT }}\">\n      <div class=\"dx-side\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:12px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Construction inputs<\u002Fh6>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between\"><span>Distillate x<sub>D<\u002Fsub><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.xD }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.05\" max=\"0.999\" step=\"0.001\" value=\"{{ v.xD }}\" data-k=\"xD\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Distillate composition x_D, mole fraction\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between\"><span>Bottoms x<sub>B<\u002Fsub><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.xB }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.001\" max=\"0.95\" step=\"0.001\" value=\"{{ v.xB }}\" data-k=\"xB\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Bottoms composition x_B, mole fraction\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between\"><span>Feed z<sub>F<\u002Fsub><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.zF }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.02\" max=\"0.98\" step=\"0.005\" value=\"{{ v.zF }}\" data-k=\"zF\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Feed composition z_F, mole fraction\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between\"><span>Reflux ratio R<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.R }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.1\" max=\"12\" step=\"0.05\" value=\"{{ v.R }}\" data-k=\"R\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Reflux ratio R\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between\"><span>Feed quality q<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.q }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"-0.5\" max=\"1.5\" step=\"0.01\" value=\"{{ v.q }}\" data-k=\"q\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Feed quality q\">\n              <div style=\"font-size:11px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ r.qPhase }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">The three square handles on the diagonal — x<sub>B<\u002Fsub>, z<sub>F<\u002Fsub> and x<sub>D<\u002Fsub> — can be dragged directly on the diagram.<\u002Fdiv>\n          <\u002Fsection>\n          <section class=\"card blueprint dx-noprint\" style=\"padding:14px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Stage stepping<\u002Fh6>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ runSteps }}\" style=\"margin-top:0\">▶ Run stage calculation<\u002Fbutton>\n            <div style=\"display:flex;gap:6px\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ stepBack }}\" style=\"flex:1\">‹ Back<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ stepOne }}\" style=\"flex:1\">Step ›<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ stepAll }}\" style=\"flex:1\">All<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;font-variant-numeric:tabular-nums\">Stages drawn: {{ shownStages }}<\u002Fdiv>\n            <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mtStepInfo }}<\u002Fp>\n          <\u002Fsection>\n          <section class=\"card blueprint\" style=\"padding:14px;gap:4px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Construction results<\u002Fh6>\n            <sc-for list=\"{{ mtSummary }}\" as=\"row\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)\">\n                <span style=\"color:color-mix(in srgb,var(--color-text) 70%,transparent)\">{{ row.k }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <section class=\"card blueprint\" style=\"padding:14px;gap:10px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin:0;color:var(--dx-ink-accent)\">McCabe–Thiele diagram<\u002Fh6>\n          <svg sc-camel-view-box=\"0 0 500 480\" style=\"width:100%;height:auto;touch-action:none;user-select:none\" sc-camel-on-pointer-move=\"{{ mtMove }}\" sc-camel-on-pointer-up=\"{{ mtUp }}\" sc-camel-on-pointer-leave=\"{{ mtUp }}\" role=\"img\" aria-label=\"McCabe-Thiele construction\">\n            <g stroke=\"color-mix(in srgb,var(--color-text) 8%,transparent)\" stroke-width=\"1\">\n              <path d=\"M60 340 H460 M60 260 H460 M60 180 H460 M60 100 H460 M140 20 V420 M220 20 V420 M300 20 V420 M380 20 V420\"><\u002Fpath>\n            <\u002Fg>\n            <path d=\"M60 20 V420 H460\" fill=\"none\" stroke=\"var(--color-divider)\" stroke-width=\"1.4\"><\u002Fpath>\n            <line x1=\"60\" y1=\"420\" x2=\"460\" y2=\"20\" stroke=\"color-mix(in srgb,var(--color-text) 45%,transparent)\" stroke-width=\"1.2\"><\u002Fline>\n            <polyline points=\"{{ eqPoints }}\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Fpolyline>\n            <sc-if value=\"{{ mtOk }}\">\n              <g>\n                <line x1=\"{{ rminLine.x1 }}\" y1=\"{{ rminLine.y1 }}\" x2=\"{{ rminLine.x2 }}\" y2=\"{{ rminLine.y2 }}\" stroke=\"color-mix(in srgb,var(--color-text) 40%,transparent)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"><\u002Fline>\n                <line x1=\"{{ qLine.x1 }}\" y1=\"{{ qLine.y1 }}\" x2=\"{{ qLine.x2 }}\" y2=\"{{ qLine.y2 }}\" stroke=\"var(--color-accent-700)\" stroke-width=\"1.6\" stroke-dasharray=\"7 4\"><\u002Fline>\n                <line x1=\"{{ rectLine.x1 }}\" y1=\"{{ rectLine.y1 }}\" x2=\"{{ rectLine.x2 }}\" y2=\"{{ rectLine.y2 }}\" stroke=\"var(--color-accent-800)\" stroke-width=\"1.8\"><\u002Fline>\n                <line x1=\"{{ stripLine.x1 }}\" y1=\"{{ stripLine.y1 }}\" x2=\"{{ stripLine.x2 }}\" y2=\"{{ stripLine.y2 }}\" stroke=\"var(--color-accent-800)\" stroke-width=\"1.8\"><\u002Fline>\n                <sc-for list=\"{{ mtSegs }}\" as=\"g\" hint-placeholder-count=\"10\">\n                  <line x1=\"{{ g.x1 }}\" y1=\"{{ g.y1 }}\" x2=\"{{ g.x2 }}\" y2=\"{{ g.y2 }}\" stroke=\"{{ g.c }}\" stroke-width=\"1.2\"><\u002Fline>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ mtMarks }}\" as=\"m\" hint-placeholder-count=\"6\">\n                  <text x=\"{{ m.x }}\" y=\"{{ m.y }}\" text-anchor=\"end\" font-size=\"9.5\" font-variant-numeric=\"tabular-nums\" fill=\"{{ m.fill }}\">{{ m.n }}<\u002Ftext>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ mtPoints }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <g data-k=\"{{ p.k }}\" sc-camel-on-pointer-down=\"{{ mtDown }}\" style=\"cursor:ew-resize\">\n                    <rect x=\"{{ p.cx }}\" y=\"{{ p.cy }}\" width=\"11\" height=\"11\" transform=\"translate(-5.5,-5.5)\" fill=\"var(--color-bg)\" stroke=\"var(--color-accent)\" stroke-width=\"1.8\"><\u002Frect>\n                    <text x=\"{{ p.cx }}\" y=\"{{ p.cy }}\" dx=\"10\" dy=\"-8\" font-size=\"11\" font-family=\"var(--font-heading)\" fill=\"var(--color-accent-800)\">{{ p.label }}<\u002Ftext>\n                  <\u002Fg>\n                <\u002Fsc-for>\n              <\u002Fg>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ axTicks }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <g><text x=\"{{ t.x }}\" y=\"438\" text-anchor=\"middle\" font-size=\"10\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext>\n                 <text x=\"52\" y=\"{{ t.y }}\" text-anchor=\"end\" font-size=\"10\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext><\u002Fg>\n            <\u002Fsc-for>\n            <text x=\"260\" y=\"458\" text-anchor=\"middle\" font-size=\"12\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\">LIQUID MOLE FRACTION x_A<\u002Ftext>\n            <text x=\"18\" y=\"220\" text-anchor=\"middle\" font-size=\"12\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\" transform=\"rotate(-90 18 220)\">VAPOUR MOLE FRACTION y_A<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:color-mix(in srgb,var(--color-text) 65%,transparent)\">\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:18px;height:2px;background:var(--color-accent)\"><\u002Fspan>Equilibrium curve<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:18px;height:2px;background:var(--color-accent-800)\"><\u002Fspan>Operating lines<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:18px;height:2px;background:var(--color-accent-700)\"><\u002Fspan>q-line<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:18px;height:1px;background:color-mix(in srgb,var(--color-text) 40%,transparent)\"><\u002Fspan>Minimum-reflux line<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResults }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <section class=\"card blueprint dx-noprint\" style=\"padding:14px;gap:10px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Export<\u002Fh6>\n            <div style=\"display:flex;gap:8px;margin-left:auto;flex-wrap:wrap\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exportCSV }}\">Export CSV<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exportJSON }}\">Export JSON<\u002Fbutton>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ printReport }}\">Printable report<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Exports are generated in the browser — no data leaves this machine. The printable report contains inputs, model, assumptions, results and the mass balance.<\u002Fdiv>\n        <\u002Fsection>\n\n        <div class=\"dx-grid2\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:6px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">User inputs<\u002Fh6>\n            <sc-for list=\"{{ inputRows }}\" as=\"row\" hint-placeholder-count=\"10\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)\">\n                <span style=\"color:color-mix(in srgb,var(--color-text) 70%,transparent)\">{{ row.k }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;text-align:right\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <section class=\"card blueprint\" style=\"padding:14px;gap:6px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Calculated values<\u002Fh6>\n            <sc-for list=\"{{ calcRows }}\" as=\"row\" hint-placeholder-count=\"12\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)\">\n                <span style=\"color:color-mix(in srgb,var(--color-text) 70%,transparent)\">{{ row.k }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;text-align:right\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <div class=\"dx-grid2\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Material balance &amp; numerical convergence<\u002Fh6>\n            <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.identityHead }}<\u002Fdiv>\n            <div style=\"font-size:12px;font-variant-numeric:tabular-nums;line-height:1.8;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">\n              <div>Overall: F = D + B → {{ mb.total }}<\u002Fdiv>\n              <div>Component A: F·z<sub>F<\u002Fsub> = D·x<sub>D<\u002Fsub> + B·x<sub>B<\u002Fsub> → {{ mb.comp }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;line-height:1.55;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.identityNote }}<\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--color-divider);padding-top:8px;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.convHead }}<\u002Fdiv>\n            <div style=\"{{ mb.convStyle }}\">{{ mb.convStatus }}<\u002Fdiv>\n            <div style=\"font-size:12px;font-variant-numeric:tabular-nums;line-height:1.8;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.residLabel }}: {{ mb.residValue }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;line-height:1.55;color:color-mix(in srgb,var(--color-text) 75%,transparent)\">{{ mb.residNote }}<\u002Fdiv>\n          <\u002Fsection>\n          <section class=\"card blueprint\" style=\"padding:14px;gap:6px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Model assumptions<\u002Fh6>\n            <sc-for list=\"{{ assumptions }}\" as=\"a\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;gap:8px;font-size:12.5px;line-height:1.5\"><span style=\"color:var(--dx-ink-accent)\">—<\u002Fspan><span>{{ a }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSens }}\">\n      <div class=\"dx-side\">\n        <section class=\"card blueprint\" style=\"padding:14px;gap:12px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Study definition<\u002Fh6>\n          <div class=\"field\">\n            <label for=\"dx-si\">Independent variable<\u002Flabel>\n            <sc-raw-select class=\"input\" id=\"dx-si\" value=\"{{ sv.ind }}\" data-k=\"ind\" sc-camel-on-change=\"{{ setSens }}\">\n              <sc-for list=\"{{ sensInd }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.k }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label for=\"dx-sd\">Dependent variable<\u002Flabel>\n            <sc-raw-select class=\"input\" id=\"dx-sd\" value=\"{{ sv.dep }}\" data-k=\"dep\" sc-camel-on-change=\"{{ setSens }}\">\n              <sc-for list=\"{{ sensDep }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.k }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"dx-grid2\" style=\"gap:8px\">\n            <div class=\"field\"><label for=\"dx-smin\">Minimum<\u002Flabel><input class=\"input\" id=\"dx-smin\" type=\"number\" step=\"0.1\" value=\"{{ sv.min }}\" data-k=\"min\" sc-camel-on-change=\"{{ setSens }}\"><\u002Fdiv>\n            <div class=\"field\"><label for=\"dx-smax\">Maximum<\u002Flabel><input class=\"input\" id=\"dx-smax\" type=\"number\" step=\"0.1\" value=\"{{ sv.max }}\" data-k=\"max\" sc-camel-on-change=\"{{ setSens }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\"><label for=\"dx-sn\">Number of points<\u002Flabel><input class=\"input\" id=\"dx-sn\" type=\"number\" min=\"3\" max=\"60\" step=\"1\" value=\"{{ sv.n }}\" data-k=\"n\" sc-camel-on-change=\"{{ setSens }}\"><\u002Fdiv>\n          <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ sensCSV }}\">Export sweep as CSV<\u002Fbutton>\n          <div style=\"font-size:11.5px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Each point is a complete re-solve of the column with the same thermodynamic model. Infeasible points are omitted rather than extrapolated.<\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"card blueprint\" style=\"padding:14px;gap:10px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin:0;color:var(--dx-ink-accent)\">{{ sensTitle }}<\u002Fh6>\n          <svg sc-camel-view-box=\"0 0 660 300\" style=\"width:100%;height:auto\" role=\"img\" aria-label=\"Sensitivity chart\">\n            <g stroke=\"color-mix(in srgb,var(--color-text) 8%,transparent)\" stroke-width=\"1\"><path d=\"M70 40 H620 M70 92 H620 M70 145 H620 M70 197 H620\"><\u002Fpath><\u002Fg>\n            <path d=\"M70 30 V250 H620\" fill=\"none\" stroke=\"var(--color-divider)\" stroke-width=\"1.4\"><\u002Fpath>\n            <sc-if value=\"{{ sensHasData }}\">\n              <g>\n                <polyline points=\"{{ sensPts }}\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Fpolyline>\n                <sc-for list=\"{{ sensDots }}\" as=\"d\" hint-placeholder-count=\"8\">\n                  <circle cx=\"{{ d.cx }}\" cy=\"{{ d.cy }}\" r=\"2.6\" fill=\"var(--color-accent)\"><\u002Fcircle>\n                <\u002Fsc-for>\n              <\u002Fg>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ sensXTicks }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <text x=\"{{ t.x }}\" y=\"268\" text-anchor=\"middle\" font-size=\"10\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ sensYTicks }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <text x=\"62\" y=\"{{ t.y }}\" text-anchor=\"end\" font-size=\"10\" fill=\"color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ t.label }}<\u002Ftext>\n            <\u002Fsc-for>\n            <text x=\"345\" y=\"290\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\">{{ sensXLabel }}<\u002Ftext>\n            <text x=\"16\" y=\"140\" text-anchor=\"middle\" font-size=\"11.5\" font-family=\"var(--font-heading)\" letter-spacing=\".06em\" fill=\"var(--color-text)\" transform=\"rotate(-90 16 140)\">{{ sensYLabel }}<\u002Ftext>\n          <\u002Fsvg>\n          <div class=\"blueprint\" style=\"padding:10px 12px;background:var(--color-surface)\">\n            <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dx-ink-accent)\">Key observation<\u002Fdiv>\n            <p style=\"margin:4px 0 0;font-size:13px;line-height:1.55\">{{ sensNote }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTheory }}\">\n      <div style=\"max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"padding:4px 0 12px\">\n          <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dx-ink-accent)\">Reference<\u002Fdiv>\n          <h2 style=\"margin:4px 0 6px\">Theory of fractional distillation<\u002Fh2>\n          <p style=\"max-width:76ch;font-size:14px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Twenty topics, each written against the same equations the simulator solves. Numbers quoted in the simulator can be traced back to the relationships described here.<\u002Fp>\n        <\u002Fdiv>\n        <sc-for list=\"{{ theoryItems }}\" as=\"t\" hint-placeholder-count=\"20\">\n          <div class=\"blueprint\" style=\"padding:4px 14px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <button data-k=\"{{ t.k }}\" sc-camel-on-click=\"{{ setTheory }}\" style=\"{{ t.headStyle }}\">\n              <span style=\"font-size:12px;font-variant-numeric:tabular-nums;color:var(--dx-ink-accent)\">{{ t.no }}<\u002Fspan>\n              <span>{{ t.title }}<\u002Fspan>\n            <\u002Fbutton>\n            <p style=\"{{ t.bodyStyle }}\">{{ t.body }}<\u002Fp>\n            <div style=\"height:6px\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isExam }}\">\n      <div style=\"max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px\">\n        <section class=\"card blueprint\" style=\"padding:18px;gap:12px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span class=\"tag tag-accent\"><span>Question&nbsp;{{ examNo }}&nbsp;of&nbsp;{{ examTotal }}<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Generated from the current simulation — answers are the engine's own values<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:18px;font-family:var(--font-heading);line-height:1.3\">{{ examQ }}<\u002Fp>\n          <sc-if value=\"{{ examNumeric }}\">\n            <div style=\"display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap\">\n              <div class=\"field\" style=\"flex:1;min-width:180px\">\n                <label for=\"dx-exa\">Your answer {{ examUnit }}<\u002Flabel>\n                <input class=\"input\" id=\"dx-exa\" type=\"number\" step=\"any\" value=\"{{ examInput }}\" sc-camel-on-change=\"{{ examSet }}\">\n              <\u002Fdiv>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ examCheck }}\">Check answer<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ examRetry }}\">Try again<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ examHasVerdict }}\">\n            <div style=\"{{ examVerdictStyle }}\">{{ examVerdict }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ examHintBtn }}\">Show hint<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ examSolBtn }}\">Show solution<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ examPrev }}\" style=\"margin-left:auto\">‹ Previous<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ examNext }}\">Next ›<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showHint }}\">\n            <div class=\"blueprint\" style=\"padding:10px 12px;background:var(--color-surface)\">\n              <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dx-ink-accent)\">Hint<\u002Fdiv>\n              <p style=\"margin:4px 0 0;font-size:13.5px;line-height:1.55\">{{ examHint }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showSol }}\">\n            <div class=\"blueprint\" style=\"padding:10px 12px;background:var(--color-surface)\">\n              <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dx-ink-accent)\">Worked solution<\u002Fdiv>\n              <p style=\"margin:4px 0 0;font-size:13.5px;line-height:1.6\">{{ examSol }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n        <p style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 72%,transparent);margin:0\">Change any parameter on the Simulation page and the questions — and their answers — are regenerated from the new case.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isValidate }}\">\n      <div style=\"max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px\">\n        <section class=\"card blueprint\" style=\"padding:18px;gap:10px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n            <h2 style=\"margin:0\">Validation<\u002Fh2>\n            <div style=\"{{ val.summaryStyle }}\">{{ val.summary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:80ch;font-size:13.5px;line-height:1.6\">Every figure below is recomputed in your browser each time this page is drawn, from the same engine the rest of the application uses. Each check compares the engine either against a <strong>closed-form result<\u002Fstrong>, against an <strong>identity<\u002Fstrong> it must satisfy, or against <strong>its own internal consistency<\u002Fstrong>.<\u002Fp>\n          <p style=\"margin:0;max-width:80ch;font-size:13.5px;line-height:1.6;border-left:2px solid var(--color-accent);padding-left:10px\">This is <strong>internal validation only<\u002Fstrong>. Nothing here is compared against a published worked example, tabulated experimental VLE data, or another simulator — no such comparison has been carried out. These checks show the implementation is faithful to its own model; they say nothing about how well that model describes a real column. The derivations and the full list of what is and is not checked are in <code>METHODS.md<\u002Fcode>.<\u002Fp>\n        <\u002Fsection>\n        <sc-for list=\"{{ val.groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">{{ g.name }}<\u002Fh6>\n            <div style=\"overflow-x:auto\" tabindex=\"0\" role=\"region\" aria-label=\"Validation results, scrolls horizontally\">\n            <sc-raw-table class=\"table\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Result<\u002Fsc-raw-th><sc-raw-th>Check<\u002Fsc-raw-th><sc-raw-th>Computed<\u002Fsc-raw-th><sc-raw-th>Reference<\u002Fsc-raw-th><sc-raw-th>Error<\u002Fsc-raw-th><sc-raw-th>Tolerance<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ g.rows }}\" as=\"v\" hint-placeholder-count=\"3\">\n                  <sc-raw-tr style=\"{{ v.style }}\"><sc-raw-td>{{ v.status }}<\u002Fsc-raw-td><sc-raw-td>{{ v.check }}<\u002Fsc-raw-td><sc-raw-td>{{ v.got }}<\u002Fsc-raw-td><sc-raw-td>{{ v.ref }}<\u002Fsc-raw-td><sc-raw-td>{{ v.err }}<\u002Fsc-raw-td><sc-raw-td>{{ v.tol }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-for list=\"{{ g.rows }}\" as=\"v\" hint-placeholder-count=\"3\">\n              <div style=\"font-size:11px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ v.note }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-for>\n        <section class=\"card blueprint\" style=\"padding:14px;gap:6px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Reproducing this outside the browser<\u002Fh6>\n          <p style=\"margin:0;font-size:13px;line-height:1.6\">The same checks, plus a 648-case numerical fingerprint, the hostile-input matrix, the save/load round-trip and a build-reproducibility check, run headless against the source: <code>node tools/test.js<\u002Fcode>. It exits non-zero on any failure.<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAbout }}\">\n      <div style=\"max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px\">\n        <section class=\"card blueprint\" style=\"padding:18px;gap:8px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h2 style=\"margin:0\">DISTILLEX<\u002Fh2>\n          <p style=\"margin:0;max-width:78ch;font-size:14px;line-height:1.6\">An interactive fractional-distillation laboratory for binary mixtures. Every value on screen is computed in the browser from the selected thermodynamic model: there is no server, no stored data and no pre-baked result. The calculation layer — Antoine vapour pressure, bubble and dew points, equilibrium interpolation, q-line, minimum reflux, operating lines, stage stepping, material balance, recovery and duties — is written as named functions so it can be tested and extended to other unit operations.<\u002Fp>\n        <\u002Fsection>\n        <div class=\"dx-grid2\">\n          <section class=\"card blueprint\" style=\"padding:16px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Engineering models<\u002Fh6>\n            <p style=\"margin:0;font-size:13px;line-height:1.6\">Ideal VLE (Raoult's law) with Antoine vapour pressures in mmHg and °C, and a constant-relative-volatility model. Stage calculations follow McCabe–Thiele under constant molar overflow; minimum reflux includes a tangent-pinch check; minimum stages use Fenske with a geometric-mean α. Activity-coefficient models (Wilson, NRTL, UNIQUAC) are <strong>not<\u002Fstrong> implemented — mixtures that need them are flagged rather than silently approximated.<\u002Fp>\n          <\u002Fsection>\n          <section class=\"card blueprint\" style=\"padding:16px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Data provenance &amp; validation<\u002Fh6>\n            <p style=\"margin:0;font-size:13px;line-height:1.6\">Antoine constants are the Reid–Prausnitz–Poling / Lange sets in mmHg and °C, each stored with the temperature range it was fitted over; the VLE Explorer prints that range and re-derives each pure-component vapour pressure at its own normal boiling point as a self-check (benzene 759.0 mmHg at 80.0 °C, water 757.6 mmHg at 100.0 °C — both ≈ 760). Latent heats are values at the normal boiling point. Stage temperatures outside a fitted range raise an extrapolation warning rather than silently degrading. Known azeotropes are recorded per mixture — ethanol/water at 95.6 wt% ethanol (x ≈ 0.894), boiling at 78.2 °C at 1 atm — and any specification that crosses one is flagged as physically unreachable, whatever the ideal model computes.<\u002Fp>\n          <\u002Fsection>\n          <section class=\"card blueprint\" style=\"padding:16px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Limitations<\u002Fh6>\n            <p style=\"margin:0;font-size:13px;line-height:1.6\">Binary systems only. No column hydraulics (flooding, weeping, pressure drop, diameter). Duties are latent-heat only. Tray efficiency is applied as a single overall value. Packed columns are not modelled: no HETP, packed height or transfer-unit (HTU/NTU) calculation is performed. Azeotropic systems cannot be represented by either model offered.<\u002Fp>\n          <\u002Fsection>\n        <\u002Fdiv>\n        <div class=\"dx-grid2\">\n          <section class=\"card blueprint\" style=\"padding:16px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Deployment<\u002Fh6>\n            <ol style=\"margin:0;padding-left:18px;font-size:13px;line-height:1.7\">\n              <li>Create a GitHub repository and push this project.<\u002Fli>\n              <li>Import the repository into Vercel — it is a static client-side app, so no build configuration or environment variables are required.<\u002Fli>\n              <li>Deploy, then open the generated Vercel URL.<\u002Fli>\n              <li>To update the live site, push to the tracked branch: Vercel rebuilds and redeploys automatically.<\u002Fli>\n            <\u002Fol>\n          <\u002Fsection>\n          <section class=\"card blueprint\" style=\"padding:16px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Extending it<\u002Fh6>\n            <p style=\"margin:0;font-size:13px;line-height:1.6\">The thermodynamic layer (vapour pressure, equilibrium, temperatures), the unit-operation engine (balances, stage stepping, duties), the visualisation layer and the mixture data are separate concerns. A new unit operation — absorption, extraction, evaporation, a heat exchanger — needs a new engine module and view; the thermodynamic and data layers are reused unchanged.<\u002Fp>\n          <\u002Fsection>\n        <\u002Fdiv>\n        <section class=\"card blueprint\" style=\"padding:16px;gap:6px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Standing assumptions<\u002Fh6>\n          <sc-for list=\"{{ assumptions }}\" as=\"a\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;gap:8px;font-size:12.5px;line-height:1.5\"><span style=\"color:var(--dx-ink-accent)\">—<\u002Fspan><span>{{ a }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <section class=\"card blueprint\" style=\"padding:16px;gap:6px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Developer<\u002Fh6>\n          <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n            <div style=\"font-family:var(--font-heading);font-size:19px\">Shafin Ahamed Neon<\u002Fdiv>\n            <a href=\"https://www.linkedin.com/in/shafin-ahamed-neon-aa9596213\" target=\"_blank\" rel=\"noopener noreferrer external\"\n               style=\"font-size:13px;min-height:44px;display:inline-flex;align-items:center\"\n               aria-label=\"Shafin Ahamed Neon on LinkedIn (opens in a new tab)\">LinkedIn ↗<\u002Fa>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:12.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Design, thermodynamic model, calculation engine and interface. Released under the MIT licence.<\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <footer class=\"dx-noprint\" style=\"border-top:1px solid var(--dx-hairline);padding:14px 18px 0;font-size:11px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center\">\n      <span style=\"font-family:var(--font-heading);letter-spacing:.13em\">DISTILLEX<\u002Fspan>\n      <span style=\"max-width:96ch;line-height:1.5\">This simulator is intended for education and conceptual engineering analysis. Results depend on the selected thermodynamic model and assumptions and should not be used as the sole basis for industrial process design.<\u002Fspan>\n      <span style=\"margin-left:auto\">{{ modelBadge }}<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"dx-sig\"><b>Shafin Ahamed Neon<\u002Fb><\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ tipOpen }}\">\n  <div style=\"{{ tipStyle }}\">{{ tipText }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ toastOpen }}\">\n  <div role=\"status\" aria-live=\"polite\" style=\"position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;padding:8px 16px;border:1px solid var(--color-accent);background:var(--color-bg);font-size:13px;box-shadow:var(--shadow-md)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:950},&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;landing&quot;,&quot;sim&quot;,&quot;vle&quot;,&quot;mt&quot;,&quot;column&quot;,&quot;results&quot;,&quot;sens&quot;,&quot;theory&quot;,&qu
