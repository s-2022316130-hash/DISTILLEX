  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

52-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6707954b-dfdd-482c-845e-9a7ad6e6b8c6\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d446ef4c-d96a-4da0-ac35-954cf8899fb5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"47d51ec6-f584-4e2e-8594-d2afba24cbee\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"bedf693d-8aab-4412-8f87-0e1eba2b2587\"><\u002Fscript>\n<style>\n  /* ═══════════════════════════════════════════════════════════════════════\n     DISTILLEX design system.\n\n     Loaded after the inlined design-system stylesheet, so everything here\n     overrides it. The palette is re-pitched from the original neutral\n     blue-grey to a deeper, more deliberate instrument look: an indigo\n     primary, a teal secondary reserved for vapour/fluid meaning, a violet\n     accent for interactive state, and restrained status hues. Every colour\n     below was checked for contrast before it was written — see the\n     `contrast` suite in tools/test.js, which recomputes the ratios.\n     ═══════════════════════════════════════════════════════════════════ */\n\n  :root {\n    /* ── foundation ───────────────────────────────────────────────────── */\n    --color-bg:      #f6f7fb;   /* page floor            */\n    --color-surface: #eceef6;   /* recessed / inset      */\n    --dx-raised:     #ffffff;   /* elevated panel        */\n    --color-text:    #101627;\n    --color-divider: color-mix(in srgb, #101627 13%, transparent);\n    --dx-hairline:   color-mix(in srgb, #101627 8%, transparent);\n\n    /* ── indigo primary ───────────────────────────────────────────────── */\n    --color-accent:     #5566d6;   /* non-text: strokes, thumbs, fills */\n    --color-accent-100: #eef0ff;\n    --color-accent-200: #dde1ff;\n    --color-accent-300: #bcc4fb;\n    --color-accent-400: #8e9bf0;\n    --color-accent-500: #5566d6;\n    --color-accent-600: #4453c4;\n    --color-accent-700: #3949ab;   /* text-safe */\n    --color-accent-800: #2a3680;\n    --color-accent-900: #1b2354;\n\n    /* ── teal secondary — vapour, gas, flow ───────────────────────────── */\n    --color-accent-2:     #0e7490;\n    --color-accent-2-100: #e6f6fa;\n    --color-accent-2-200: #c5eaf2;\n    --color-accent-2-300: #8fd6e5;\n    --color-accent-2-400: #46b3cc;\n    --color-accent-2-500: #1691b0;\n    --color-accent-2-600: #0e7490;\n    --color-accent-2-700: #0b5d73;\n    --color-accent-2-800: #094857;\n    --color-accent-2-900: #06303a;\n\n    /* ── violet accent — interactive emphasis ─────────────────────────── */\n    --dx-violet:     #6d28d9;\n    --dx-violet-soft: color-mix(in srgb, #6d28d9 12%, transparent);\n\n    /* ── liquid / vapour semantic pair (used by the column) ───────────── */\n    --dx-liquid: #3949ab;\n    --dx-vapour: #0e7490;\n\n    /* ── status ───────────────────────────────────────────────────────── */\n    --dx-ok:   #11692f;\n    --dx-warn: #804e06;\n    --dx-err:  #b91c1c;\n    --dx-info: #1d4ed8;\n\n    /* ── elevation. Tinted rather than neutral black, so shadows read as\n          part of the palette instead of grey smudges. ──────────────────── */\n    --shadow-sm: 0 1px 2px color-mix(in srgb, #1b2354 8%, transparent);\n    --shadow-md: 0 2px 4px color-mix(in srgb, #1b2354 6%, transparent),\n                 0 8px 20px -6px color-mix(in srgb, #1b2354 14%, transparent);\n    --shadow-lg: 0 4px 8px color-mix(in srgb, #1b2354 6%, transparent),\n                 0 20px 48px -12px color-mix(in srgb, #1b2354 20%, transparent);\n    --dx-glow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 22%, transparent);\n\n    /* ── shape ────────────────────────────────────────────────────────── */\n    --dx-r-sm: 6px; --dx-r-md: 10px; --dx-r-lg: 14px; --dx-r-xl: 20px;\n\n    /* ── motion. One vocabulary; every transition picks from it. ──────── */\n    --dx-t-fast: 120ms; --dx-t-base: 200ms; --dx-t-slow: 340ms;\n    --dx-ease: cubic-bezier(.32,.72,.28,1);\n    --dx-spring: cubic-bezier(.34,1.4,.44,1);\n  }\n\n  .dx-dark {\n    --color-bg:      #0a0e1a;\n    --color-surface: #111829;\n    --dx-raised:     #151d31;\n    --color-text:    #e7ecf7;\n    --color-divider: color-mix(in srgb, #e7ecf7 16%, transparent);\n    --dx-hairline:   color-mix(in srgb, #e7ecf7 9%, transparent);\n\n    --color-accent:     #7b8cf0;\n    --color-accent-100: #161d33;\n    --color-accent-200: #1e2747;\n    --color-accent-300: #93a5ff;\n    --color-accent-400: #8395f7;\n    --color-accent-500: #7b8cf0;\n    --color-accent-600: #93a5ff;\n    --color-accent-700: #93a5ff;\n    --color-accent-800: #c3cdff;\n    --color-accent-900: #e0e6ff;\n\n    --color-accent-2:     #4fd1c5;\n    --color-accent-2-100: #0c2a2e;\n    --color-accent-2-200: #123c42;\n    --color-accent-2-700: #4fd1c5;\n    --color-accent-2-800: #9beae1;\n\n    --dx-violet: #c4a6ff;\n    --dx-violet-soft: color-mix(in srgb, #c4a6ff 16%, transparent);\n\n    --dx-liquid: #93a5ff;\n    --dx-vapour: #4fd1c5;\n\n    --dx-ok:   #4ade80;\n    --dx-warn: #fbbf24;\n    --dx-err:  #f87171;\n    --dx-info: #7dd3fc;\n\n    --color-neutral-100: #131a2b;\n    --color-neutral-800: #c8d2e6;\n\n    --shadow-sm: 0 1px 2px rgba(0,0,0,.55);\n    --shadow-md: 0 2px 6px rgba(0,0,0,.5), 0 10px 26px -8px rgba(0,0,0,.66);\n    --shadow-lg: 0 6px 14px rgba(0,0,0,.5), 0 28px 60px -16px rgba(0,0,0,.74);\n  }\n\n  /* WCAG 1.4.3. The raw accent is reserved for borders, diagram strokes,\n     slider thumbs and fills, which are non-text and need only 3:1 (1.4.11).\n     One step down the same ramp carries text or sits behind it. Both themes\n     are checked by the `contrast` suite. */\n  :root { --dx-ink-accent: var(--color-accent-700); }\n  .dx-dark { --dx-ink-accent: var(--color-accent); }\n\n  /* ── motion policy ──────────────────────────────────────────────────── */\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after {\n      animation-duration: .001ms !important; animation-iteration-count: 1 !important;\n      transition-duration: .001ms !important; scroll-behavior: auto !important;\n    }\n    .dx-stage-inner { transition: none !important }\n  }\n\n  /* ═══ ambient foundation ══════════════════════════════════════════════\n     A single soft field behind everything, so the page reads as a lit\n     surface rather than a flat fill. Two wide radial washes only — no\n     particles, no animation, nothing that competes with the data. */\n  body { background: var(--color-bg); }\n  .dx-app {\n    position: relative; min-height: 100vh;\n    background:\n      radial-gradient(1200px 680px at 12% -8%, color-mix(in srgb, var(--color-accent) 12%, transparent), transparent 60%),\n      radial-gradient(980px 620px at 92% 4%, color-mix(in srgb, var(--color-accent-2) 10%, transparent), transparent 58%),\n      var(--color-bg);\n  }\n  .dx-dark .dx-app {\n    background:\n      radial-gradient(1200px 680px at 12% -8%, color-mix(in srgb, var(--color-accent) 17%, transparent), transparent 60%),\n      radial-gradient(980px 620px at 92% 4%, color-mix(in srgb, var(--color-accent-2) 12%, transparent), transparent 58%),\n      var(--color-bg);\n  }\n\n  /* ═══ surfaces ════════════════════════════════════════════════════════\n     Three distinct roles rather than one card style repeated: raised\n     panels hold content, inset wells hold readouts, and the stage holds\n     the column. */\n  .card {\n    background: var(--dx-raised);\n    border: 1px solid var(--dx-hairline);\n    border-radius: var(--dx-r-lg);\n    box-shadow: var(--shadow-sm);\n    transition: box-shadow var(--dx-t-base) var(--dx-ease),\n                transform  var(--dx-t-base) var(--dx-ease),\n                border-color var(--dx-t-base) var(--dx-ease);\n  }\n  .dx-dark .card { background: var(--dx-raised); }\n  /* The blueprint corner ticks were the old visual signature. Kept, but\n     dialled back so they read as a registration mark, not a frame. */\n  .blueprint > .corner { opacity: .3; }\n  .card.blueprint:hover > .corner { opacity: .55; }\n\n  /* Hover elevation only where the card is genuinely interactive. */\n  .dx-lift { cursor: pointer; }\n  .dx-lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-md);\n                   border-color: color-mix(in srgb, var(--color-accent) 30%, var(--dx-hairline)); }\n  .dx-lift:active { transform: translateY(0); }\n\n  /* Inset well — recessed, for numeric readouts and tables. */\n  .dx-well {\n    background: var(--color-surface);\n    border: 1px solid var(--dx-hairline);\n    border-radius: var(--dx-r-md);\n    box-shadow: inset 0 1px 2px color-mix(in srgb, #1b2354 5%, transparent);\n  }\n  .dx-dark .dx-well { box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }\n\n  /* ═══ typography ══════════════════════════════════════════════════════ */\n  h1,h2,h3 { letter-spacing: -.018em; }\n  .dx-title { font-family: var(--font-heading); font-size: clamp(22px,2.3vw,30px);\n              letter-spacing: -.02em; margin: 0; line-height: 1.12; }\n  .dx-sub { margin: 0; font-size: 13.5px; line-height: 1.6;\n            color: color-mix(in srgb, var(--color-text) 72%, transparent); max-width: 74ch; }\n  .card-kicker, .dx-kicker {\n    font-size: 10px; letter-spacing: .13em; text-transform: uppercase;\n    font-weight: 600; color: var(--dx-ink-accent);\n  }\n  .dx-num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }\n\n  /* ═══ page header ═════════════════════════════════════════════════════ */\n  .dx-head { display:flex; align-items:flex-end; justify-content:space-between;\n             gap:18px; flex-wrap:wrap; padding: 4px 0 2px; }\n  .dx-head-l { display:flex; flex-direction:column; gap:5px; min-width:0; }\n\n  /* ═══ metric readout ══════════════════════════════════════════════════ */\n  .dx-metric { display:flex; align-items:baseline; justify-content:space-between;\n               gap:12px; padding:7px 0; border-bottom:1px solid var(--dx-hairline); }\n  .dx-metric:last-child { border-bottom:0 }\n  .dx-metric-k { font-size:12.5px; color: color-mix(in srgb, var(--color-text) 74%, transparent); }\n  .dx-metric-v { font-size:14px; font-variant-numeric:tabular-nums; font-weight:600;\n                 transition: color var(--dx-t-slow) var(--dx-ease); }\n\n  /* ═══ status dot ══════════════════════════════════════════════════════ */\n  .dx-dot { width:7px; height:7px; border-radius:50%; flex:none; display:inline-block;\n            background: var(--dx-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dx-ok) 20%, transparent); }\n  .dx-dot.live { animation: dxBreathe 2.6s var(--dx-ease) infinite }\n  .dx-dot.warn { background: var(--dx-warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dx-warn) 20%, transparent) }\n  .dx-dot.err  { background: var(--dx-err);  box-shadow: 0 0 0 3px color-mix(in srgb, var(--dx-err) 20%, transparent) }\n\n  /* ═══ controls ════════════════════════════════════════════════════════ */\n  .btn {\n    border-radius: var(--dx-r-sm); font-weight: 500;\n    transition: background var(--dx-t-fast) var(--dx-ease),\n                border-color var(--dx-t-fast) var(--dx-ease),\n                transform var(--dx-t-fast) var(--dx-ease),\n                box-shadow var(--dx-t-fast) var(--dx-ease);\n  }\n  .btn:active { transform: translateY(1px) }\n  .btn:focus-visible { outline: none; box-shadow: var(--dx-glow) }\n  .btn-primary { background: var(--dx-ink-accent); border-color: var(--dx-ink-accent);\n                 box-shadow: var(--shadow-sm) }\n  .btn-primary:hover { background: var(--color-accent-800); border-color: var(--color-accent-800);\n                       box-shadow: var(--shadow-md) }\n  .dx-dark .btn-primary:hover { background: var(--color-accent-800); border-color: var(--color-accent-800) }\n  .btn-secondary { border-color: var(--color-divider); border-radius: var(--dx-r-sm) }\n  a, .btn-ghost, .tag-outline { color: var(--dx-ink-accent) }\n  .nav a:hover, .nav a[aria-current='page'] { color: var(--dx-ink-accent) }\n\n  .input, select.input {\n    border-radius: var(--dx-r-sm);\n    background: var(--dx-raised);\n    transition: border-color var(--dx-t-fast) var(--dx-ease), box-shadow var(--dx-t-fast) var(--dx-ease);\n  }\n  .input:focus-visible, select.input:focus-visible { outline: none; border-color: var(--color-accent);\n                                                     box-shadow: var(--dx-glow) }\n\n  .seg { border-radius: var(--dx-r-sm); overflow: hidden; background: var(--color-surface) }\n  .seg-opt { transition: background var(--dx-t-fast) var(--dx-ease), color var(--dx-t-fast) var(--dx-ease) }\n  .seg-opt:has(input:checked) { background: var(--dx-ink-accent); box-shadow: var(--shadow-sm) }\n\n  input[type=range] { accent-color: var(--color-accent); }\n\n  /* ═══ nav ═════════════════════════════════════════════════════════════ */\n  .dx-nav {\n    position: sticky; top: 0; z-index: 40;\n    background: color-mix(in srgb, var(--color-bg) 82%, transparent);\n    backdrop-filter: saturate(150%) blur(14px);\n    -webkit-backdrop-filter: saturate(150%) blur(14px);\n    border-bottom: 1px solid var(--dx-hairline);\n  }\n  .dx-navbtn { position: relative; border-radius: var(--dx-r-sm); }\n  .dx-navbtn::after {\n    content: ''; position: absolute; left: 10px; right: 10px; bottom: 3px; height: 2px;\n    border-radius: 2px; background: var(--dx-ink-accent);\n    transform: scaleX(0); transform-origin: center;\n    transition: transform var(--dx-t-base) var(--dx-spring);\n  }\n  .dx-navbtn[data-on='1']::after { transform: scaleX(1) }\n\n  /* ═══ tables ══════════════════════════════════════════════════════════ */\n  .table thead th {\n    position: sticky; top: 0; z-index: 1;\n    background: var(--color-surface);\n    font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;\n  }\n  .table tbody tr { transition: background var(--dx-t-fast) linear }\n  .table tbody tr:hover { background: color-mix(in srgb, var(--color-accent) 7%, transparent) }\n\n  /* ═══ 3D column stage ═════════════════════════════════════════════════\n     CSS 3D, not WebGL. The project ships as one self-contained file with a\n     Content-Security-Policy that allows no external script origin, so a\n     WebGL library cannot be loaded — and for a schematic column it would\n     buy nothing. Perspective plus transformed layers gives real depth at\n     effectively zero cost. */\n  .dx-stage {\n    position: relative; border-radius: var(--dx-r-lg); overflow: hidden;\n    background:\n      radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--color-accent) 9%, transparent), transparent 62%),\n      linear-gradient(180deg, var(--dx-raised), var(--color-surface));\n    border: 1px solid var(--dx-hairline);\n    box-shadow: var(--shadow-md);\n    perspective: 1400px; perspective-origin: 50% 42%;\n  }\n  .dx-stage-inner {\n    transform-style: preserve-3d;\n    transition: transform var(--dx-t-slow) var(--dx-ease);\n    will-change: transform;\n  }\n  /* Viewpoints. Each is a single transform so switching interpolates. */\n  .dx-vp-front { transform: none }\n  .dx-vp-iso   { transform: rotateX(16deg) rotateY(-22deg) rotateZ(1deg) scale(.92) }\n  .dx-vp-side  { transform: rotateY(-58deg) scale(.9) }\n  .dx-vp-top   { transform: rotateX(82deg) scale(.74) }\n  .dx-vp-xpl   { transform: rotateX(20deg) rotateY(-18deg) scale(.88) }\n  /* Exploded pulls the annotation plane away from the vessel plane. */\n  .dx-vp-xpl .dx-layer-notes { transform: translateZ(120px) }\n  /* callouts are unreadable edge-on, so they step aside in those two views */\n  .dx-vp-side .dx-layer-notes, .dx-vp-top .dx-layer-notes { opacity:0 }\n  .dx-vp-xpl .dx-layer-flow  { transform: translateZ(56px) }\n  .dx-layer-notes, .dx-layer-flow { transition: transform var(--dx-t-slow) var(--dx-ease) }\n  .dx-stage-grid {\n    position:absolute; inset:0; pointer-events:none; opacity:.5;\n    background-image:\n      linear-gradient(var(--dx-hairline) 1px, transparent 1px),\n      linear-gradient(90deg, var(--dx-hairline) 1px, transparent 1px);\n    background-size: 34px 34px;\n    mask-image: radial-gradient(120% 90% at 50% 40%, #000 35%, transparent 78%);\n    -webkit-mask-image: radial-gradient(120% 90% at 50% 40%, #000 35%, transparent 78%);\n  }\n\n  /* ═══ progressive disclosure ══════════════════════════════════════════\n     Native <details>, so it is keyboard-reachable and announced without any\n     script. Used to move the standing explanations off the first screen\n     while keeping every word of them one click away. */\n  .dx-dis { border-top:1px solid var(--dx-hairline); margin-top:2px }\n  .dx-dis > summary {\n    list-style:none; cursor:pointer; padding:7px 0 6px;\n    display:flex; align-items:center; gap:7px;\n    font-size:11.5px; font-weight:600; letter-spacing:.02em;\n    color:var(--dx-ink-accent);\n  }\n  .dx-dis > summary::-webkit-details-marker { display:none }\n  .dx-dis > summary::before {\n    content:''; width:7px; height:7px; flex:none;\n    border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor;\n    transform:rotate(-45deg) translate(-1px,-1px);\n    transition:transform var(--dx-t-base) var(--dx-ease);\n  }\n  .dx-dis[open] > summary::before { transform:rotate(45deg) translate(-2px,-2px) }\n  .dx-dis > summary:focus-visible { outline:none; box-shadow:var(--dx-glow); border-radius:var(--dx-r-sm) }\n  .dx-dis > .dx-dis-b {\n    font-size:11.5px; line-height:1.55; padding:0 0 9px;\n    color:color-mix(in srgb, var(--color-text) 74%, transparent);\n    animation:dxIn var(--dx-t-base) var(--dx-ease) both;\n  }\n\n  /* ═══ footer ══════════════════════════════════════════════════════════ */\n  .dx-sig {\n    margin-top: 26px; padding: 14px 0 20px;\n    border-top: 1px solid var(--dx-hairline);\n    display: flex; align-items: center; justify-content: center; gap: 10px;\n    font-size: 11px; letter-spacing: .04em;\n    color: color-mix(in srgb, var(--color-text) 62%, transparent);\n  }\n  .dx-sig b { font-weight: 600; letter-spacing: .07em;\n              color: color-mix(in srgb, var(--color-text) 82%, transparent) }\n\n  /* ═══ entrance motion ═════════════════════════════════════════════════ */\n  @keyframes dxIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }\n  @keyframes dxBreathe { 0%,100% { opacity: 1 } 50% { opacity: .45 } }\n  .dx-in { animation: dxIn var(--dx-t-slow) var(--dx-ease) both }\n  .dx-in-1 { animation-delay: 40ms } .dx-in-2 { animation-delay: 90ms }\n  .dx-in-3 { animation-delay: 140ms } .dx-in-4 { animation-delay: 190ms }\n\n  /* ═══ the column itself ═══════════════════════════════════════════════\n     A real 3D assembly, not a picture of one: the vessel is a ring of\n     vertical slats at a fixed radius, and every tray is a horizontal plane\n     rotated flat. That means perspective does the work — trays read as thin\n     ellipses head-on and open into full discs as the view rotates, which is\n     exactly how a cutaway of a real column behaves. */\n  .dx-col { position:relative; transform-style:preserve-3d; margin:0 auto; }\n  .dx-col-mid { position:absolute; left:50%; top:0; transform-style:preserve-3d; }\n\n  .dx-slat {\n    position:absolute; left:0; top:0; transform-origin:50% 50%;\n    background:linear-gradient(90deg,\n      color-mix(in srgb, var(--color-accent) 15%, transparent),\n      color-mix(in srgb, var(--color-accent) 3%, transparent) 45%,\n      color-mix(in srgb, var(--color-accent) 15%, transparent));\n    border-top:1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);\n    border-bottom:1px solid color-mix(in srgb, var(--color-accent) 30%, transparent);\n    backface-visibility:visible;\n  }\n  /* The shell carries the temperature profile: cool overhead, warm sump.\n     It is a reading of Ttop/Tbot, not decoration — the gradient stops are\n     set from the solved values. */\n  .dx-therm {\n    position:absolute; left:0; top:0; pointer-events:none; border-radius:3px;\n    opacity:.34; transform:translateZ(-1px);\n  }\n  .dx-dark .dx-therm { opacity:.24 }\n\n  .dx-tray {\n    position:absolute; border-radius:50%; transform-style:preserve-3d;\n    border:1.5px solid color-mix(in srgb, var(--dx-liquid) 85%, transparent);\n    background:radial-gradient(circle at 50% 50%,\n      color-mix(in srgb, var(--dx-liquid) 55%, transparent),\n      color-mix(in srgb, var(--dx-liquid) 26%, transparent) 72%, transparent);\n    box-shadow:0 0 10px color-mix(in srgb, var(--dx-liquid) 22%, transparent);\n    transition:background var(--dx-t-slow) var(--dx-ease), border-color var(--dx-t-base) var(--dx-ease);\n  }\n  .dx-tray.feed {\n    border-color:var(--dx-violet);\n    background:radial-gradient(circle at 50% 50%,\n      color-mix(in srgb, var(--dx-violet) 42%, transparent),\n      color-mix(in srgb, var(--dx-violet) 14%, transparent) 72%, transparent);\n    box-shadow:0 0 14px color-mix(in srgb, var(--dx-violet) 40%, transparent);\n  }\n  .dx-tray.hot { border-color:color-mix(in srgb, var(--dx-warn) 70%, transparent) }\n\n  /* Traffic. Two populations moving in opposite directions: vapour up,\n     liquid down. The outer node places the particle in space, the inner\n     node animates, so the animation never clobbers the depth transform. */\n  .dx-p { position:absolute; transform-style:preserve-3d; pointer-events:none }\n  .dx-p i {\n    display:block; border-radius:50%;\n    animation-timing-function:linear; animation-iteration-count:infinite;\n  }\n  .dx-p.up i   { background:var(--dx-vapour); animation-name:dxUp;\n                 box-shadow:0 0 6px color-mix(in srgb, var(--dx-vapour) 70%, transparent) }\n  .dx-p.down i { background:var(--dx-liquid); animation-name:dxDown }\n  @keyframes dxUp   { 0% { transform:translateY(0); opacity:0 } 12%,80% { opacity:.95 } 100% { transform:translateY(-56px); opacity:0 } }\n  @keyframes dxDown { 0% { transform:translateY(0); opacity:0 } 12%,80% { opacity:.8 }  100% { transform:translateY(56px); opacity:0 } }\n  /* paused state: traffic holds still rather than vanishing */\n  .dx-col.paused .dx-p i { animation-play-state:paused; opacity:.55 }\n\n  /* Annotation plane — callouts sit in front of the vessel and pull away\n     in the exploded view. */\n  .dx-note {\n    position:absolute; font-size:10.5px; letter-spacing:.06em; line-height:1.35;\n    text-transform:uppercase; font-weight:600; white-space:nowrap;\n    color:color-mix(in srgb, var(--color-text) 74%, transparent);\n  }\n  .dx-note b { display:block; font-size:12px; letter-spacing:-.01em; text-transform:none;\n               font-variant-numeric:tabular-nums; color:var(--color-text) }\n  .dx-note::before {\n    content:''; position:absolute; top:6px; width:22px; height:1px;\n    background:color-mix(in srgb, var(--color-text) 34%, transparent);\n  }\n  .dx-note.l { text-align:right } .dx-note.l::before { right:-26px }\n  .dx-note.r::before { left:-26px }\n\n  /* Vessel heads and the two drums, drawn as flat plates on the mid plane. */\n  .dx-cap {\n    position:absolute; border-radius:50%;\n    border:1px solid color-mix(in srgb, var(--color-accent) 55%, transparent);\n    background:color-mix(in srgb, var(--color-accent) 16%, transparent);\n  }\n  .dx-vp-btns { display:flex; gap:2px; background:var(--color-surface);\n                border-radius:var(--dx-r-sm); padding:2px }\n  .dx-vp-btns .btn { min-height:28px; font-size:11.5px; padding:3px 9px; border-color:transparent;\n                     background:transparent; letter-spacing:.02em }\n  .dx-vp-btns .btn[data-on='1'] { background:var(--dx-raised); box-shadow:var(--shadow-sm);\n                                  color:var(--dx-ink-accent); font-weight:600 }\n\n  /* ═══ existing motion, retained ═══════════════════════════════════════ */\n  @keyframes dxRise { from { transform: translateY(10px); opacity: 0 } 25% { opacity: 1 } 75% { opacity: 1 } to { transform: translateY(-26px); opacity: 0 } }\n  @keyframes dxFall { from { transform: translateY(-10px); opacity: 0 } 25% { opacity: 1 } 75% { opacity: 1 } to { transform: translateY(26px); opacity: 0 } }\n  @keyframes dxFlowR { from { stroke-dashoffset: 24 } to { stroke-dashoffset: 0 } }\n  @keyframes dxFlowL { from { stroke-dashoffset: 0 } to { stroke-dashoffset: 24 } }\n  @keyframes dxPulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }\n\n  /* ═══ layout ══════════════════════════════════════════════════════════ */\n  .dx-grid3 { display:grid; grid-template-columns:minmax(0,330px) minmax(0,1fr) minmax(0,310px); gap:18px; align-items:start }\n  .dx-grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; align-items:start }\n  .dx-grid3b { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; align-items:start }\n  .dx-side { display:grid; grid-template-columns:minmax(0,310px) minmax(0,1fr); gap:18px; align-items:start }\n  .dx-hero { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:56px; align-items:center; padding:72px 0 60px }\n  @media (max-width:1180px){ .dx-grid3 { grid-template-columns:minmax(0,1fr) } .dx-grid3b { grid-template-columns:minmax(0,1fr) } }\n  @media (max-width:900px){\n    .dx-hero { grid-template-columns:minmax(0,1fr); gap:28px; padding:34px 0 28px }\n    /* Touch target size (WCAG 2.5.8). The markup sets 30-36px heights inline\n       for the desktop density, so these are scoped to narrow viewports and\n       need !important to override the inline values. Desktop is unchanged. */\n    .dx .btn, .dx button.btn { min-height:44px !important; min-width:44px }\n    .dx .input, .dx select.input { min-height:44px !important }\n    .dx .seg-opt { min-height:44px }\n    .dx input[type=range] { height:44px }\n    .dx-grid2 { grid-template-columns:minmax(0,1fr) } .dx-side { grid-template-columns:minmax(0,1fr) }\n    /* Ten destinations wrapped to three rows on a phone and swallowed the\n       first screen. One swipeable rail instead: every item stays reachable,\n       the active one is scrolled into view, and the page itself never\n       scrolls sideways because the overflow is on this element. */\n    .dx-nav nav { flex-wrap:nowrap; overflow-x:auto; scroll-snap-type:x proximity;\n                  -webkit-overflow-scrolling:touch; scrollbar-width:none;\n                  margin-inline:-4px; padding-inline:4px }\n    .dx-nav nav::-webkit-scrollbar { display:none }\n    .dx-nav nav .btn { flex:none; scroll-snap-align:center }\n    /* The simulator stage is tall on a small screen. The hero stage is\n       square by aspect-ratio, so it must keep its own sizing — forcing a\n       height on it makes it wider than the viewport. */\n    .dx-stage:not(.dx-stage-hero) { height:340px !important }\n  }\n  @media print { .dx-noprint { display:none !important } }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div class=\"dx {{ themeClass }}\" style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:15px\">\n\n<sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"dx-app\" style=\"padding:0 24px 44px\">\n<div style=\"max-width:1180px;margin:0 auto\">\n  <div style=\"display:flex;align-items:center;gap:12px;padding:22px 0 0;flex-wrap:wrap\">\n    <div style=\"width:22px;height:22px;border:1px solid var(--color-accent);position:relative\">\n      <div style=\"position:absolute;inset:4px 4px auto 4px;height:1px;background:var(--color-accent)\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:auto 4px 4px 4px;height:1px;background:var(--color-accent)\"><\u002Fdiv>\n      <div style=\"position:absolute;top:0;bottom:0;left:10px;width:1px;background:var(--color-accent)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <span style=\"font-family:var(--font-heading);font-size:19px;letter-spacing:.14em\">DISTILLEX<\u002Fspan>\n    <span class=\"tag tag-outline\" style=\"margin-left:4px\">v1.0<\u002Fspan>\n    <div style=\"margin-left:auto;display:flex;gap:8px\">\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleTheme }}\">{{ themeLabel }}<\u002Fbutton>\n      <button class=\"btn btn-secondary\" data-v=\"theory\" sc-camel-on-click=\"{{ go }}\">Theory<\u002Fbutton>\n      <button class=\"btn btn-primary\" data-v=\"sim\" sc-camel-on-click=\"{{ go }}\">Launch simulator<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height:1px;background:var(--color-divider);margin:18px 0 0\"><\u002Fdiv>\n\n  <div class=\"dx-hero\">\n    <div>\n      <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dx-ink-accent);margin-bottom:18px\">Separation processes · Unit operations laboratory<\u002Fdiv>\n      <h1 style=\"font-size:clamp(40px,11vw,76px);letter-spacing:.02em;margin:0 0 8px;line-height:.98\">DISTILLEX<\u002Fh1>\n      <h3 style=\"font-weight:400;font-size:26px;margin:0 0 18px;color:color-mix(in srgb,var(--color-text) 78%,transparent)\">Interactive Fractional Distillation Laboratory<\u002Fh3>\n      <p style=\"max-width:52ch;font-size:16px;color:color-mix(in srgb,var(--color-text) 72%,transparent);text-wrap:pretty\">Understand separation by controlling the column yourself. Explore vapour–liquid equilibrium, column operation, stagewise separation and process design — every number on screen is computed in your browser from the thermodynamic model you select.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:26px\">\n        <button class=\"btn btn-primary\" data-v=\"sim\" sc-camel-on-click=\"{{ go }}\" style=\"padding:10px 20px;font-size:15px\">Launch simulator<\u002Fbutton>\n        <button class=\"btn btn-secondary\" data-v=\"theory\" sc-camel-on-click=\"{{ go }}\" style=\"padding:10px 20px;font-size:15px\">Explore theory<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ tryExample }}\" style=\"padding:10px 20px;font-size:15px\">Try example<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;font-size:12px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Runs entirely client-side · Ideal VLE (Raoult) and constant-volatility models · No account, no server<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"dx-stage dx-stage-hero\" style=\"aspect-ratio:1/1;display:grid;place-items:center\" role=\"img\" aria-label=\"Three-dimensional cutaway of a fractionating column showing its trays, the feed stage and counter-current vapour and liquid traffic.\">\n      <i class=\"dx-stage-grid\" aria-hidden=\"true\"><\u002Fi>\n      <div class=\"dx-stage-inner dx-vp-iso\" style=\"position:absolute;inset:0;display:grid;place-items:center\">\n        <div class=\"dx-col\" style=\"width:{{ scene.W }}px;height:{{ scene.H }}px\">\n          <div class=\"dx-col-mid\" style=\"height:{{ scene.H }}px\">\n            <sc-for list=\"{{ scene.slats }}\" as=\"sl\" hint-placeholder-count=\"16\">\n              <i class=\"dx-slat\" style=\"{{ sl.style }}\"><\u002Fi>\n            <\u002Fsc-for>\n            <i class=\"dx-therm\" style=\"{{ scene.thermStyle }}\"><\u002Fi>\n            <sc-for list=\"{{ scene.caps }}\" as=\"cp\" hint-placeholder-count=\"2\">\n              <i class=\"dx-cap\" style=\"{{ cp.style }}\"><\u002Fi>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ scene.trays }}\" as=\"tr2\" hint-placeholder-count=\"12\">\n              <i class=\"{{ tr2.cls }}\" style=\"{{ tr2.style }}\"><\u002Fi>\n            <\u002Fsc-for>\n            <div class=\"dx-layer-flow\" style=\"position:absolute;inset:0;transform-style:preserve-3d\">\n              <sc-for list=\"{{ scene.parts }}\" as=\"p\" hint-placeholder-count=\"18\">\n                <span class=\"{{ p.cls }}\" style=\"{{ p.style }}\"><i style=\"{{ p.dot }}\"><\u002Fi><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:18px;bottom:16px;display:flex;align-items:center;gap:8px\">\n        <span class=\"dx-dot live\" aria-hidden=\"true\"><\u002Fspan>\n        <span class=\"dx-num\" style=\"font-size:11px;letter-spacing:.05em;color:color-mix(in srgb,var(--color-text) 74%,transparent)\">{{ scene.caption }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"dx-grid3b\">\n    <div class=\"card blueprint\" style=\"padding:18px;min-height:170px\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"card-kicker\">01<\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:22px\">VLE<\u002Fdiv>\n      <p class=\"card-body\">Explore vapour–liquid equilibrium. Change pressure, volatility and mixture and watch the x–y curve and boiling envelope respond.<\u002Fp>\n      <button class=\"btn btn-ghost\" data-v=\"vle\" sc-camel-on-click=\"{{ go }}\" style=\"align-self:flex-start\">Open VLE explorer →<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"card blueprint\" style=\"padding:18px;min-height:170px\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"card-kicker\">02<\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:22px\">McCabe–Thiele<\u002Fdiv>\n      <p class=\"card-body\">Build and analyse theoretical stages. Drag the specifications, set the q-line and step the stages one at a time.<\u002Fp>\n      <button class=\"btn btn-ghost\" data-v=\"mt\" sc-camel-on-click=\"{{ go }}\" style=\"align-self:flex-start\">Open diagram →<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"card blueprint\" style=\"padding:18px;min-height:170px\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"card-kicker\">03<\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:22px\">Column<\u002Fdiv>\n      <p class=\"card-body\">Control reflux, feed condition and stage count on a live schematic, with tray-by-tray composition, temperature and flow profiles.<\u002Fp>\n      <button class=\"btn btn-ghost\" data-v=\"sim\" sc-camel-on-click=\"{{ go }}\" style=\"align-self:flex-start\">Open column →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin-top:40px;font-size:11px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 72%,transparent);max-width:88ch\">This simulator is intended for education and conceptual engineering analysis. Results depend on the selected thermodynamic model and assumptions and should not be used as the sole basis for industrial process design.<\u002Fp>\n  <div class=\"dx-sig\"><b>Shafin Ahamed Neon<\u002Fb><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isApp }}\">\n<div class=\"dx-app\" style=\"display:flex;flex-direction:column;min-height:100vh\">\n\n  <header class=\"nav dx-nav dx-noprint\" style=\"padding:9px 18px;gap:14px;flex-wrap:wrap\">\n    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ home }}\" style=\"gap:9px;padding:2px 6px;margin-right:2px;color:var(--color-text)\" aria-label=\"DISTILLEX home\">\n      <span style=\"display:inline-block;width:15px;height:15px;border:1.5px solid var(--color-accent);border-radius:3px;position:relative\"><\u002Fspan>\n      <span style=\"font-family:var(--font-heading);font-size:16px;letter-spacing:.15em\">DISTILLEX<\u002Fspan>\n    <\u002Fbutton>\n    <nav style=\"display:flex;flex-wrap:wrap;gap:1px;margin-right:auto\">\n      <sc-for list=\"{{ navItems }}\" as=\"it\" hint-placeholder-count=\"9\">\n        <button class=\"btn dx-navbtn\" data-v=\"{{ it.k }}\" data-on=\"{{ it.on }}\" aria-current=\"{{ it.cur }}\" sc-camel-on-click=\"{{ go }}\" style=\"{{ it.style }}\">{{ it.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap\">\n      <sc-raw-select class=\"input\" value=\"{{ v.mode }}\" data-k=\"mode\" sc-camel-on-change=\"{{ setStr }}\" style=\"width:auto;min-height:32px;font-size:12px\" aria-label=\"Interface detail level\">\n        <option value=\"learning\">Learning mode<\u002Foption>\n        <option value=\"engineering\">Engineering mode<\u002Foption>\n        <option value=\"advanced\">Advanced mode<\u002Foption>\n      <\u002Fsc-raw-select>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ reset }}\" title=\"Reset to the demonstration case\" style=\"min-height:32px\">Reset<\u002Fbutton>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ saveCfg }}\" title=\"Save configuration as JSON\" style=\"min-height:32px\">Save<\u002Fbutton>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ loadClick }}\" title=\"Load a saved configuration\" style=\"min-height:32px\">Load<\u002Fbutton>\n      <button class=\"btn btn-secondary\" data-v=\"results\" sc-camel-on-click=\"{{ go }}\" title=\"Export results\" style=\"min-height:32px\">Export<\u002Fbutton>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleTheme }}\" title=\"Toggle dark mode\" style=\"min-height:32px;width:34px;padding:0\">{{ themeIcon }}<\u002Fbutton>\n      <input type=\"file\" accept=\"application/json\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ loadCfg }}\" style=\"display:none\">\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ hasIssues }}\">\n    <div class=\"dx-noprint\" role=\"alert\" aria-live=\"assertive\" style=\"padding:8px 16px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--color-divider)\">\n      <sc-for list=\"{{ issues }}\" as=\"m\" hint-placeholder-count=\"1\">\n        <div style=\"{{ m.style }}\">{{ m.text }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main style=\"flex:1;padding:16px;max-width:1600px;width:100%;margin:0 auto\">\n\n    <sc-if value=\"{{ isSim }}\">\n      <div class=\"dx-grid3\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <section class=\"card blueprint\" style=\"padding:14px;gap:12px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Mixture &amp; model<\u002Fh6>\n            <div class=\"field\">\n              <label for=\"dx-mix\">Binary mixture<\u002Flabel>\n              <sc-raw-select class=\"input\" id=\"dx-mix\" value=\"{{ v.mixKey }}\" data-k=\"mixKey\" sc-camel-on-change=\"{{ setStr }}\">\n                <sc-for list=\"{{ mixOptions }}\" as=\"m\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ m.k }}\">{{ m.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <details class=\"dx-dis\"><summary>About this mixture<\u002Fsummary><div class=\"dx-dis-b\">{{ r.mixNote }}<\u002Fdiv><\u002Fdetails>\n            <div class=\"field\">\n              <label>Thermodynamic model<\u002Flabel>\n              <div class=\"seg\" style=\"width:100%\">\n                <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxmodel\" value=\"raoult\" checked=\"{{ isRaoult }}\" data-k=\"model\" sc-camel-on-change=\"{{ setStr }}\"><span>Raoult / ideal<\u002Fspan><\u002Flabel>\n                <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxmodel\" value=\"alpha\" checked=\"{{ isAlpha }}\" data-k=\"model\" sc-camel-on-change=\"{{ setStr }}\"><span>Constant α<\u002Fspan><\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isAlpha }}\">\n              <div class=\"field\">\n                <label style=\"display:flex;justify-content:space-between\"><span>Relative volatility α<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.alphaC }}<\u002Fspan><\u002Flabel>\n                <input type=\"range\" min=\"1.05\" max=\"12\" step=\"0.05\" value=\"{{ v.alphaC }}\" data-k=\"alphaC\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Relative volatility alpha\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">Activity-coefficient models (NRTL, Wilson, UNIQUAC) — planned.<\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Column pressure — kPa<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.P }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"10\" max=\"600\" step=\"1\" value=\"{{ v.P }}\" data-k=\"P\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Column pressure, kPa\">\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"card blueprint\" style=\"padding:14px;gap:12px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Feed conditions<\u002Fh6>\n            <div class=\"dx-grid2\" style=\"gap:8px\">\n              <div class=\"field\"><label for=\"dx-F\">Flowrate F — kmol/h<\u002Flabel><input class=\"input\" id=\"dx-F\" type=\"number\" min=\"0.1\" step=\"1\" value=\"{{ v.F }}\" data-k=\"F\" sc-camel-on-change=\"{{ setNum }}\"><\u002Fdiv>\n              <div class=\"field\"><label for=\"dx-Tf\">Feed pressure — kPa<\u002Flabel><input class=\"input\" id=\"dx-Tf\" type=\"number\" min=\"1\" step=\"1\" value=\"{{ v.P }}\" disabled=\"{{ true }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Composition z<sub>F<\u002Fsub><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.zF }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.02\" max=\"0.98\" step=\"0.005\" value=\"{{ v.zF }}\" data-k=\"zF\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Feed composition z_F, mole fraction\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Feed quality q<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.q }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"-0.5\" max=\"1.5\" step=\"0.01\" value=\"{{ v.q }}\" data-k=\"q\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Feed quality q\">\n              <div style=\"display:flex;justify-content:space-between;font-size:11px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\"><span>{{ r.qPhase }}<\u002Fspan><span>T<sub>bubble<\u002Fsub> {{ r.Tfeed }} °C<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section class=\"card blueprint\" style=\"padding:14px;gap:8px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">{{ modeTitle }}<\u002Fh6>\n            <sc-for list=\"{{ modeLines }}\" as=\"ln\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:8px;font-size:12px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 78%,transparent)\"><span style=\"color:var(--dx-ink-accent)\">—<\u002Fspan><span>{{ ln }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n\n          <section class=\"card blueprint\" style=\"padding:14px;gap:12px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <h6 style=\"margin:0;color:var(--dx-ink-accent)\">Specification<\u002Fh6>\n            <div class=\"seg\" style=\"width:100%\">\n              <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxcalc\" value=\"design\" checked=\"{{ isDesign }}\" data-k=\"calcMode\" sc-camel-on-change=\"{{ setStr }}\"><span>Design<\u002Fspan><\u002Flabel>\n              <label class=\"seg-opt\" style=\"flex:1;justify-content:center\"><input type=\"radio\" name=\"dxcalc\" value=\"rating\" checked=\"{{ isRating }}\" data-k=\"calcMode\" sc-camel-on-change=\"{{ setStr }}\"><span>Rating<\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ specNote }}<\u002Fdiv>\n            <sc-if value=\"{{ isDesign }}\">\n              <div class=\"field\">\n                <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Distillate x<sub>D<\u002Fsub><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.xD }}<\u002Fspan><\u002Flabel>\n                <input type=\"range\" min=\"0.05\" max=\"0.999\" step=\"0.001\" value=\"{{ v.xD }}\" data-k=\"xD\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Distillate composition x_D, mole fraction\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Bottoms x<sub>B<\u002Fsub><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.xB }}<\u002Fspan><\u002Flabel>\n                <input type=\"range\" min=\"0.001\" max=\"0.95\" step=\"0.001\" value=\"{{ v.xB }}\" data-k=\"xB\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Bottoms composition x_B, mole fraction\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isRating }}\">\n              <div class=\"field\">\n                <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Theoretical stages N (incl. reboiler)<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.Nspec }}<\u002Fspan><\u002Flabel>\n                <input type=\"range\" min=\"3\" max=\"60\" step=\"1\" value=\"{{ v.Nspec }}\" data-k=\"Nspec\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Theoretical stages N, including the reboiler\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Distillate cut D/F<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.DF }}<\u002Fspan><\u002Flabel>\n                <input type=\"range\" min=\"0.05\" max=\"0.95\" step=\"0.005\" value=\"{{ v.DF }}\" data-k=\"DF\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Distillate cut D over F\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Reflux ratio R = L/D <i data-tip=\"R\" sc-camel-on-mouse-enter=\"{{ tipIn }}\" sc-camel-on-mouse-leave=\"{{ tipOut }}\" style=\"display:inline-flex;width:14px;height:14px;border:1px solid var(--color-divider);align-items:center;justify-content:center;font-size:9px;font-style:normal;cursor:help;vertical-align:middle\">i<\u002Fi><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ v.R }}<\u002Fspan><\u002Flabel>\n              <input type=\"range\" min=\"0.1\" max=\"12\" step=\"0.05\" value=\"{{ v.R }}\" data-k=\"R\" sc-camel-on-change=\"{{ setNum }}\" style=\"width:100%;accent-color:var(--color-accent)\" aria-label=\"Reflux ratio R\">\n              <div style=\"display:flex;justify-content:space-between;font-size:11px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 72%,transparent)\"><span>R<sub>min<\u002Fsub> = {{ r.Rmin }} <i data-tip=\"Rmin\" sc-camel-on-mouse-enter=\"{{ tipIn }}\" sc-camel-on-mouse-leave=\"{{ tipOut }}\" style=\"display:inline-flex;width:13px;height:13px;border:1px solid var(--color-divider);align-items:center;justify-content:center;font-size:9px;font-style:normal;cursor:help;vertical-align:middle\">i<\u002Fi><\u002Fspan><span>R/R<sub>min<\u002Fsub> = {{ r.Rratio }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label style=\"display:flex;justify-content:space-between;align-items:center\"><span>Overall tray efficiency <i data-tip=\"eff\" sc-camel-on-mouse-enter=\"{{ tipIn }}\" sc-camel-on-mouse-leave=\"{{ tipOut }}\" style=\"display:inline-flex;width:14px;height:14px;border:1px solid var(--color-divider);align-items:center;justify-content:center;font-size:9px;font-style:normal;cursor:help;vertical-align:middle\">i<\u002Fi><\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">{{ r.effPc
